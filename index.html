<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>每日英语 - 和搭子一起学</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #007AFF;
  --green: #34C759;
  --orange: #FF9500;
  --yellow: #FFCC00;
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --text: #1C1C1E;
  --text2: #3C3C43;
  --text3: #8E8E93;
  --sep: #E5E5EA;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ===== App Shell ===== */
.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

/* ===== Header ===== */
.header {
  padding: 16px 20px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(242,242,247,0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-logo {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}

.header-logo .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--orange);
}

.header-date {
  font-size: 13px;
  color: var(--text3);
  font-weight: 500;
}

/* ===== Pages ===== */
.page {
  flex: 1;
  display: none;
  flex-direction: column;
  padding: 8px 20px 24px;
}

.page.active { display: flex; }

/* ===== Home Page ===== */

/* Companion Card */
.companion-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px 24px 24px;
  text-align: center;
  margin: 12px 0 20px;
  animation: fadeUp 0.5s ease-out;
}

.companion-avatar {
  font-size: 56px;
  line-height: 1;
  margin-bottom: 12px;
  display: block;
  animation: gentleBounce 2s ease-in-out infinite;
}

@keyframes gentleBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.companion-greeting {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.2px;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 14px;
}

.companion-streak {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #FFF8E8;
  color: var(--orange);
  font-size: 14px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
}

/* CTA Button */
.cta-wrap { margin-bottom: 24px; }

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  padding: 16px 24px;
  transition: all 0.15s;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--blue);
  color: #fff;
  width: 100%;
  height: 54px;
  font-size: 18px;
  letter-spacing: -0.2px;
  box-shadow: 0 4px 14px rgba(0,122,255,0.3);
}

/* Words Preview */
.words-label {
  font-size: 13px;
  color: var(--text3);
  font-weight: 500;
  margin-bottom: 8px;
}

.words-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.word-chip {
  background: var(--card);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text2);
  box-shadow: var(--shadow);
}

/* ===== Tiny "also completed" banner ===== */
.completed-banner {
  margin-top: 20px;
  text-align: center;
  font-size: 13px;
  color: var(--text3);
}

.completed-banner a {
  color: var(--blue);
  cursor: pointer;
  text-decoration: none;
}

/* ===== Learning Page ===== */
.progress-bar-wrap { margin-bottom: 20px; }

.progress-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 12px;
  color: var(--text3);
  font-weight: 500;
}

.progress-bar {
  height: 4px;
  background: #E8E8ED;
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 2px;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.word-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 36px 24px;
  margin-bottom: 16px;
  text-align: center;
  min-height: 240px;
  transition: transform 0.25s, opacity 0.25s;
}

.word-card.swipe-out {
  transform: translateY(-12px);
  opacity: 0;
}

.word-en {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 10px;
  color: var(--text);
}

.word-phonetic {
  font-size: 14px;
  color: var(--text3);
  margin-bottom: 14px;
}

.word-cn {
  font-size: 19px;
  color: var(--text2);
  font-weight: 500;
  line-height: 1.5;
}

/* Companion Reaction Bubble */
.companion-reaction {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 20px;
  min-height: 44px;
}

.reaction-avatar {
  font-size: 28px;
  line-height: 1;
  flex-shrink: 0;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.25s, transform 0.25s;
}

.reaction-avatar.visible {
  opacity: 1;
  transform: translateY(0);
}

.reaction-bubble {
  background: var(--card);
  border-radius: 14px;
  border-top-left-radius: 4px;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--text2);
  line-height: 1.5;
  box-shadow: var(--shadow);
  max-width: 85%;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.25s, transform 0.25s;
}

.reaction-bubble.visible {
  opacity: 1;
  transform: translateY(0);
}

.learn-actions {
  display: flex;
  gap: 12px;
}

.btn-learn {
  flex: 1;
  height: 50px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  transition: all 0.12s;
}

.btn-learn:active { transform: scale(0.95); }

.btn-know {
  background: var(--card);
  color: var(--green);
  border: 1.5px solid #D1F0D9;
}

.btn-unknown {
  background: var(--card);
  color: var(--orange);
  border: 1.5px solid #FFE5CC;
}

/* ===== Complete Page ===== */
.complete-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px 0;
}

.complete-avatar {
  font-size: 64px;
  line-height: 1;
  margin-bottom: 16px;
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}

.complete-summary {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.2px;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.5;
}

.complete-detail {
  font-size: 15px;
  color: var(--text2);
  margin-bottom: 16px;
  line-height: 1.5;
}

.complete-streak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #FFF3E0;
  color: var(--orange);
  font-size: 15px;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: 20px;
  margin-bottom: 20px;
}

.complete-farewell {
  font-size: 16px;
  color: var(--text2);
  font-weight: 500;
  margin-bottom: 28px;
  line-height: 1.5;
}

.btn-farewell {
  background: var(--blue);
  color: #fff;
  width: 100%;
  height: 54px;
  font-size: 18px;
  letter-spacing: -0.2px;
  box-shadow: 0 4px 14px rgba(0,122,255,0.3);
}

.review-link {
  margin-top: 16px;
  font-size: 13px;
  color: var(--text3);
}

.review-link span {
  color: var(--blue);
  cursor: pointer;
}

/* ===== Confetti ===== */
@keyframes confetti {
  0% { transform: translateY(0) rotate(0); opacity: 1; }
  100% { transform: translateY(-180px) rotate(720deg); opacity: 0; }
}

.confetti-piece {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  animation: confetti 1.2s ease-out forwards;
  pointer-events: none;
  z-index: 999;
}

/* ===== Onboarding Overlay ===== */
.onboarding-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.onboarding-sheet {
  background: var(--card);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 28px 24px 36px;
  width: 100%;
  max-width: 480px;
  animation: slideUp 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.onboarding-sheet h2 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 6px;
}

.onboarding-sheet .onboard-sub {
  font-size: 14px;
  color: var(--text3);
  margin-bottom: 20px;
}

.goal-options { display: flex; flex-direction: column; gap: 10px; }

.goal-option {
  background: var(--bg);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  padding: 16px 18px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.15s;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.goal-option:active { transform: scale(0.98); background: #E8E8ED; }
.goal-option.selected { border-color: var(--blue); background: #E8F2FF; }
.goal-option .goal-emoji { font-size: 28px; }
.goal-option .goal-label { font-size: 16px; }
.goal-option .goal-hint { font-size: 12px; color: var(--text3); font-weight: 400; }

.goal-confirm {
  margin-top: 16px;
  width: 100%;
  height: 50px;
  border-radius: 14px;
  border: none;
  background: var(--blue);
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  opacity: 0.4;
  pointer-events: none;
}

.goal-confirm.active { opacity: 1; pointer-events: auto; }
.goal-confirm:active { transform: scale(0.97); }

/* ===== Review Badge ===== */
.review-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #FFF0F5;
  color: #FF2D55;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 10px;
  margin-bottom: 8px;
}

.word-card .review-tag {
  font-size: 11px;
  font-weight: 600;
  color: var(--pink);
  background: #FFF0F5;
  padding: 3px 10px;
  border-radius: 8px;
  margin-bottom: 12px;
}

/* ===== Animations ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-up { animation: fadeUp 0.4s ease-out; }

/* ===== Responsive ===== */
@media (min-width: 480px) {
  .app { border-left: 1px solid var(--sep); border-right: 1px solid var(--sep); }
}

@media (max-width: 360px) {
  .companion-avatar { font-size: 46px; }
  .companion-greeting { font-size: 16px; }
  .word-en { font-size: 28px; }
  .word-cn { font-size: 17px; }
  .complete-avatar { font-size: 52px; }
  .complete-summary { font-size: 17px; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      每日英语<span class="dot"></span>
    </div>
    <div class="header-date" id="headerDate"></div>
  </header>

  <!-- ===== Home Page ===== -->
  <main class="page active" id="page-home">
    <!-- Companion Card -->
    <div class="companion-card" id="companionCard">
      <span class="companion-avatar">🐣</span>
      <div class="companion-greeting" id="companionGreeting"></div>
      <div class="companion-streak" id="companionStreak"></div>
      <div style="margin-top:8px" id="goalTag"></div>
    </div>

    <!-- Review reminder -->
    <div class="review-badge" id="reviewBadge" style="display:none;margin-bottom:12px"></div>

    <!-- CTA -->
    <div class="cta-wrap">
      <button class="btn btn-primary" id="btnStart" onclick="startLearning()">
        好呀，开始今天的5个词 →
      </button>
    </div>

    <!-- Today's words -->
    <div class="words-label" id="wordsLabel">今天要见的5个词：</div>
    <div class="words-preview" id="wordsPreview"></div>

    <!-- Already completed -->
    <div class="completed-banner" id="completedBanner" style="display:none"></div>
  </main>

  <!-- ===== Learning Page ===== -->
  <main class="page" id="page-learn">
    <div class="progress-bar-wrap">
      <div class="progress-info">
        <span id="progressLabel">进度</span>
        <span id="progressText">1 / 5</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="word-card fade-up" id="wordCard">
      <div class="review-tag" id="reviewTag" style="display:none">🔄 昨日未掌握</div>
      <div class="word-en" id="wordEn"></div>
      <div class="word-phonetic" id="wordPhonetic"></div>
      <div class="word-cn" id="wordCn"></div>
    </div>

    <!-- 小E reaction -->
    <div class="companion-reaction" id="reactionArea">
      <span class="reaction-avatar" id="reactionAvatar">🐣</span>
      <div class="reaction-bubble" id="reactionBubble"></div>
    </div>

    <div class="learn-actions">
      <button class="btn btn-learn btn-unknown" id="btnUnknown" onclick="markWord('unknown')">
        🤔 不认识
      </button>
      <button class="btn btn-learn btn-know" id="btnKnow" onclick="markWord('know')">
        ✅ 认识
      </button>
    </div>
  </main>

  <!-- ===== Complete Page ===== -->
  <main class="page" id="page-complete">
    <div class="complete-content">
      <div class="complete-avatar">🐣</div>
      <div class="complete-summary" id="completeSummary"></div>
      <div class="complete-detail" id="completeDetail"></div>
      <div class="complete-streak" id="completeStreakBadge"></div>
      <div class="complete-farewell" id="completeFarewell"></div>

      <button class="btn btn-farewell" onclick="goHome()">
        知道了，明天见 👋
      </button>

      <div class="review-link" id="reviewLink">
        想再学一遍今天的词？<span onclick="relearn()">点这里</span>
      </div>
    </div>
  </main>

  <!-- ===== Onboarding Overlay ===== -->
  <div class="onboarding-overlay" id="onboardingOverlay" style="display:none">
    <div class="onboarding-sheet">
      <h2>🐣 嘿！我是小E</h2>
      <div class="onboard-sub">在你开始之前，我想知道你学英语是为了什么？</div>
      <div class="goal-options" id="goalOptions">
        <button class="goal-option" data-goal="cet4" onclick="selectGoal('cet4', this)">
          <span class="goal-emoji">🎓</span>
          <div>
            <div class="goal-label">备考四级</div>
            <div class="goal-hint">小E会多选四级高频词</div>
          </div>
        </button>
        <button class="goal-option" data-goal="cet6" onclick="selectGoal('cet6', this)">
          <span class="goal-emoji">🏆</span>
          <div>
            <div class="goal-label">备考六级</div>
            <div class="goal-hint">小E会多选六级高频词</div>
          </div>
        </button>
        <button class="goal-option" data-goal="daily" onclick="selectGoal('daily', this)">
          <span class="goal-emoji">📚</span>
          <div>
            <div class="goal-label">日常学习</div>
            <div class="goal-hint">每天进步一点点就好</div>
          </div>
        </button>
      </div>
      <button class="goal-confirm" id="goalConfirm" onclick="confirmGoal()">开始学习 →</button>
    </div>
  </div>
</div>

<script>
/* ===================================================================
   数据层
   =================================================================== */

// 单词库（四级高频词，30个）
const WORD_POOL = [
  { en: 'abandon', phonetic: '/əˈbændən/', cn: 'v. 放弃；抛弃' },
  { en: 'challenge', phonetic: '/ˈtʃælɪndʒ/', cn: 'n./v. 挑战' },
  { en: 'determine', phonetic: '/dɪˈtɜːrmɪn/', cn: 'v. 决定；确定' },
  { en: 'essential', phonetic: '/ɪˈsenʃl/', cn: 'adj. 必要的；本质的' },
  { en: 'frequent', phonetic: '/ˈfriːkwənt/', cn: 'adj. 频繁的' },
  { en: 'genuine', phonetic: '/ˈdʒenjuɪn/', cn: 'adj. 真正的；真诚的' },
  { en: 'hesitate', phonetic: '/ˈhezɪteɪt/', cn: 'v. 犹豫；迟疑' },
  { en: 'illustrate', phonetic: '/ˈɪləstreɪt/', cn: 'v. 说明；举例' },
  { en: 'journey', phonetic: '/ˈdʒɜːrni/', cn: 'n. 旅程；行程' },
  { en: 'knowledge', phonetic: '/ˈnɒlɪdʒ/', cn: 'n. 知识；学问' },
  { en: 'landscape', phonetic: '/ˈlændskeɪp/', cn: 'n. 风景；景观' },
  { en: 'maintain', phonetic: '/meɪnˈteɪn/', cn: 'v. 维持；保持' },
  { en: 'negotiate', phonetic: '/nɪˈɡoʊʃieɪt/', cn: 'v. 谈判；协商' },
  { en: 'obvious', phonetic: '/ˈɒbviəs/', cn: 'adj. 明显的' },
  { en: 'perspective', phonetic: '/pərˈspektɪv/', cn: 'n. 观点；视角' },
  { en: 'recognize', phonetic: '/ˈrekəɡnaɪz/', cn: 'v. 认出；识别' },
  { en: 'schedule', phonetic: '/ˈʃedjuːl/', cn: 'n./v. 日程；安排' },
  { en: 'tradition', phonetic: '/trəˈdɪʃn/', cn: 'n. 传统' },
  { en: 'ultimate', phonetic: '/ˈʌltɪmət/', cn: 'adj. 最终的；根本的' },
  { en: 'valuable', phonetic: '/ˈvæljuəbl/', cn: 'adj. 有价值的；宝贵的' },
  { en: 'witness', phonetic: '/ˈwɪtnəs/', cn: 'n./v. 证人；目击' },
  { en: 'academic', phonetic: '/ˌækəˈdemɪk/', cn: 'adj. 学术的' },
  { en: 'benefit', phonetic: '/ˈbenɪfɪt/', cn: 'n./v. 益处；受益' },
  { en: 'concentrate', phonetic: '/ˈkɒnsntreɪt/', cn: 'v. 集中；专注' },
  { en: 'environment', phonetic: '/ɪnˈvaɪrənmənt/', cn: 'n. 环境' },
  { en: 'flexible', phonetic: '/ˈfleksəbl/', cn: 'adj. 灵活的' },
  { en: 'guarantee', phonetic: '/ˌɡærənˈtiː/', cn: 'v./n. 保证；担保' },
  { en: 'independent', phonetic: '/ˌɪndɪˈpendənt/', cn: 'adj. 独立的' },
  { en: 'efficient', phonetic: '/ɪˈfɪʃnt/', cn: 'adj. 高效的' },
  { en: 'candidate', phonetic: '/ˈkændɪdət/', cn: 'n. 候选人；考生' },
];

/* ===== 状态管理 ===== */
const TODAY = new Date().toISOString().split('T')[0];
const STORAGE_KEY = 'english_habit_v3';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }
  return {
    studyDays: {},         // { '2026-06-10': true }
    lastStudyDate: null,
    streak: 0,
    goal: null,            // 'cet4' | 'cet6' | 'daily'
    unknownWords: {},      // { 'abandon': '2026-06-09', 'genuine': '2026-06-09' }
    reviewedToday: [],     // ['abandon', ...] — words reviewed today
  };
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let appData = loadData();

// 兼容旧数据
if (!appData.unknownWords) appData.unknownWords = {};
if (!appData.reviewedToday) appData.reviewedToday = [];
if (!('goal' in appData)) appData.goal = null;

// 计算连续天数
function calcStreak(data) {
  if (!data.lastStudyDate) return 0;
  const last = new Date(data.lastStudyDate + 'T00:00:00');
  const today = new Date(TODAY + 'T00:00:00');
  const diff = Math.floor((today - last) / (1000 * 60 * 60 * 24));
  if (diff <= 1) return data.streak;
  return 0;
}

// 初始化 streak
appData.streak = calcStreak(appData);

// 昨天是否学了
function studiedYesterday() {
  const yesterday = new Date(TODAY + 'T00:00:00');
  yesterday.setDate(yesterday.getDate() - 1);
  const yStr = yesterday.toISOString().split('T')[0];
  return !!appData.studyDays[yStr];
}

// 缺席天数
function absenceDays() {
  if (!appData.lastStudyDate) return 999;
  if (appData.lastStudyDate === TODAY) return 0;
  const last = new Date(appData.lastStudyDate + 'T00:00:00');
  const today = new Date(TODAY + 'T00:00:00');
  return Math.floor((today - last) / (1000 * 60 * 60 * 24));
}

/* ===== 每日单词 ===== */
function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
  }
  return Math.abs(hash);
}

// 判断今天是否需要重置复习队列（新的一天，清空已复习标记）
function resetReviewIfNewDay() {
  const reviewDateKey = STORAGE_KEY + '_review_date';
  const lastReviewDate = localStorage.getItem(reviewDateKey);
  if (lastReviewDate !== TODAY) {
    appData.reviewedToday = [];
    localStorage.setItem(reviewDateKey, TODAY);
    saveData(appData);
  }
}

// 获取待复习的词（不超过5个，且今天还没复习过）
function getReviewWords() {
  const reviewed = new Set(appData.reviewedToday || []);
  return Object.keys(appData.unknownWords)
    .filter(word => !reviewed.has(word))
    .sort((a, b) => appData.unknownWords[a].localeCompare(appData.unknownWords[b])) // 先入先出
    .slice(0, 5);
}

function getDailyWords() {
  resetReviewIfNewDay();

  const reviewWords = getReviewWords();
  const reviewSet = new Set(reviewWords);

  // 先用复习词
  const result = reviewWords.map(en => {
    const word = WORD_POOL.find(w => w.en === en);
    return word || { en, phonetic: '', cn: '' };
  });

  // 不够5个，从词库补新词
  if (result.length < 5) {
    const seed = hashCode(TODAY);
    const poolLen = WORD_POOL.length;
    let s = seed;
    const used = new Set(result.map(w => w.en));
    const remaining = 5 - result.length;
    while (result.length < 5 && used.size < poolLen) {
      s = ((s * 1103515245 + 12345) >>> 0) % poolLen;
      if (!used.has(WORD_POOL[s].en)) {
        used.add(WORD_POOL[s].en);
        result.push(WORD_POOL[s]);
      }
    }
  }

  return result;
}

const dailyWords = getDailyWords();

// 判断某个词是否为复习词
function isReviewWord(wordEn) {
  return wordEn in appData.unknownWords && !(appData.reviewedToday || []).includes(wordEn);
}

/* ===================================================================
   小E — AI搭子
   =================================================================== */

// 首页问候语 —— 根据"昨天是否来过"和"连续天数"决定
function getHomeGreeting() {
  const streak = appData.streak;
  const absent = absenceDays();
  const yesterday = studiedYesterday();
  const reviewCount = getReviewWords().length;

  // 复习提醒后缀
  const reviewNote = reviewCount > 0 ? ` 对了，今天有${reviewCount}个词需要复习哦～` : '';

  // 情况1：今天已经学完了
  if (appData.studyDays[TODAY]) {
    const pool = [
      '今天已经学完啦！小E在等明天见你 🐣',
      '今天的任务完成了哦～休息一下吧，明天继续！',
      '学完了！你今天很棒，明天这个时间我还在 ✨',
    ];
    return pool[hashCode(TODAY + 'done') % pool.length];
  }

  // 情况2：昨天没来（缺席）
  if (!yesterday && appData.lastStudyDate) {
    if (absent === 1) {
      return '昨天我等你了……不过没事，今天来就行！🐣' + reviewNote;
    }
    if (absent >= 2 && absent <= 3) {
      const pool = [
        '你终于回来了！我好想你呀 🥺',
        '几天不见！没事，什么时候开始都不晚 🐣',
      ];
      return pool[hashCode(TODAY + 'miss') % pool.length] + reviewNote;
    }
    if (absent >= 4) {
      const pool = [
        '哇，好久不见！没事，什么时候开始都不晚 🐣',
        '你回来啦！我还以为你把我忘了呢 😆',
      ];
      return pool[hashCode(TODAY + 'long') % pool.length] + reviewNote;
    }
  }

  // 情况3：正常连续
  if (streak === 0) {
    const pool = [
      '嗨！欢迎你，从今天起我们就是搭子了 🐣',
      '第一天！好的开始是成功的一半嘛～',
      '嘿！新人报到！小E陪你一起学英语 📚',
    ];
    return pool[hashCode(TODAY + 'day0') % pool.length];
  }
  if (streak === 1) {
    return '又见面了！我发现能连续来两天的人都挺厉害的 😤' + reviewNote;
  }
  if (streak >= 2 && streak <= 3) {
    const pool = [
      '你来啦！我今天准备了几个好词～',
      '嘿嘿，我就知道你会来 🐣',
    ];
    return pool[hashCode(TODAY + 'day2') % pool.length] + reviewNote;
  }
  if (streak >= 4 && streak <= 6) {
    const pool = [
      `已经第${streak}天了哦，我就知道你不是三分钟热度的人 😤`,
      `第${streak}天了！你是不是已经有点习惯每天见我了？`,
    ];
    return pool[hashCode(TODAY + 'day4') % pool.length] + reviewNote;
  }
  // streak >= 7
  const pool = [
    `第${streak}天了！你知道吗，能坚持一周的人不到一半 📊`,
    `连续${streak}天！我掐指一算，你已经打败了大部分同学 📈`,
    `${streak}天了！你也太稳了吧 🔥`,
  ];
  return pool[hashCode(TODAY + 'day7') % pool.length] + reviewNote;
}

function getStreakText() {
  const s = appData.streak;
  if (s === 0) return '🐣 从今天开始';
  return `🔥 我们已经一起 ${s} 天啦`;
}

function getGoalLabel(goal) {
  const map = { cet4: '🎓 备考四级', cet6: '🏆 备考六级', daily: '📚 日常学习' };
  return map[goal] || '';
}

// 学习中的搭子反馈
function getKnowReaction() {
  const pool = [
    '厉害！这个词确实常考',
    '认识这个词，四六级能多一分 😼',
    '不错嘛，这个词你都会',
    '可以可以，这个词拿捏了 ✨',
    '稳！这个词你已经掌握了',
  ];
  return pool[Math.floor(Math.random() * pool.length)];
}

function getUnknownReaction() {
  const pool = [
    '没事，现在认识就行～',
    '这个词不常见，不认识也正常 😌',
    '没关系！见过一次下次就有印象了',
    '好的，mark一下～下次就认识啦',
    '收到！这个词先混个脸熟 🐣',
  ];
  return pool[Math.floor(Math.random() * pool.length)];
}

// 完成页总结
function getCompleteSummary(known, total) {
  if (known === total) {
    const pool = [
      '今天的词你全会！',
      '全对！你也太强了吧',
      '5个词全会！你是不是偷偷卷了 😼',
    ];
    return pool[Math.floor(Math.random() * pool.length)];
  }
  if (known >= 3) {
    return `认识了 ${known} 个，新认识了 ${total - known} 个`;
  }
  return `今天这几个确实有点难，不过见过就是进步！`;
}

function getCompleteDetail(known, total) {
  if (known === total) {
    return '明天换几个更难的给你试试～';
  }
  if (known >= 3) {
    return '稳步前进中，继续保持！💪';
  }
  return '见过一次就算认识了，明天咱们继续 🐣';
}

function getCompleteFarewell() {
  const pool = [
    '明天这个时候我还在等你哦 🐣 不见不散！',
    '明天见！小E每天都会在这里～',
    '说好了，明天这个时间见 👋',
    '明天也要来找我哦，拉钩 🤙',
  ];
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ===================================================================
   页面渲染
   =================================================================== */

function renderHome() {
  // 日期
  const now = new Date();
  const weekDays = ['日','一','二','三','四','五','六'];
  document.getElementById('headerDate').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weekDays[now.getDay()]}`;

  // 搭子问候
  document.getElementById('companionGreeting').textContent = getHomeGreeting();
  document.getElementById('companionStreak').textContent = getStreakText();

  // 目标标签
  const goalTag = document.getElementById('goalTag');
  if (appData.goal) {
    goalTag.innerHTML = `<span style="font-size:12px;color:var(--text3);background:var(--bg);padding:3px 10px;border-radius:10px">${getGoalLabel(appData.goal)}</span>`;
  } else {
    goalTag.innerHTML = '';
  }

  // 复习徽章
  const reviewWords = getReviewWords();
  const reviewBadge = document.getElementById('reviewBadge');
  if (reviewWords.length > 0 && !appData.studyDays[TODAY]) {
    reviewBadge.style.display = 'inline-flex';
    reviewBadge.textContent = `🔄 有 ${reviewWords.length} 个词等你复习`;
  } else {
    reviewBadge.style.display = 'none';
  }

  // 按钮文案
  const btnStart = document.getElementById('btnStart');
  if (appData.studyDays[TODAY]) {
    btnStart.textContent = '已经学完啦，明天见 👋';
    btnStart.style.opacity = '0.6';
    btnStart.onclick = null;
    const banner = document.getElementById('completedBanner');
    banner.style.display = 'block';
    banner.innerHTML = '✅ 今天的学习已完成，<a onclick="goToComplete()">看看小E说了什么</a>';
  } else {
    const label = reviewWords.length > 0
      ? `好呀，先复习 ${reviewWords.length} 个词 →`
      : '好呀，开始今天的5个词 →';
    btnStart.textContent = label;
    btnStart.style.opacity = '1';
    btnStart.onclick = startLearning;
    document.getElementById('completedBanner').style.display = 'none';
  }

  // 单词预览
  const chips = dailyWords.map(w => {
    const isReview = isReviewWord(w.en);
    const style = isReview ? 'border:1.5px solid #FFCDD6' : '';
    return `<div class="word-chip" style="${style}">${isReview ? '🔄 ' : ''}${w.en}</div>`;
  });
  document.getElementById('wordsPreview').innerHTML = chips.join('');

  // 标签文案
  const reviewCount = getReviewWords().length;
  if (reviewCount > 0 && !appData.studyDays[TODAY]) {
    document.getElementById('wordsLabel').textContent =
      `今天要见的词（${reviewCount}个复习 + ${5 - reviewCount}个新词）：`;
  } else {
    document.getElementById('wordsLabel').textContent =
      appData.studyDays[TODAY] ? '今天学过的5个词：' : '今天要见的5个词：';
  }

  // Refresh companion card animation
  const card = document.getElementById('companionCard');
  card.classList.remove('fade-up');
  void card.offsetWidth;
  card.classList.add('fade-up');
}

/* ===== 页面切换 ===== */
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + name);
  if (target) target.classList.add('active');
}

function goHome() {
  switchPage('home');
  renderHome();
}

function goToComplete() {
  // Directly render complete page for already-completed-today case
  document.getElementById('completeSummary').textContent = '今天的词你已经学完啦！';
  document.getElementById('completeDetail').textContent = '休息一下，明天继续～';
  document.getElementById('completeStreakBadge').innerHTML = `🔥 我们已经一起 ${appData.streak} 天啦`;
  document.getElementById('completeFarewell').textContent = '明天这个时候我还在等你哦 🐣 不见不散！';
  switchPage('complete');
}

/* ===== 学习流程 ===== */
let currentWordIndex = 0;
let knownCount = 0;
let reactionTimer = null;

function startLearning() {
  if (appData.studyDays[TODAY]) return; // 今天学过了
  currentWordIndex = 0;
  knownCount = 0;
  switchPage('learn');
  showWord(0);
}

function showWord(index) {
  if (index >= dailyWords.length) {
    finishLearning();
    return;
  }
  const w = dailyWords[index];
  const card = document.getElementById('wordCard');
  card.classList.remove('swipe-out');
  void card.offsetWidth;
  card.classList.add('fade-up');

  document.getElementById('wordEn').textContent = w.en;
  document.getElementById('wordPhonetic').textContent = w.phonetic;
  document.getElementById('wordCn').textContent = w.cn;

  // 复习标签
  const reviewTag = document.getElementById('reviewTag');
  if (isReviewWord(w.en)) {
    reviewTag.style.display = 'inline-block';
  } else {
    reviewTag.style.display = 'none';
  }

  document.getElementById('progressText').textContent = `${index + 1} / ${dailyWords.length}`;
  document.getElementById('progressFill').style.width = `${(index / dailyWords.length) * 100}%`;
  document.getElementById('progressLabel').textContent =
    isReviewWord(w.en) ? `复习第 ${index + 1} 个词` : `第 ${index + 1} 个词`;

  // 隐藏搭子反应
  hideReaction();

  // 启用按钮
  document.getElementById('btnKnow').disabled = false;
  document.getElementById('btnUnknown').disabled = false;
}

// 记录当前词的状态
let currentWordState = { en: '' };

function markWord(type) {
  const w = dailyWords[currentWordIndex];
  const wasInReview = isReviewWord(w.en); // 先记下：这个词是不是复习词

  if (type === 'know') knownCount++;

  // 记录生词到 localStorage
  if (type === 'unknown') {
    if (!appData.unknownWords[w.en]) {
      appData.unknownWords[w.en] = TODAY;
    }
  } else {
    // 认识了 → 从生词库移除
    delete appData.unknownWords[w.en];
  }

  // 标记已复习
  if (!appData.reviewedToday.includes(w.en)) {
    appData.reviewedToday.push(w.en);
  }
  saveData(appData);

  // 显示搭子反应（复习词有特殊反馈）
  let msg;
  if (type === 'know' && wasInReview) {
    // 昨天不认识，今天认识了！
    msg = '昨天不认识，今天就记住了！进步很大嘛 🎉';
  } else if (type === 'know') {
    msg = getKnowReaction();
  } else {
    msg = getUnknownReaction();
  }
  showReaction(msg);

  // 禁用按钮防止连点
  document.getElementById('btnKnow').disabled = true;
  document.getElementById('btnUnknown').disabled = true;

  // 卡片滑出动画
  const card = document.getElementById('wordCard');
  card.classList.add('swipe-out');

  currentWordIndex++;
  document.getElementById('progressFill').style.width = `${(currentWordIndex / dailyWords.length) * 100}%`;
  document.getElementById('progressText').textContent = `${Math.min(currentWordIndex + 1, dailyWords.length)} / ${dailyWords.length}`;

  // 延迟切换下一个词
  clearTimeout(reactionTimer);
  reactionTimer = setTimeout(() => showWord(currentWordIndex), 700);
}

function showReaction(msg) {
  const avatar = document.getElementById('reactionAvatar');
  const bubble = document.getElementById('reactionBubble');
  bubble.textContent = msg;
  avatar.classList.add('visible');
  bubble.classList.add('visible');
}

function hideReaction() {
  const avatar = document.getElementById('reactionAvatar');
  const bubble = document.getElementById('reactionBubble');
  avatar.classList.remove('visible');
  bubble.classList.remove('visible');
}

/* ===== 完成流程 ===== */
function finishLearning() {
  // 更新数据
  if (!appData.studyDays[TODAY]) {
    appData.studyDays[TODAY] = true;
  }

  // 更新连续天数
  const yesterday = new Date(TODAY + 'T00:00:00');
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = yesterday.toISOString().split('T')[0];

  if (appData.lastStudyDate === yesterdayStr || appData.lastStudyDate === TODAY) {
    if (appData.lastStudyDate !== TODAY) {
      appData.streak++;
    }
  } else if (appData.lastStudyDate !== TODAY) {
    appData.streak = 1;
  }

  appData.lastStudyDate = TODAY;
  saveData(appData);

  // 渲染完成页
  const total = dailyWords.length;
  const unknownCount = total - knownCount;
  const pendingReview = Object.keys(appData.unknownWords).length;

  document.getElementById('completeSummary').textContent = getCompleteSummary(knownCount, total);

  // 详细信息包含生词数
  let detail = getCompleteDetail(knownCount, total);
  if (unknownCount > 0) {
    detail += `\n还有 ${unknownCount} 个词不熟，明天咱们重点复习～`;
  }
  if (pendingReview > 0 && unknownCount === 0) {
    detail += `\n之前还有 ${pendingReview} 个词等你慢慢搞定`;
  }
  document.getElementById('completeDetail').textContent = detail;

  document.getElementById('completeStreakBadge').innerHTML = `🔥 我们已经一起 ${appData.streak} 天啦`;
  document.getElementById('completeFarewell').textContent = getCompleteFarewell();

  switchPage('complete');
  spawnConfetti();
}

function relearn() {
  currentWordIndex = 0;
  knownCount = 0;
  switchPage('learn');
  showWord(0);
}

/* ===== 首次引导 ===== */
let selectedGoal = null;

function selectGoal(goal, btn) {
  selectedGoal = goal;
  document.querySelectorAll('.goal-option').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  const confirmBtn = document.getElementById('goalConfirm');
  confirmBtn.classList.add('active');
  confirmBtn.textContent = goal === 'cet4' ? '开始，冲刺四级！→' :
                           goal === 'cet6' ? '开始，拿下六级！→' :
                           '开始，每天都学！→';
}

function confirmGoal() {
  if (!selectedGoal) return;
  appData.goal = selectedGoal;
  saveData(appData);
  document.getElementById('onboardingOverlay').style.display = 'none';
  renderHome();
}

function showOnboarding() {
  document.getElementById('onboardingOverlay').style.display = 'flex';
}

/* ===== 彩带 ===== */
function spawnConfetti() {
  const colors = ['#FF3B30','#FF9500','#FFCC00','#34C759','#007AFF','#5856D6','#AF52DE'];
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.top = (55 + Math.random() * 35) + '%';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (0.7 + Math.random() * 1.4) + 's';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2000);
    }, i * 20);
  }
}

/* ===== 初始化 ===== */
function init() {
  renderHome();
  // 首次访问 → 弹出目标选择
  if (!appData.goal) {
    setTimeout(() => showOnboarding(), 600);
  }
}

init();
