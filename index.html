<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>English Habit — 每日英语习惯</title>
<style>
/* ================================================================
   Design Tokens
   ================================================================ */
:root {
  --primary: #3b82f6;
  --primary-light: #60a5fa;
  --primary-bg: #eff6ff;
  --primary-border: #bfdbfe;
  --green: #10b981;
  --green-bg: #ecfdf5;
  --green-border: #a7f3d0;
  --red: #ef4444;
  --red-bg: #fef2f2;
  --red-border: #fecaca;
  --slate-50: #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-300: #cbd5e1;
  --slate-400: #94a3b8;
  --slate-500: #64748b;
  --slate-600: #475569;
  --slate-700: #334155;
  --slate-800: #1e293b;
  --slate-900: #0f172a;
  --white: #ffffff;
  --radius: 20px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 4px 16px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
}

/* ================================================================
   Reset & Base
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--primary-bg);
  color: var(--slate-800);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ================================================================
   Header
   ================================================================ */
.header {
  padding: 16px 20px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(239,246,255,0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.header-brand {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--slate-800);
}

.header-brand .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--primary);
}

.header-btn {
  background: none;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-xs);
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  color: var(--slate-500);
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.header-btn:active { background: var(--slate-100); }

/* ================================================================
   Pages
   ================================================================ */
.page { flex:1; display:none; flex-direction:column; padding:8px 20px 100px; overflow-y:auto; }
.page.active { display: flex; }

/* ================================================================
   Home Page
   ================================================================ */
.time-greeting {
  text-align: center;
  padding: 4px 0 2px;
  font-size: 13px;
  color: var(--slate-400);
  font-weight: 500;
}

/* Hero card */
.hero-card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 32px 24px 24px;
  text-align: center;
  margin: 12px 0 16px;
  animation: cardIn 0.5s ease-out;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-emoji {
  font-size: 56px;
  line-height: 1;
  margin-bottom: 8px;
  display: block;
}

.hero-greeting {
  font-size: 17px;
  font-weight: 700;
  color: var(--slate-800);
  margin-bottom: 4px;
}

.hero-sub {
  font-size: 13px;
  color: var(--slate-400);
  margin-bottom: 16px;
}

/* Progress ring */
.progress-ring-wrap {
  position: relative;
  width: 100px;
  height: 100px;
  margin: 0 auto 8px;
}

.progress-ring {
  transform: rotate(-90deg);
  width: 100px;
  height: 100px;
}

.progress-ring .bg {
  fill: none;
  stroke: var(--slate-100);
  stroke-width: 8;
}

.progress-ring .fill {
  fill: none;
  stroke: var(--primary);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.6s ease;
}

.progress-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.progress-num {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.5px;
}

.progress-label {
  font-size: 10px;
  color: var(--slate-400);
  font-weight: 500;
}

/* Stats chips */
.stats-chips {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.stat-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--primary-bg);
  border: 1px solid var(--primary-border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #1e40af;
}

.stat-chip.fire { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
.stat-chip.star { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }

/* Action buttons */
.home-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 14px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  padding: 15px 24px;
  font-family: inherit;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  width: 100%;
}

.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 16px rgba(59,130,246,0.3);
}

.btn-secondary {
  background: var(--white);
  color: var(--slate-700);
  border: 1.5px solid var(--slate-200);
}

.btn-review-badge {
  display: inline-block;
  background: #dbeafe;
  color: #2563eb;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 8px;
  margin-left: 4px;
}

/* Today complete tag */
.today-done {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--green-bg);
  color: #065f46;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
  margin-top: 4px;
}

/* Settings */
.settings-section {
  background: var(--white);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 0;
  margin-bottom: 12px;
  overflow: hidden;
}

.settings-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--slate-500);
  padding: 12px 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.settings-title:active { background: var(--slate-50); }
.settings-title span { font-size: 16px; color: var(--slate-400); }

.settings-body { padding: 0 18px 14px; display: none; }
.settings-body.open { display: block; }

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.settings-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--slate-600);
}

.settings-options {
  display: flex;
  gap: 4px;
}

.settings-opt {
  background: none;
  border: 1.5px solid var(--slate-200);
  border-radius: 8px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  color: var(--slate-500);
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.settings-opt:active { transform: scale(0.95); }
.settings-opt.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* Yesterday section */
.yesterday-section {
  background: var(--white);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 14px 18px;
  margin-bottom: 12px;
}

.yesterday-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--slate-400);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.yesterday-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 8px;
}

.chip-known { background: var(--green-bg); color: #065f46; }
.chip-unknown { background: var(--red-bg); color: #991b1b; }

/* ================================================================
   Learn Page
   ================================================================ */
.learn-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.btn-back {
  background: none;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-xs);
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  color: var(--slate-500);
  -webkit-tap-highlight-color: transparent;
}

.btn-back:active { background: var(--slate-100); }

.progress-wrap { flex: 1; }

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--slate-400);
  margin-bottom: 6px;
}

.progress-bar {
  height: 5px;
  background: var(--slate-200);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width 0.3s ease;
}

/* Learn hint text */
.learn-hint {
  text-align: center;
  font-size: 13px;
  color: var(--slate-500);
  margin-bottom: 12px;
  min-height: 20px;
  opacity: 0;
  transform: translateY(6px);
  transition: all 0.25s ease;
}
.learn-hint.show { opacity: 1; transform: translateY(0); }

/* Word card */
.word-card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 32px 24px;
  text-align: center;
  margin-bottom: 14px;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform 0.25s ease, opacity 0.25s ease;
  position: relative;
}

.word-card.swipe-out {
  transform: translateY(-12px);
  opacity: 0;
}

.word-card.fade-up {
  animation: fadeUp 0.35s ease-out;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.word-card .review-tag {
  font-size: 11px;
  font-weight: 600;
  color: #dc2626;
  background: var(--red-bg);
  padding: 3px 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.word-card .new-tag {
  font-size: 11px;
  font-weight: 600;
  color: #059669;
  background: var(--green-bg);
  padding: 3px 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.word-en {
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--slate-900);
  margin-bottom: 4px;
}

.word-pronounce {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 8px;
}

.word-phonetic {
  font-size: 15px;
  color: var(--slate-400);
}

.btn-speak {
  background: var(--primary-bg);
  border: 1.5px solid var(--primary-border);
  border-radius: 50%;
  width: 36px;
  height: 36px;
  font-size: 18px;
  cursor: pointer;
  font-family: inherit;
  color: #1e40af;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  line-height: 1;
  flex-shrink: 0;
}
.btn-speak:active { background: #dbeafe; transform: scale(0.9); }
.btn-speak.speaking { background: #dbeafe; border-color: var(--primary); animation: speakPulse 0.6s ease-in-out infinite alternate; }
@keyframes speakPulse {
  from { box-shadow: 0 0 0 0 rgba(59,130,246,0.3); }
  to { box-shadow: 0 0 0 8px rgba(59,130,246,0); }
}

/* Context sentence (example with target word highlighted) */
.word-context {
  background: var(--slate-50);
  border-radius: 12px;
  padding: 12px 16px;
  margin: 4px 0 12px;
  font-size: 14px;
  color: var(--slate-600);
  line-height: 1.6;
  text-align: left;
  border-left: 3px solid var(--primary-border);
}
.word-context b {
  color: var(--primary);
  font-weight: 700;
}

/* Revealed details (after assessment) */
.word-details {
  display: none;
  width: 100%;
  text-align: center;
  margin-top: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--slate-100);
}

.word-details.show { display: block; }

.word-cn {
  font-size: 19px;
  color: var(--slate-700);
  font-weight: 600;
  margin-bottom: 10px;
  line-height: 1.5;
}

.word-examples {
  text-align: left;
  font-size: 13px;
  color: var(--slate-500);
  line-height: 1.6;
}

.word-examples .ex-en {
  color: var(--slate-600);
  margin-bottom: 2px;
}

.word-examples .ex-zh {
  color: var(--slate-400);
  font-size: 12px;
  margin-bottom: 8px;
}

/* Quiz options grid */
.quiz-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.quiz-opt {
  min-height: 52px;
  padding: 14px 12px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  border: 2px solid var(--slate-200);
  background: var(--white);
  color: var(--slate-700);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  line-height: 1.4;
  text-align: center;
  word-break: break-all;
}
.quiz-opt:active { transform: scale(0.96); }
.quiz-opt:disabled { pointer-events: none; }

.quiz-opt.correct {
  background: var(--green-bg);
  border-color: #10b981;
  color: #065f46;
  animation: correctPulse 0.4s ease-out;
}
@keyframes correctPulse {
  0% { transform: scale(1.04); }
  100% { transform: scale(1); }
}

.quiz-opt.wrong {
  background: var(--red-bg);
  border-color: #ef4444;
  color: #991b1b;
}

.quiz-opt.dimmed {
  opacity: 0.4;
}

.btn-confirm-know {
  display: none;
  width: 100%;
  margin-top: 12px;
  padding: 14px 24px;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 600;
  border: none;
  background: var(--primary);
  color: #fff;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  box-shadow: 0 4px 16px rgba(59,130,246,0.3);
  -webkit-tap-highlight-color: transparent;
}
.btn-confirm-know:active { transform: scale(0.97); }
.btn-confirm-know.show { display: block; }

/* ================================================================
   Complete Page
   ================================================================ */
.complete-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px 0;
}

.complete-emoji {
  font-size: 68px;
  line-height: 1;
  margin-bottom: 16px;
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}

.complete-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 6px;
}

.complete-detail {
  font-size: 14px;
  color: var(--slate-500);
  margin-bottom: 12px;
  line-height: 1.5;
}

.complete-streak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #eff6ff;
  color: #1d4ed8;
  font-size: 15px;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: 20px;
  margin-bottom: 14px;
}

/* Harvest */
.harvest-section {
  background: var(--white);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 14px 18px;
  margin-bottom: 12px;
  width: 100%;
  text-align: left;
}

.harvest-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--slate-400);
  margin-bottom: 8px;
}

.harvest-chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Preview (tomorrow's reviews) */
.preview-section {
  background: var(--primary-bg);
  border-radius: var(--radius-sm);
  border: 1px solid var(--primary-border);
  padding: 14px 18px;
  margin-bottom: 12px;
  width: 100%;
  text-align: left;
}

.preview-title {
  font-size: 12px;
  font-weight: 600;
  color: #1e40af;
  margin-bottom: 8px;
}

.preview-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.preview-chip {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 8px;
  background: #fff;
  color: #1e40af;
  border: 1px solid var(--primary-border);
}

/* ================================================================
   Stats Page
   ================================================================ */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--white);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 18px 16px;
  text-align: center;
}

.stat-card .val {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.5px;
}

.stat-card .lbl {
  font-size: 12px;
  color: var(--slate-400);
  font-weight: 500;
  margin-top: 2px;
}

/* Calendar heatmap */
.calendar-section {
  background: var(--white);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 18px;
  margin-bottom: 20px;
}

.calendar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--slate-400);
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.calendar-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}

.calendar-day {
  width: 12px;
  height: 12px;
  border-radius: 2px;
  background: var(--slate-100);
  cursor: default;
  position: relative;
}

.calendar-day.studied { background: #93c5fd; }
.calendar-day.missed { background: var(--slate-200); }

.calendar-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  font-size: 11px;
  color: var(--slate-400);
}

.calendar-legend .dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
}

/* Word distribution */
.dist-section {
  background: var(--white);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 18px;
  margin-bottom: 20px;
}

.dist-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--slate-400);
  margin-bottom: 12px;
}

.dist-bar-wrap {
  margin-bottom: 8px;
}

.dist-bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 4px;
}

.dist-bar {
  height: 6px;
  background: var(--slate-100);
  border-radius: 3px;
  overflow: hidden;
}

.dist-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s ease;
}

.dist-bar-fill.mastered { background: #10b981; }
.dist-bar-fill.review { background: #6366f1; }
.dist-bar-fill.learning { background: #3b82f6; }
.dist-bar-fill.new { background: #cbd5e1; }

/* ================================================================
   Responsive
   ================================================================ */
@media (min-width: 480px) {
  .app {
    border-left: 1px solid var(--slate-200);
    border-right: 1px solid var(--slate-200);
  }
}

@media (max-width: 360px) {
  .hero-emoji { font-size: 44px; }
  .hero-greeting { font-size: 15px; }
  .word-en { font-size: 30px; }
  .word-cn { font-size: 17px; }
  .complete-emoji { font-size: 52px; }
  .progress-ring-wrap { width: 80px; height: 80px; }
  .progress-ring { width: 80px; height: 80px; }
  .progress-num { font-size: 20px; }
  .quiz-opt { font-size: 13px; min-height: 46px; padding: 12px 8px; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-brand">📖 English Habit<span class="dot"></span></div>
    <button class="header-btn" id="headerStatsBtn" onclick="UI.showStats()">📊 统计</button>
  </header>

  <!-- ===== Home Page ===== -->
  <main class="page active" id="page-home">
    <div class="time-greeting" id="timeGreeting"></div>

    <div class="hero-card" id="heroCard">
      <span class="hero-emoji" id="heroEmoji">📚</span>
      <div class="hero-greeting" id="heroGreeting">准备开始今天的英语学习吧！</div>
      <div class="hero-sub" id="heroSub"></div>

      <div class="progress-ring-wrap" id="progressRingWrap">
        <svg class="progress-ring" viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="42"/>
          <circle class="fill" id="progressCircle" cx="50" cy="50" r="42"
                  stroke-dasharray="263.89" stroke-dashoffset="263.89"/>
        </svg>
        <div class="progress-text">
          <span class="progress-num" id="progressNum">0</span>
          <span class="progress-label" id="progressLabel">今日单词</span>
        </div>
      </div>

      <div class="stats-chips">
        <span class="stat-chip fire">🔥 <span id="statStreak">0</span> 天连续</span>
        <span class="stat-chip star">⭐ <span id="statTotalWords">0</span> 词掌握</span>
      </div>

      <div id="todayDoneTag" style="margin-top:8px"></div>
    </div>

    <div class="home-actions">
      <button class="btn btn-primary" id="btnStart" onclick="UI.startLearning()">
        📖 <span id="btnStartLabel">开始学习</span>
      </button>
      <button class="btn btn-secondary" id="btnReview" onclick="UI.startReview()" style="display:none">
        🔄 复习待巩固单词 <span class="btn-review-badge" id="reviewBadgeCount"></span>
      </button>
    </div>

    <!-- Daily settings -->
    <div class="settings-section" id="settingsSection">
      <div class="settings-title" onclick="UI.toggleSettings()">
        ⚙️ 每日设置 <span id="settingsToggle">▾</span>
      </div>
      <div class="settings-body" id="settingsBody">
        <div class="settings-row">
          <span class="settings-label">每日新词</span>
          <div class="settings-options" id="dailyNewOptions"></div>
        </div>
        <div class="settings-row">
          <span class="settings-label">每日总量</span>
          <div class="settings-options" id="dailyMaxOptions"></div>
        </div>
      </div>
    </div>

    <div class="yesterday-section" id="yesterdaySection" style="display:none">
      <div class="yesterday-title">📋 昨日回顾</div>
      <div class="yesterday-chips" id="yesterdayChips"></div>
    </div>
  </main>

  <!-- ===== Learn Page ===== -->
  <main class="page" id="page-learn">
    <div class="learn-header">
      <button class="btn-back" onclick="UI.confirmQuit()">← 返回</button>
      <div class="progress-wrap">
        <div class="progress-info">
          <span id="learnProgressLabel">第 1 个词</span>
          <span id="learnProgressText">1 / 20</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="learnProgressFill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div class="learn-hint" id="learnHint"></div>

    <div class="word-card" id="wordCard">
      <div class="review-tag" id="reviewTag" style="display:none">🔄 待巩固</div>
      <div class="new-tag" id="newTag" style="display:none">🆕 新词</div>
      <div class="word-en" id="wordEn"></div>
      <div class="word-pronounce">
        <span class="word-phonetic" id="wordPhonetic"></span>
        <button class="btn-speak" id="btnSpeak" onclick="UI.speakWord()">🔊</button>
      </div>

      <div class="word-context" id="wordContext"></div>

      <div class="word-details" id="wordDetails">
        <div class="word-cn" id="wordCn"></div>
        <div class="word-examples" id="wordExamples"></div>
      </div>
    </div>

    <div class="quiz-options" id="quizOptions">
      <button class="quiz-opt" id="quizOpt0" onclick="UI.selectOption(0)"></button>
      <button class="quiz-opt" id="quizOpt1" onclick="UI.selectOption(1)"></button>
      <button class="quiz-opt" id="quizOpt2" onclick="UI.selectOption(2)"></button>
      <button class="quiz-opt" id="quizOpt3" onclick="UI.selectOption(3)"></button>
    </div>

    <button class="btn-confirm-know" id="btnConfirmKnow" onclick="UI.confirmKnow()">
      知道了，继续 👉
    </button>
  </main>

  <!-- ===== Complete Page ===== -->
  <main class="page" id="page-complete">
    <div class="complete-wrap">
      <div class="complete-emoji" id="completeEmoji">🎉</div>
      <div class="complete-title" id="completeTitle">今日学习完成！</div>
      <div class="complete-detail" id="completeDetail"></div>
      <div class="complete-streak" id="completeStreak"></div>

      <div class="harvest-section" id="harvestSection">
        <div class="harvest-title">📋 今日收获</div>
        <div class="harvest-chips" id="harvestChips"></div>
      </div>

      <div class="preview-section" id="previewSection" style="display:none">
        <div class="preview-title">🔮 明天要复习</div>
        <div class="preview-chips" id="previewChips"></div>
      </div>

      <button class="btn btn-primary" onclick="UI.goHome()" style="margin-top:8px">
        知道了，明天继续 👋
      </button>

      <div style="margin-top:12px;font-size:13px;color:var(--slate-400)">
        想再学一轮？<span style="color:var(--primary);cursor:pointer;font-weight:600" onclick="UI.relearn()">点这里</span>
      </div>
    </div>
  </main>

  <!-- ===== Stats Page ===== -->
  <main class="page" id="page-stats">
    <div style="margin-bottom:16px">
      <button class="btn-back" onclick="UI.goHome()">← 返回首页</button>

      </div>
      <div class="stat-card">
        <div class="val" id="statsInRotation">0</div>

      </div>
    </div>

      <div class="calendar-legend">

    </div>

    <div class="dist-section">
      <div class="dist-title">📊 词汇分布</div>
      <div class="dist-bar-wrap">
        <div class="dist-bar-label"><span>✅ 已掌握</span><span id="distMastered">0</span></div>

      </div>
    </div>
  </main>
</div>

    ex: ex.map(([enEx, zhEx]) => ({ en: enEx, zh: zhEx }))
  }));
})();

/* ================================================================
   DATA LAYER — localStorage persistence
   Key: english_habit_v5
   ================================================================ */
const TODAY = new Date().toISOString().split('T')[0];
const STORAGE_KEY = 'english_habit_v5';
const DAILY_NEW = 10;       // new words per day
const DAILY_MAX = 20;       // max total words per session

const Data = {
  defaults() {
    return {
      studyDays: {},          // { "2026-06-11": true }
      lastStudyDate: null,
      streak: 0,
      totalDays: 0,
      totalWordsLearned: 0,
      wordStates: {},         // SM-2 state per word
      dailyHistory: {},       // { "2026-06-11": { words: { "abandon": "know" }, completed: true } }
      settings: { dailyNew: DAILY_NEW, dailyMax: DAILY_MAX }
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        // Merge with defaults for migration
        const def = Data.defaults();
        for (const k of Object.keys(def)) {
          if (!(k in d)) d[k] = def[k];
        }
        return d;
      }
    } catch(e) { /* corrupted data, start fresh */ }
    return Data.defaults();
  },

  save(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  }
};

let appData = Data.load();

/* ================================================================
   HELPERS
   ================================================================ */
function ymd(date) { return date.toISOString().split('T')[0]; }

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return ymd(d);
}

function daysBetween(a, b) {
  const da = new Date(a + 'T00:00:00');
  const db = new Date(b + 'T00:00:00');
  return Math.floor((db - da) / 86400000);
}

function calcStreak() {
  if (!appData.lastStudyDate) return 0;
  const d = daysBetween(appData.lastStudyDate, TODAY);
  return d <= 1 ? appData.streak : 0;
}

/* ================================================================
   SRS ENGINE — SM-2 spaced repetition algorithm
   ================================================================ */
const SRS = {
  // Quality mapping from user response
  Q: { know: 4, unsure: 2, unknown: 0 },

  // Get or init state for a word
  getState(en) {
    if (!appData.wordStates[en]) {
      appData.wordStates[en] = {
        ef: 2.5,
        interval: 0,
        reps: 0,
        nextReview: null,  // null = never seen
        firstSeen: null,
        lastSeen: null,
        totalSeen: 0,
        totalCorrect: 0
      };
    }
    return appData.wordStates[en];
  },

  // Apply SM-2 after user response
  update(en, quality) {
    const st = SRS.getState(en);
    const q = typeof quality === 'number' ? quality : (SRS.Q[quality] || 0);

    st.totalSeen++;
    st.lastSeen = TODAY;
    if (!st.firstSeen) st.firstSeen = TODAY;
    if (q >= 3) st.totalCorrect++;

    // SM-2 algorithm
    let ef = st.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
    if (ef < 1.3) ef = 1.3;
    st.ef = ef;

    if (q < 3) {
      // Failed: reset
      st.interval = 1;
      st.reps = 0;
    } else {
      if (st.reps === 0) st.interval = 1;
      else if (st.reps === 1) st.interval = 3;
      else st.interval = Math.round(st.interval * st.ef);
      st.reps++;
    }

    st.nextReview = addDays(TODAY, st.interval);
    return st;
  },

  // Get words due for review today
  getDueWords() {
    const due = [];
    for (const en of Object.keys(appData.wordStates)) {
      const st = appData.wordStates[en];
      if (st.nextReview && st.nextReview <= TODAY) {
        due.push(en);
      }
    }
    // Sort: overdue first (longest overdue), then by reps (fewest first)
    due.sort((a, b) => {
      const sa = appData.wordStates[a], sb = appData.wordStates[b];
      const overdueA = daysBetween(sa.nextReview, TODAY);
      const overdueB = daysBetween(sb.nextReview, TODAY);
      if (overdueA !== overdueB) return overdueB - overdueA;
      return sa.reps - sb.reps;
    });
    return due;
  },

  // Get unseen words (never introduced), shuffled for varied learning order
  getNewWords() {
    const seen = new Set(Object.keys(appData.wordStates).filter(
      en => appData.wordStates[en].firstSeen !== null
    ));
    const unseen = WORD_BANK.filter(w => !seen.has(w.en));
    // Fisher-Yates shuffle for random learning order
    for (let i = unseen.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [unseen[i], unseen[j]] = [unseen[j], unseen[i]];
    }
    return unseen;
  },

  // Word categorization for stats
  categorize() {
    let mastered = 0, review = 0, learning = 0;
    for (const en of Object.keys(appData.wordStates)) {
      const st = appData.wordStates[en];
      if (st.reps >= 5) mastered++;
      else if (st.reps >= 1 && st.nextReview && st.nextReview > TODAY) review++;
      else if (st.firstSeen) learning++;
    }
    const total = WORD_BANK.length;
    const unseen = total - mastered - review - learning;
    return { mastered, review, learning, unseen, total };
  },

  // Is a word "mastered" (5+ consecutive correct)
  isMastered(en) {
    const st = appData.wordStates[en];
    return st && st.reps >= 5;
  }
};

/* ================================================================
   SESSION MANAGER — handles one learning session
   ================================================================ */
const Session = {
  words: [],        // ordered list of {word, isReview}
  currentIdx: 0,
  isReviewMode: false,
  results: [],      // [{en, quality}]

  prepare(isReviewOnly) {
    Session.currentIdx = 0;
    Session.results = [];
    Session.isReviewMode = isReviewOnly;

    const dailyMax = appData.settings.dailyMax || 20;
    const dailyNew = appData.settings.dailyNew || 10;

    // Get review words first
    const dueWords = SRS.getDueWords();
    const reviewSet = new Set(dueWords);

    let selected = [];
    const used = new Set();

    // Add review words (up to dailyMax)
    for (const en of dueWords) {
      if (selected.length >= dailyMax) break;
      const w = WORD_BANK.find(w => w.en === en);
      if (w && !used.has(w.en)) {
        used.add(w.en);
        selected.push({ word: w, isReview: true });
      }
    }

    // Add new words if not review-only mode (up to dailyNew new, dailyMax total)
    if (!isReviewOnly) {
      const newWords = SRS.getNewWords();
      for (const w of newWords) {
        if (selected.length >= dailyMax) break;
        const newCount = selected.filter(s => !s.isReview).length;
        if (newCount >= dailyNew) break;
        if (!used.has(w.en)) {
          used.add(w.en);
          selected.push({ word: w, isReview: false });
        }
      }
    }

    // If still empty (all words mastered/seen), add some review words anyway
    if (selected.length === 0) {
      for (const en of dueWords.slice(0, dailyMax)) {
        const w = WORD_BANK.find(w => w.en === en);
        if (w && !used.has(w.en)) {
          used.add(w.en);
          selected.push({ word: w, isReview: true });
        }
      }
    }

    // Last resort: pick random non-mastered words
    if (selected.length === 0) {
      const nonMastered = WORD_BANK.filter(w => !SRS.isMastered(w.en));
      for (let i = nonMastered.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [nonMastered[i], nonMastered[j]] = [nonMastered[j], nonMastered[i]];
      }
      for (const w of nonMastered) {
        if (selected.length >= dailyMax) break;
        selected.push({ word: w, isReview: false });
      }
    }

    Session.words = selected;
    return selected.length;
  },

  current() {
    if (Session.currentIdx >= Session.words.length) return null;
    return Session.words[Session.currentIdx];
  },

  recordResponse(en, quality) {
    SRS.update(en, quality);

    // Track in daily history
    if (!appData.dailyHistory[TODAY]) {
      appData.dailyHistory[TODAY] = { words: {}, completed: false };
    }
    appData.dailyHistory[TODAY].words[en] = quality;

    Session.results.push({ en, quality });
  },

  advance() {
    Session.currentIdx++;
    return Session.currentIdx < Session.words.length;
  },

  complete() {
    if (!Session.isReviewMode) {
      if (!appData.studyDays[TODAY]) {
        appData.studyDays[TODAY] = true;
        appData.totalDays = Object.keys(appData.studyDays).length;
      }

      const knownCount = Session.results.filter(r => SRS.Q[r.quality] >= 3).length;
      appData.totalWordsLearned += knownCount;

      const yesterday = addDays(TODAY, -1);
      if (appData.lastStudyDate === yesterday || appData.lastStudyDate === TODAY) {
        if (appData.lastStudyDate !== TODAY) appData.streak++;
      } else if (appData.lastStudyDate !== TODAY) {
        appData.streak = 1;
      }
      appData.lastStudyDate = TODAY;

      if (appData.dailyHistory[TODAY]) {
        appData.dailyHistory[TODAY].completed = true;
      }
    }
    Data.save(appData);
  },

  getStats() {
    const know = Session.results.filter(r => SRS.Q[r.quality] >= 3).length;
    const unknown = Session.results.filter(r => SRS.Q[r.quality] === 0).length;
    const total = Session.results.length;
    return { know, unknown, total };
  }
};

/* ================================================================
   COMPANION REACTIONS — simple template-based encouraging messages
   ================================================================ */
const Companion = {
  // Time-based greetings
  homeGreeting() {
    const h = new Date().getHours();
    const streak = calcStreak();
    const cat = SRS.categorize();

    if (h < 6) return { emoji: '🌙', msg: '夜深了，注意休息哦。明天再来吧！', sub: `还有 ${cat.unseen + cat.learning + cat.review} 个词等你探索` };
    if (h < 12) return { emoji: '☀️', msg: '早上好！一日之计在于晨，开始学习吧！', sub: `${cat.review} 个词等待复习，${cat.unseen} 个新词待解锁` };
    if (h < 18) return { emoji: '📚', msg: '下午好！来巩固一下今天的单词吧。', sub: `${cat.review} 个词等待复习，${cat.unseen} 个新词待解锁` };
    return { emoji: '🌆', msg: '晚上好！睡前学习效率更高哦。', sub: `${cat.review} 个词等待复习，${cat.unseen} 个新词待解锁` };
  },

  // Word intro
  wordIntro(item) {
    if (item.isReview) {
      const st = appData.wordStates[item.word.en];
      const attempts = st ? st.totalSeen : 1;
      if (attempts >= 3) return '这个词见过几次了，这次能记住吗？🧐';
      return '这个词之前遇到过，再来巩固一下吧！🔄';
    }
    const newToday = Session.results.filter(r => SRS.Q[r.quality] === undefined || !appData.wordStates[r.en]?.firstSeen).length;
    if (newToday === 0) return '来看看今天第一个新词！✨';
    if (newToday <= 3) return '新词来啦，认真看哦！👀';
    return '继续加油，又解锁一个新词！💪';
  },

  // Reaction to assessment
  reaction(quality) {
    const templates = {
      know: [
        '太棒了！这个词已经掌握了！🎉',
        '厉害！看来这个词已经牢牢记住了 💪',
        '轻轻松松，这个词不在话下！✅',
        '看来你真的很熟悉这个词呢！👍',
      ],
      unknown: [
        '没关系，今天就是来学习的！📖',
        '现在认识也不晚，多看几遍就记住了 🌱',
        '不认识很正常，这才是学习的意义呀！💡',
        '别灰心，每个词都是从陌生到熟悉的 ✨',
        '记下来，下次就认识了！📝',
      ]
    };
    const pool = templates[quality] || templates.unknown;
    return pool[Math.floor(Math.random() * pool.length)];
  },

  // Completion message
  completion(stats) {
    const { know, unknown, total } = stats;
    const accuracy = Math.round((know / total) * 100);

    let emoji, title, detail;
    if (accuracy >= 90) {
      emoji = '🏆'; title = '太厉害了！'; detail = `正确率 ${accuracy}%，几乎全对！`;
    } else if (accuracy >= 70) {
      emoji = '🎉'; title = '完成得很不错！'; detail = `正确率 ${accuracy}%，继续保持！`;
    } else if (accuracy >= 50) {
      emoji = '💪'; title = '不错的学习！'; detail = `正确率 ${accuracy}%，还有进步空间哦`;
    } else {
      emoji = '🌱'; title = '每一步都是进步！'; detail = `认识了 ${know} 个词，新词需要多见面几次`;
    }
    return { emoji, title, detail };
  }
};

  /* ---- Helpers ---- */
  stripPOS(zh) {
    return zh.replace(/^[a-z/]+\.\s*/, '').split('；')[0];
  },

  /* ---- Quiz ---- */
  prepareQuiz() {
    const item = Session.current();
    if (!item) return;

    const correctWord = item.word;
    const correctMeaning = UI.stripPOS(correctWord.zh);
    const usedTexts = new Set([correctMeaning]);
    const distractors = [];

    // Shuffle indices for random distractor picking
    const indices = WORD_BANK.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }

    for (const idx of indices) {
      if (distractors.length >= 3) break;
      const w = WORD_BANK[idx];
      if (w.en === correctWord.en) continue;
      const meaning = UI.stripPOS(w.zh);
      if (!usedTexts.has(meaning)) {
        usedTexts.add(meaning);
        distractors.push(meaning);
      }
    }

    // If not enough unique, relax constraint
    if (distractors.length < 3) {
      for (const idx of indices) {
        if (distractors.length >= 3) break;
        const w = WORD_BANK[idx];
        if (w.en === correctWord.en) continue;
        const meaning = UI.stripPOS(w.zh);
        if (!distractors.includes(meaning)) {
          distractors.push(meaning);
        }
      }
    }

    // Build and shuffle 4 options
    const options = [
      { text: correctMeaning, isCorrect: true },
      ...distractors.map(t => ({ text: t, isCorrect: false }))
    ];
    for (let i = options.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [options[i], options[j]] = [options[j], options[i]];
    }

    UI._quizOptions = options;
    UI._answered = false;
  },

      exDiv.innerHTML = '';

    // Context sentence — show first example with target word highlighted
    const ctxDiv = document.getElementById('wordContext');

      const btn = document.getElementById('quizOpt' + i);
      if (btn) {
        btn.textContent = opt.text;
        btn.className = 'quiz-opt';
        btn.disabled = false;
      }
    });
  },

  speakWord() {
    const item = Session.current();
    if (!item) return;

    const btn = document.getElementById('btnSpeak');
    btn.classList.add('speaking');

    // Stop any previous audio
    if (UI._audio) {
      UI._audio.pause();
      UI._audio = null;
    }

    const word = item.word.en.toLowerCase().trim();
    const cleanup = () => {
      btn.classList.remove('speaking');
      UI._audio = null;
    };

    // Primary: use free TTS audio (works on all devices, no API key needed)
    // Try multiple sources in sequence
    const tryAudio = (urls, idx) => {
      if (idx >= urls.length) {
        // All audio sources failed, try Web Speech API as last resort
        UI._speakFallback(item.word.en, cleanup);
        return;
      }
      const audio = new Audio();
      audio.src = urls[idx];
      audio.volume = 1;
      UI._audio = audio;
      audio.onended = cleanup;
      audio.onerror = () => tryAudio(urls, idx + 1);
      audio.play().catch(() => tryAudio(urls, idx + 1));
    };

    const urls = [
      `https://dict.youdao.com/dictvoice?type=0&audio=${encodeURIComponent(word)}`,
      `https://ssl.gstatic.com/dictionary/static/sounds/20200429/${word}--_gb_1.mp3`,
    ];
    tryAudio(urls, 0);
  },

  _speakFallback(word, cleanup) {
    // Web Speech API as last resort
    try {
      speechSynthesis.cancel();
      if (speechSynthesis.paused) speechSynthesis.resume();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      utterance.volume = 1;
      const voices = speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith('en'));
      if (enVoice) utterance.voice = enVoice;
      UI._fallbackUtterance = utterance;
      utterance.onend = () => { cleanup(); UI._fallbackUtterance = null; };
      utterance.onerror = () => { cleanup(); UI._fallbackUtterance = null; };
      setTimeout(() => { speechSynthesis.speak(utterance); }, 30);
    } catch (e) {
      cleanup();
    }
  },

  selectOption(index) {
    if (UI._answered) return;
    UI._answered = true;

    const option = UI._quizOptions[index];
    if (!option) return;

    const selectedBtn = document.getElementById('quizOpt' + index);
    const allBtns = [0, 1, 2, 3].map(i => document.getElementById('quizOpt' + i));
    const bubble = document.getElementById('learnHint');
    const item = Session.current();

    if (option.isCorrect) {
      // CORRECT: flash green, show translation, auto-advance
      selectedBtn.classList.add('correct');
      allBtns.forEach(b => { if (b) b.disabled = true; });

      bubble.textContent = Companion.reaction('know');
      bubble.classList.remove('show');
      requestAnimationFrame(() => bubble.classList.add('show'));

      // Show Chinese translation of the context sentence
      const ctxDiv = document.getElementById('wordContext');
      if (item.word.ex && item.word.ex.length > 0) {
        ctxDiv.innerHTML = '💡 ' + item.word.ex[0].zh;
      }

      Session.recordResponse(item.word.en, 'know');

      setTimeout(() => {
        if (Session.advance()) {
          UI.showCurrentWord();
        } else {
          UI.finishLearning();
        }
      }, 1000);
    } else {
      // WRONG: highlight wrong, reveal correct, show details
      selectedBtn.classList.add('wrong');

      const correctIdx = UI._quizOptions.findIndex(opt => opt.isCorrect);
      if (correctIdx >= 0) {
        const correctBtn = document.getElementById('quizOpt' + correctIdx);
        if (correctBtn) correctBtn.classList.add('correct');
      }

      allBtns.forEach((b, i) => {
        if (b && i !== index && i !== correctIdx) b.classList.add('dimmed');
        if (b) b.disabled = true;
      });

      bubble.textContent = Companion.reaction('unknown');
      bubble.classList.remove('show');
      requestAnimationFrame(() => bubble.classList.add('show'));

      Session.recordResponse(item.word.en, 'unknown');

      document.getElementById('wordDetails').classList.add('show');
      const confirmBtn = document.getElementById('btnConfirmKnow');
      if (confirmBtn) confirmBtn.classList.add('show');
    }
  },

  confirmKnow() {
    if (Session.advance()) {
      UI.showCurrentWord();
    } else {
      UI.finishLearning();
    }
  },

  confirmQuit() {
    const stats = Session.getStats();
    if (stats.total === 0) {
      UI.goHome();
      return;
    }
    const msg = `你已完成 ${stats.total} 个词中的 ${stats.total} 个。\n\n确定要退出吗？退出后本次进度不会保存。`;
    if (confirm(msg)) {
      UI.goHome();
    }
  },

  /* ---- Complete ---- */
  finishLearning() {
    const stats = Session.getStats();
    Session.complete();

    const { emoji, title, detail } = Companion.completion(stats);
    document.getElementById('completeEmoji').textContent = emoji;
    document.getElementById('completeTitle').textContent = title;
    document.getElementById('completeDetail').textContent = detail;

    // Streak badge
    document.getElementById('completeStreak').innerHTML = `🔥 连续学习 ${calcStreak()} 天`;

    // Harvest chips
    const harvestDiv = document.getElementById('harvestChips');
    harvestDiv.innerHTML = '';
    for (const r of Session.results) {
      const w = WORD_BANK.find(w => w.en === r.en);
      const label = w ? `${w.en}` : r.en;
      const cls = SRS.Q[r.quality] >= 3 ? 'chip chip-known' : 'chip chip-unknown';
      const symbol = SRS.Q[r.quality] >= 3 ? '✅' : '❌';
      harvestDiv.innerHTML += `<span class="${cls}">${symbol} ${label}</span>`;
    }

    // Tomorrow preview
    const previewSection = document.getElementById('previewSection');
    const dueTomorrow = SRS.getDueWords().filter(en => {
      const st = appData.wordStates[en];
      return st && st.nextReview && st.nextReview <= addDays(TODAY, 1);
    });
    if (dueTomorrow.length > 0) {
      previewSection.style.display = 'block';
      const previewChips = document.getElementById('previewChips');
      previewChips.innerHTML = dueTomorrow.slice(0, 10).map(en => {
        const w = WORD_BANK.find(w => w.en === en);
        return `<span class="preview-chip">${w ? w.en : en}</span>`;
      }).join('');
      if (dueTomorrow.length > 10) {
        previewChips.innerHTML += `<span class="preview-chip">+${dueTomorrow.length - 10} 更多</span>`;
      }
    } else {
      previewSection.style.display = 'none';
    }

    UI.switchPage('complete');
  },

  relearn() {
    const count = Session.prepare(false);
    if (count === 0) {
      alert('所有单词都在掌握中！');
      return;
    }
    UI.switchPage('learn');
    UI.showCurrentWord();
  },

  /* ---- Stats ---- */
  showStats() {
    const streak = calcStreak();
    const cat = SRS.categorize();

    document.getElementById('statsStreak').textContent = streak;
    document.getElementById('statsTotalDays').textContent = appData.totalDays;
    document.getElementById('statsMastered').textContent = cat.mastered;
    document.getElementById('statsInRotation').textContent = cat.review + cat.learning;

    // Calendar heatmap (last 90 days)
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    for (let i = 89; i >= 0; i--) {
      const date = addDays(TODAY, -i);
      const day = document.createElement('div');
      day.className = 'calendar-day';
      if (appData.studyDays[date]) day.classList.add('studied');
      day.title = date;
      grid.appendChild(day);
    }

    // Distribution
    const total = cat.total || 1;
    document.getElementById('distMastered').textContent = cat.mastered;
    document.getElementById('distMasteredBar').style.width = (cat.mastered / total * 100) + '%';
    document.getElementById('distReview').textContent = cat.review;
    document.getElementById('distReviewBar').style.width = (cat.review / total * 100) + '%';
    document.getElementById('distLearning').textContent = cat.learning;
    document.getElementById('distLearningBar').style.width = (cat.learning / total * 100) + '%';
    document.getElementById('distNew').textContent = cat.unseen;
    document.getElementById('distNewBar').style.width = (cat.unseen / total * 100) + '%';

    // Header button
    document.getElementById('headerStatsBtn').textContent = '🏠 首页';
    document.getElementById('headerStatsBtn').onclick = () => UI.goHome();

    UI.switchPage('stats');
  }
};

/* ================================================================
   INIT
   ================================================================ */
document.addEventListener('DOMContentLoaded', () => {
  // Preload speech synthesis voices (loads asynchronously on most browsers)
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };

  UI.renderHome();
});
</script>
