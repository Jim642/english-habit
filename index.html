<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小E — AI英语学习搭子</title>
<style>
/* ===================================================================
   Design Tokens
   =================================================================== */
:root {
  --primary: #6366F1;
  --primary-light: #818CF8;
  --primary-bg: #EEF2FF;
  --bg: #F5F3FA;
  --card: #FFFFFF;
  --text: #1E1B4B;
  --text2: #4B5563;
  --text3: #9CA3AF;
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --sep: #E8E5F0;
  --radius: 20px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --shadow: 0 2px 16px rgba(99,102,241,0.08);
  --shadow-lg: 0 8px 32px rgba(99,102,241,0.12);
}

/* ===================================================================
   Reset & Base
   =================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(180deg, #EDE9FE 0%, var(--bg) 30%, #FFF 100%);
  color: var(--text);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ===================================================================
   Header
   =================================================================== */
.header {
  padding: 16px 20px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(237,233,254,0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.header-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-title .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--primary);
}

.header-time {
  font-size: 12px;
  color: var(--text3);
  font-weight: 500;
}

/* ===================================================================
   Pages
   =================================================================== */
.page {
  flex: 1;
  display: none;
  flex-direction: column;
  padding: 8px 20px 100px;
  overflow-y: auto;
}
.page.active { display: flex; }

/* ===================================================================
   Bottom Navigation
   =================================================================== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--sep);
  display: flex;
  padding: 8px 20px max(8px, env(safe-area-inset-bottom));
  z-index: 200;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 0;
  border: none;
  background: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 10px;
  font-weight: 600;
  color: var(--text3);
  transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.nav-item.active { color: var(--primary); }
.nav-item .nav-icon { font-size: 22px; line-height: 1; }

/* ===================================================================
   Home Page
   =================================================================== */

/* Time greeting */
.time-greeting {
  text-align: center;
  padding: 4px 0 2px;
  font-size: 13px;
  color: var(--text3);
  font-weight: 500;
}

/* Companion card */
.companion-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px 24px 24px;
  text-align: center;
  margin: 10px 0 16px;
  animation: cardIn 0.5s ease-out;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.companion-avatar {
  font-size: 60px;
  line-height: 1;
  margin-bottom: 10px;
  display: block;
  animation: float 2.5s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.companion-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 6px;
}

.companion-greeting {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 14px;
}

/* Stats row */
.stats-row {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 4px;
}

.stat-item {
  text-align: center;
}

.stat-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.3px;
}

.stat-label {
  font-size: 11px;
  color: var(--text3);
  font-weight: 500;
  margin-top: 1px;
}

/* Action buttons */
.home-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 14px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  padding: 15px 24px;
  font-family: inherit;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  width: 100%;
}

.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 16px rgba(99,102,241,0.35);
}

.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1.5px solid var(--sep);
}

.btn-chat {
  background: var(--card);
  color: var(--primary);
  border: 1.5px solid var(--primary-bg);
}

.btn-review-badge {
  display: inline-block;
  background: #FEF3C7;
  color: #D97706;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 8px;
  margin-left: 4px;
}

/* Yesterday review */
.yesterday-section {
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: 14px 18px;
  margin-bottom: 12px;
}

.yesterday-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text3);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.yesterday-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 8px;
}

.chip-known { background: #D1FAE5; color: #065F46; }
.chip-unknown { background: #FEE2E2; color: #991B1B; }

/* Today completed state */
.completed-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #D1FAE5;
  color: #065F46;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
  margin-top: 4px;
}

/* ===================================================================
   Learning Page
   =================================================================== */
.learn-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.btn-back {
  background: none;
  border: 1.5px solid var(--sep);
  border-radius: var(--radius-xs);
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  color: var(--text2);
  -webkit-tap-highlight-color: transparent;
}

.btn-back:active { background: #F3F4F6; }

.progress-wrap { flex: 1; }

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 6px;
}

.progress-bar {
  height: 5px;
  background: #E8E5F0;
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width 0.3s ease;
}

/* 小E intro */
.ee-intro {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
}

.ee-intro-avatar {
  font-size: 26px;
  line-height: 1;
  flex-shrink: 0;
  opacity: 0;
  transform: translateY(6px);
  transition: all 0.3s ease;
}
.ee-intro-avatar.show { opacity: 1; transform: translateY(0); }

.ee-intro-bubble {
  background: #FFF9EB;
  border: 1px solid #FDE68A;
  border-radius: 12px;
  border-top-left-radius: 4px;
  padding: 10px 14px;
  font-size: 13px;
  color: #92400E;
  line-height: 1.5;
  opacity: 0;
  transform: translateY(6px);
  transition: all 0.3s ease;
}
.ee-intro-bubble.show { opacity: 1; transform: translateY(0); }

/* Word card */
.word-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 36px 28px;
  text-align: center;
  margin-bottom: 16px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.word-card.swipe-out {
  transform: translateY(-10px);
  opacity: 0;
}

.word-card .review-tag {
  font-size: 11px;
  font-weight: 600;
  color: #DC2626;
  background: #FEE2E2;
  padding: 3px 10px;
  border-radius: 8px;
  margin-bottom: 12px;
}

.word-en {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
  margin-bottom: 8px;
}

.word-phonetic {
  font-size: 14px;
  color: var(--text3);
  margin-bottom: 12px;
}

.word-cn {
  font-size: 18px;
  color: var(--text2);
  font-weight: 500;
  line-height: 1.5;
}

/* 小E reaction */
.ee-reaction {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 20px;
  min-height: 44px;
}

.ee-reaction-avatar {
  font-size: 28px;
  line-height: 1;
  flex-shrink: 0;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.25s ease;
}
.ee-reaction-avatar.show { opacity: 1; transform: translateY(0); }

.ee-reaction-bubble {
  background: var(--card);
  border-radius: 14px;
  border-top-left-radius: 4px;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--text2);
  line-height: 1.5;
  box-shadow: var(--shadow);
  max-width: 85%;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.25s ease;
  white-space: pre-line;
}
.ee-reaction-bubble.show { opacity: 1; transform: translateY(0); }

/* Action buttons */
.learn-actions {
  display: flex;
  gap: 12px;
}

.btn-learn {
  flex: 1;
  height: 52px;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 600;
  border: 2px solid transparent;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
  -webkit-tap-highlight-color: transparent;
}

.btn-learn:active { transform: scale(0.95); }
.btn-learn:disabled { opacity: 0.5; pointer-events: none; }

.btn-unknown {
  background: var(--card);
  color: #DC2626;
  border-color: #FEE2E2;
}

.btn-know {
  background: var(--card);
  color: #059669;
  border-color: #D1FAE5;
}

/* ===================================================================
   Complete Page
   =================================================================== */
.complete-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px 0;
}

.complete-avatar {
  font-size: 68px;
  line-height: 1;
  margin-bottom: 16px;
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}

.complete-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 6px;
}

.complete-detail {
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 16px;
  line-height: 1.5;
}

.complete-streak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #EDE9FE;
  color: var(--primary);
  font-size: 15px;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: 20px;
  margin-bottom: 14px;
}

/* Harvest */
.harvest-section {
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: 14px 18px;
  margin-bottom: 12px;
  width: 100%;
  text-align: left;
}

.harvest-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text3);
  margin-bottom: 8px;
}

.harvest-chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Preview */
.preview-section {
  background: #FFF9EB;
  border-radius: var(--radius-sm);
  border: 1px solid #FDE68A;
  padding: 14px 18px;
  margin-bottom: 12px;
  width: 100%;
  text-align: left;
}

.preview-title {
  font-size: 12px;
  font-weight: 600;
  color: #92400E;
  margin-bottom: 8px;
}

.preview-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.preview-chip {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 8px;
  background: #FFF;
  color: #92400E;
  border: 1px solid #FDE68A;
}

.complete-farewell {
  font-size: 15px;
  color: var(--text2);
  font-weight: 500;
  margin-bottom: 24px;
  line-height: 1.5;
}

.btn-farewell {
  background: var(--primary);
  color: #fff;
  width: 100%;
  height: 54px;
  font-size: 17px;
  letter-spacing: -0.2px;
  box-shadow: 0 4px 16px rgba(99,102,241,0.35);
}

.relearn-link {
  margin-top: 14px;
  font-size: 13px;
  color: var(--text3);
}
.relearn-link span { color: var(--primary); cursor: pointer; font-weight: 600; }

/* ===================================================================
   Chat Page
   =================================================================== */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-bottom: 0;
}

.chat-header-bar {
  text-align: center;
  padding: 8px 0 16px;
  border-bottom: 1px solid var(--sep);
  margin-bottom: 8px;
}

.chat-header-bar .chat-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.chat-header-bar .chat-sub {
  font-size: 12px;
  color: var(--text3);
  margin-top: 2px;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.chat-msg {
  display: flex;
  gap: 8px;
  max-width: 85%;
  animation: msgIn 0.3s ease-out;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.chat-msg.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.chat-msg .msg-avatar {
  font-size: 24px;
  line-height: 1;
  flex-shrink: 0;
}

.chat-msg .msg-bubble {
  background: var(--card);
  border-radius: 14px;
  padding: 10px 16px;
  font-size: 14px;
  line-height: 1.5;
  box-shadow: var(--shadow);
  color: var(--text2);
}

.chat-msg.ee .msg-bubble {
  border-top-left-radius: 4px;
  background: #FFF9EB;
  border: 1px solid #FDE68A;
}

.chat-msg.user .msg-bubble {
  border-top-right-radius: 4px;
  background: var(--primary);
  color: #fff;
}

.chat-input-area {
  display: flex;
  gap: 8px;
  padding: 12px 0 0;
  border-top: 1px solid var(--sep);
}

.chat-input {
  flex: 1;
  border: 1.5px solid var(--sep);
  border-radius: var(--radius-xs);
  padding: 10px 14px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  background: var(--card);
}

.chat-input:focus { border-color: var(--primary-light); }

.btn-send {
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-xs);
  padding: 10px 18px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.btn-send:active { opacity: 0.8; }
.btn-send:disabled { opacity: 0.5; }

/* API key notice */
.api-key-notice {
  background: #FEF3C7;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  text-align: center;
  margin-bottom: 12px;
}

.api-key-notice p {
  font-size: 13px;
  color: #92400E;
  line-height: 1.5;
  margin-bottom: 8px;
}

.api-key-notice input {
  width: 100%;
  border: 1px solid #FDE68A;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  font-family: monospace;
  outline: none;
  background: #FFF;
  text-align: center;
}

.api-key-notice .btn-save-key {
  margin-top: 8px;
  background: #D97706;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 12px 16px;
}

.typing-indicator span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #D1D5DB;
  animation: typing 1.4s ease-in-out infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-8px); opacity: 1; }
}

/* ===================================================================
   Milestone Celebration Overlay
   =================================================================== */
.milestone-overlay {
  position: fixed;
  inset: 0;
  background: rgba(30,27,75,0.7);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.milestone-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 36px 28px;
  text-align: center;
  max-width: 340px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.milestone-emoji { font-size: 72px; line-height: 1; margin-bottom: 12px; }

.milestone-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 8px;
}

.milestone-msg {
  font-size: 15px;
  color: var(--text2);
  line-height: 1.6;
  margin-bottom: 20px;
}

.btn-milestone {
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 14px 32px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.btn-milestone:active { transform: scale(0.96); }

/* ===================================================================
   Confetti
   =================================================================== */
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0); opacity: 1; }
  100% { transform: translateY(-200px) rotate(720deg); opacity: 0; }
}

.confetti-piece {
  position: fixed;
  width: 10px; height: 10px;
  border-radius: 2px;
  animation: confettiFall 1.2s ease-out forwards;
  pointer-events: none;
  z-index: 400;
}

/* ===================================================================
   Responsive
   =================================================================== */
@media (min-width: 480px) {
  .app {
    border-left: 1px solid var(--sep);
    border-right: 1px solid var(--sep);
  }
}

@media (max-width: 360px) {
  .companion-avatar { font-size: 48px; }
  .companion-greeting { font-size: 14px; }
  .word-en { font-size: 28px; }
  .word-cn { font-size: 16px; }
  .complete-avatar { font-size: 52px; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-title">小E英语<span class="dot"></span></div>
    <div class="header-time" id="headerTime"></div>
  </header>

  <!-- ===== Home Page ===== -->
  <main class="page active" id="page-home">
    <div class="time-greeting" id="timeGreeting"></div>

    <div class="companion-card" id="companionCard">
      <span class="companion-avatar">🐣</span>
      <div class="companion-name">小E</div>
      <div class="companion-greeting" id="companionGreeting"></div>

      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-value" id="statStreak">0</div>
          <div class="stat-label">连续天数</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statTotalWords">0</div>

/* ===================================================================
   Helper Functions
   =================================================================== */
function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++)
    hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
  return Math.abs(hash);
}

function yesterdayStr() {
  const d = new Date(TODAY + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().split('T')[0];
}

function absDays() {
  if (!appData.lastStudyDate) return 999;
  if (appData.lastStudyDate === TODAY) return 0;
  const a = new Date(appData.lastStudyDate + 'T00:00:00');
  const b = new Date(TODAY + 'T00:00:00');
  return Math.floor((b - a) / 86400000);
}

/* ===================================================================
   Daily Words
   =================================================================== */
function getReviewWords(limit = 5) {
  const reviewed = new Set(appData.reviewedToday || []);
  const knownSet = new Set();
  for (const k of Object.keys(appData.dailyHistory))
    for (const w of appData.dailyHistory[k].known || []) knownSet.add(w);

  return Object.keys(appData.unknownWords)
    .filter(w => !reviewed.has(w) && !knownSet.has(w))
    .sort((a, b) => (appData.unknownWords[a]||'').localeCompare(appData.unknownWords[b]||''))
    .slice(0, limit);
}

function getYesterdayUnknowns() {
  const yRec = appData.dailyHistory[yesterdayStr()];
  if (!yRec) return [];
  const reviewed = new Set(appData.reviewedToday || []);
  return (yRec.unknown || []).filter(w => !reviewed.has(w));
}

let dailyWords = [];

function prepareDailyWords() {
  const rw = getReviewWords(5);
  const rSet = new Set(rw);
  const result = rw.map(en => WORD_POOL.find(w => w.en === en) || { en, phonetic: '', cn: '' });
  if (result.length < 5) {
    const seed = hashCode(TODAY);
    const used = new Set(result.map(w => w.en));
    let s = seed;
    while (result.length < 5 && used.size < WORD_POOL.length) {
      s = ((s * 1103515245 + 12345) >>> 0) % WORD_POOL.length;
      if (!used.has(WORD_POOL[s].en)) {
        used.add(WORD_POOL[s].en);
        result.push(WORD_POOL[s]);
      }
    }
  }
  dailyWords = result;
}

function isReviewWord(en) {
  return en in (appData.unknownWords || {}) && !(appData.reviewedToday || []).includes(en);
}

/* ===================================================================
   Streak & Stats
   =================================================================== */
function calcStreak() {
  if (!appData.lastStudyDate) return 0;
  const d = absDays();
  return d <= 1 ? appData.streak : 0;
}

appData.streak = calcStreak();

/* ===================================================================
   小E — Greetings & Reactions
   =================================================================== */
function getTimeGreeting() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return '☀️ 早安';
  if (h >= 12 && h < 18) return '🌤️ 下午好';
  if (h >= 18 && h < 23) return '🌙 晚上好';
  return '🌙 夜深了';
}

function getHomeGreeting() {
  const streak = appData.streak;
  const yRec = appData.dailyHistory[yesterdayStr()];
  const reviewCount = getReviewWords().length;
  const isDone = !!appData.studyDays[TODAY];

  if (isDone) {
    const pool = [
      '今天学完啦！休息一下，明天见 🐣',
      '任务完成！你今天真棒 ✨',
      '今天的份已经学完了，明天这个时间我还在～',
    ];
    return pool[hashCode(TODAY+'done') % pool.length];
  }

  let wordRef = '';
  if (yRec) {
    const yk = yRec.known || [], yu = yRec.unknown || [];
    if (yk.length > 0) {
      wordRef = ` 昨天你认识了 ${yk.slice(0,2).join('、')}${yk.length>2?'等':''}✨`;
      if (yu.length > 0) wordRef += `，还有 ${yu.length} 个待复习`;
    }
  }

  const h = new Date().getHours();
  let timePrefix = '';
  if (h >= 5 && h < 12) timePrefix = '早安！';
  else if (h >= 12 && h < 18) timePrefix = '下午好～';
  else timePrefix = '晚上好，';

  if (streak === 0) {
    return `${timePrefix}从今天起我们就是搭子了 🐣` + wordRef;
  }
  if (streak === 1) {
    return `又见面了！连续来两天的人都挺厉害的 😤` + wordRef;
  }
  if (streak >= 2 && streak <= 3) {
    const p = ['你来啦！今天我准备了几个好词～', '嘿嘿，我就知道你会来 🐣'];
    return p[hashCode(TODAY+'d2') % p.length] + wordRef;
  }
  if (streak >= 4 && streak <= 6) {
    const p = [`第${streak}天了！我就知道你不是三分钟热度 😤`, `第${streak}天～你已经习惯每天见我了吧？`];
    return p[hashCode(TODAY+'d4') % p.length] + wordRef;
  }
  const p = [`第${streak}天了！能坚持一周的人不到一半 📊`, `连续${streak}天！你已经打败大部分同学了 📈`, `${streak}天！你也太稳了吧 🔥`];
  return p[hashCode(TODAY+'d7') % p.length] + wordRef;
}

function getIntroMsg(en, idx, total, isReview, prevResult) {
  if (isReview) {
    const cnt = (Object.keys(appData.dailyHistory).filter(k => {
      const d = appData.dailyHistory[k];
      return (d.known||[]).includes(en) || (d.unknown||[]).includes(en);
    }).length) + 1;
    if (cnt >= 3) return `"${en}" 第三次见了，这次一定要记住！😤`;
    if (cnt >= 2) return `"${en}" 上次没记住，这次再试试～`;
    return `这个词昨天你不认识，今天再试一次～`;
  }
  if (idx === 0) {
    const p = ['准备好了吗？开始吧！🐣', '来看看今天第一个词～', '开始了哦！'];
    return p[hashCode(TODAY+'s') % p.length];
  }
  if (idx === total - 1) {
    const p = ['最后一个，冲！💪', '今天的收官词～', '最后一个，坚持！'];
    return p[hashCode(TODAY+'l') % p.length];
  }
  if (prevResult === 'unknown') {
    const p = ['没关系，这个词肯定更简单～', '这个词你应该认识～', '换个简单的缓一缓～'];
    return p[hashCode(TODAY+en) % p.length];
  }
  if (prevResult === 'know') {
    const p = ['状态不错！继续～', '保持这个节奏 ✨', '下一个，趁热打铁～'];
    return p[hashCode(TODAY+en) % p.length];
  }
  return '来看看下一个词～';
}

function getReaction(type, en, wasReview) {
  const w = WORD_POOL.find(x => x.en === en);
  const mnem = w ? w.mnemonic : '';
  if (type === 'know' && wasReview)
    return '昨天不认识今天就记住了！你怎么做到的 🎉';
  if (type === 'know') {
    const p = ['这个词你本来就会，基础不错！', '拿捏了 ✨', '稳！这个词你已经掌握了 ✅', '认识这个词，四六级多一分 😼'];
    return p[hashCode(en+'k') % p.length];
  }
  if (type === 'unknown' && wasReview)
    return mnem ? `这个词确实难。记法：${mnem}` : '没关系，下次见就有印象了 🐣';
  if (type === 'unknown')
    return mnem ? `好的，我记下了！💡 ${mnem}` : '没事，见过一次就有印象了～';
  return '好的～';
}

function getCompleteFarewell(pending) {
  if (pending > 0) return `明天我们先复习这 ${pending} 个词，不见不散！🤙`;
  const p = ['明天这个时间我准备了新词等你 🐣', '明天见！小E每天都会在这里～', '说好了，明天见 👋', '明天也要来找我哦，拉钩 🤙'];
  return p[Math.floor(Math.random() * p.length)];
}

/* ===================================================================
   Page Switching
   =================================================================== */
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const pg = document.getElementById('page-' + name);
  if (pg) pg.classList.add('active');

  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const nav = document.getElementById('nav' + name.charAt(0).toUpperCase() + name.slice(1));
  if (nav) nav.classList.add('active');

  if (name === 'home') renderHome();
  if (name === 'chat') renderChat();
}

function goHome() {
  switchPage('home');
}

/* ===================================================================
   Home Rendering
   =================================================================== */
function renderHome() {
  document.getElementById('headerTime').textContent =
    `${new Date().getMonth()+1}月${new Date().getDate()}日 · ${['日','一','二','三','四','五','六'][new Date().getDay()]}`;
  document.getElementById('timeGreeting').textContent = getTimeGreeting();
  document.getElementById('companionGreeting').textContent = getHomeGreeting();

  // Stats
  document.getElementById('statStreak').textContent = appData.streak;
  document.getElementById('statTotalWords').textContent = appData.totalWordsLearned;
  document.getElementById('statTotalDays').textContent = appData.totalDays;

  // Completed tag
  const ct = document.getElementById('completedTag');
  if (appData.studyDays[TODAY]) {
    ct.innerHTML = '<span class="completed-tag">✅ 今日已完成</span>';
  } else {
    ct.innerHTML = '';
  }

  // Start button
  const btn = document.getElementById('btnStart');
  if (appData.studyDays[TODAY]) {
    btn.textContent = '✅ 今日已完成，明天见！';
    btn.style.opacity = '0.6';
    btn.onclick = () => switchPage('complete');
  } else {
    btn.textContent = '📖 开始学习';
    btn.style.opacity = '1';
    btn.onclick = startLearning;
  }

  // Review button
  const yu = getYesterdayUnknowns();
  const btnReview = document.getElementById('btnReview');
  if (yu.length > 0 && !appData.studyDays[TODAY]) {
    btnReview.style.display = 'flex';
    document.getElementById('reviewBadgeCount').textContent = yu.length;
  } else {
    btnReview.style.display = 'none';
  }

  // Yesterday section
  const yRec = appData.dailyHistory[yesterdayStr()];
  const ys = document.getElementById('yesterdaySection');
  if (yRec) {
    ys.style.display = 'block';
    let c = '';
    for (const w of (yRec.known||[])) c += `<span class="chip chip-known">✅ ${w}</span>`;
    for (const w of (yRec.unknown||[])) c += `<span class="chip chip-unknown">⚠️ ${w}</span>`;
    document.getElementById('yesterdayChips').innerHTML = c;
  } else {
    ys.style.display = 'none';
  }

  // Refresh card
  const card = document.getElementById('companionCard');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'cardIn 0.5s ease-out';
}

/* ===================================================================
   Learning Flow
   =================================================================== */
let currentIndex = 0;
let knownCount = 0;
let consecutiveK = 0, consecutiveU = 0;
let lastResult = null;
let isReviewMode = false;  // true = only reviewing yesterday unknowns
let reviewWordsList = [];

function startLearning() {
  if (appData.studyDays[TODAY]) return;
  isReviewMode = false;
  prepareDailyWords();
  currentIndex = 0;
  knownCount = 0;
  consecutiveK = 0; consecutiveU = 0;
  lastResult = null;
  switchPage('learn');
  showWord(0);
}

function startReview() {
  if (appData.studyDays[TODAY]) return;
  const yu = getYesterdayUnknowns();
  if (yu.length === 0) return;
  isReviewMode = true;
  reviewWordsList = yu.map(en => WORD_POOL.find(w => w.en === en) || { en, phonetic: '', cn: '' });
  currentIndex = 0;
  knownCount = 0;
  consecutiveK = 0; consecutiveU = 0;
  lastResult = null;
  switchPage('learn');
  showWord(0);
}

function showWord(idx) {
  const words = isReviewMode ? reviewWordsList : dailyWords;
  if (idx >= words.length) { finishLearning(); return; }

  const w = words[idx];
  const card = document.getElementById('wordCard');
  card.classList.remove('swipe-out');
  document.getElementById('wordEn').textContent = w.en;
  document.getElementById('wordPhonetic').textContent = w.phonetic || '';
  document.getElementById('wordCn').textContent = w.cn || '';

  const rt = document.getElementById('reviewTag');
  rt.style.display = isReviewWord(w.en) ? 'inline-block' : 'none';

  document.getElementById('progressText').textContent = `${idx+1} / ${words.length}`;
  document.getElementById('progressFill').style.width = `${(idx/words.length)*100}%`;
  document.getElementById('progressLabel').textContent =
    isReviewMode ? `复习 ${idx+1}/${words.length}` :
    isReviewWord(w.en) ? `复习第 ${idx+1} 个` : `第 ${idx+1} 个词`;

  // 小E intro
  const intro = getIntroMsg(w.en, idx, words.length, isReviewWord(w.en) && !isReviewMode, lastResult);
  showIntro(intro);

  // Card reveal
  card.classList.remove('fade-up');
  card.style.opacity = '0';
  void card.offsetWidth;
  setTimeout(() => {
    card.style.opacity = '';
    card.classList.add('fade-up');
  }, 350);

  document.getElementById('btnKnow').disabled = false;
  document.getElementById('btnUnknown').disabled = false;
  hideReaction();
}

function markWord(type) {
  const words = isReviewMode ? reviewWordsList : dailyWords;
  const w = words[currentIndex];
  const wasReview = isReviewWord(w.en);

  if (type === 'know') { knownCount++; consecutiveK++; consecutiveU = 0; }
  else { consecutiveU++; consecutiveK = 0; }

  // Update unknownWords
  if (type === 'unknown') {
    if (!appData.unknownWords[w.en]) appData.unknownWords[w.en] = TODAY;
  } else {
    delete appData.unknownWords[w.en];
  }

  if (!appData.reviewedToday.includes(w.en)) appData.reviewedToday.push(w.en);

  // dailyHistory
  if (!appData.dailyHistory[TODAY]) appData.dailyHistory[TODAY] = { known: [], unknown: [] };
  const dh = appData.dailyHistory[TODAY];
  if (type === 'know') {
    if (!dh.known.includes(w.en)) dh.known.push(w.en);
    const i = dh.unknown.indexOf(w.en);
    if (i >= 0) dh.unknown.splice(i, 1);
  } else {
    if (!dh.unknown.includes(w.en)) dh.unknown.push(w.en);
    const i = dh.known.indexOf(w.en);
    if (i >= 0) dh.known.splice(i, 1);
  }
  saveData(appData);

  // Reaction
  let msg = getReaction(type, w.en, wasReview);
  if (type === 'know' && consecutiveK >= 3)
    msg += '\n连续认识3个了！今天状态很好 🔥';
  if (type === 'unknown' && consecutiveU >= 2)
    msg += '\n这几个确实有点偏，不是你的问题 🐣';
  showReaction(msg);

  document.getElementById('btnKnow').disabled = true;
  document.getElementById('btnUnknown').disabled = true;

  const card = document.getElementById('wordCard');
  card.classList.add('swipe-out');

  currentIndex++;
  lastResult = type;
  document.getElementById('progressFill').style.width = `${(currentIndex/words.length)*100}%`;
  document.getElementById('progressText').textContent = `${Math.min(currentIndex+1,words.length)} / ${words.length}`;

  setTimeout(() => showWord(currentIndex), 750);
}

function showIntro(msg) {
  const a = document.getElementById('eeIntroAvatar');
  const b = document.getElementById('eeIntroBubble');
  b.textContent = msg;
  a.classList.add('show'); b.classList.add('show');
}

function showReaction(msg) {
  const a = document.getElementById('eeReactionAvatar');
  const b = document.getElementById('eeReactionBubble');
  b.textContent = msg;
  a.classList.add('show'); b.classList.add('show');
}

function hideReaction() {
  document.getElementById('eeReactionAvatar').classList.remove('show');
  document.getElementById('eeReactionBubble').classList.remove('show');
}

function confirmQuit() {
  const words = isReviewMode ? reviewWordsList : dailyWords;
  if (currentIndex > 0 && currentIndex < words.length) {
    if (confirm('确定要退出吗？当前进度不会保存。')) goHome();
  } else {
    goHome();
  }
}

/* ===================================================================
   Complete Flow
   =================================================================== */
function finishLearning() {
  const words = isReviewMode ? reviewWordsList : dailyWords;

  if (!isReviewMode) {
    if (!appData.studyDays[TODAY]) {
      appData.studyDays[TODAY] = true;
      appData.totalDays = Object.keys(appData.studyDays).length;
    }
    appData.totalWordsLearned += knownCount;

    const ys = yesterdayStr();
    if (appData.lastStudyDate === ys || appData.lastStudyDate === TODAY) {
      if (appData.lastStudyDate !== TODAY) appData.streak++;
    } else if (appData.lastStudyDate !== TODAY) {
      appData.streak = 1;
    }
    appData.lastStudyDate = TODAY;
  }
  saveData(appData);

  const total = words.length;
  const unknownCount = total - knownCount;
  const dh = appData.dailyHistory[TODAY] || { known: [], unknown: [] };

  // Title
  if (knownCount === total) {
    const p = ['今天的词你全会！🎉', '全对！你也太强了吧', '全会！你是不是偷偷卷了 😼'];
    document.getElementById('completeTitle').textContent = p[Math.floor(Math.random()*p.length)];
  } else if (knownCount >= total/2) {
    document.getElementById('completeTitle').textContent = `认识了 ${knownCount} 个，新认识 ${unknownCount} 个`;
  } else {
    document.getElementById('completeTitle').textContent = '今天这几个确实有点难！见过就是进步～';
  }

  document.getElementById('completeDetail').textContent =
    unknownCount > 0 ? `明天这 ${unknownCount} 个词会优先复习～` : '休息一下，明天继续～';

  document.getElementById('completeStreakBadge').innerHTML = `🔥 我们已经一起 ${appData.streak} 天啦`;

  // Harvest
  let hHTML = '';
  for (const w of (dh.known||[])) hHTML += `<span class="chip chip-known">✅ ${w}</span>`;
  for (const w of (dh.unknown||[])) hHTML += `<span class="chip chip-unknown">⚠️ ${w}</span>`;
  if (!hHTML) for (const w of words) hHTML += `<span class="chip chip-known">✅ ${w.en}</span>`;
  document.getElementById('harvestChips').innerHTML = hHTML;
  document.getElementById('harvestSection').style.display = 'block';

  // Preview
  const pending = getReviewWords();
  const ps = document.getElementById('previewSection');
  if (pending.length > 0) {
    ps.style.display = 'block';
    document.getElementById('previewChips').innerHTML =
      pending.map(w => `<span class="preview-chip">🔮 ${w}</span>`).join('');
  } else { ps.style.display = 'none'; }

  document.getElementById('completeFarewell').textContent = getCompleteFarewell(pending.length);

  switchPage('complete');
  spawnConfetti();
}

function relearn() {
  const words = isReviewMode ? reviewWordsList : dailyWords;
  currentIndex = 0; knownCount = 0;
  consecutiveK = 0; consecutiveU = 0; lastResult = null;
  switchPage('learn');
  showWord(0);
}

/* ===================================================================
   Chat (DeepSeek API)
   =================================================================== */
const DEEPSEEK_URL = 'https://api.deepseek.com/v1/chat/completions';
const SYSTEM_PROMPT = `你是小E，用户的英语学习搭子。

你的职责：
- 鼓励用户坚持学习英语
- 用温暖、友善的语气交流
- 回复控制在100字以内
- 像朋友一样，不要像老师
- 可以适当使用emoji
- 如果用户说不想学了，要理解和鼓励，不要批评
- 偶尔可以分享英语学习的小技巧

你的性格：
- 温暖、贴心、有点可爱
- 像一只刚破壳的小鸡 🐣
- 真心希望用户学好英语`;

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) { alert('请输入 API Key'); return; }
  appData.apiKey = key;
  saveData(appData);
  document.getElementById('apiKeyNotice').style.display = 'none';
  renderChat();
  addChatMsg('ee', 'API Key 已保存！现在可以和我聊天啦 🐣');
}

function getApiKey() {
  return appData.apiKey || '';
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  const apiKey = getApiKey();
  if (!apiKey) {
    alert('请先设置 DeepSeek API Key');
    return;
  }

  input.value = '';
  addChatMsg('user', msg);

  // Typing indicator
  const ti = document.getElementById('typingIndicator');
  ti.style.display = 'flex';
  document.getElementById('btnSend').disabled = true;
  scrollChat();

  try {
    const resp = await fetch(DEEPSEEK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...getChatContext().map(c => ({ role: c.role === 'ee' ? 'assistant' : 'user', content: c.content }))
        ],
        max_tokens: 300,
        temperature: 0.8
      })
    });

    ti.style.display = 'none';
    document.getElementById('btnSend').disabled = false;

    if (!resp.ok) {
      const err = await resp.text();
      addChatMsg('ee', '😅 好像出了点问题……可能是 API Key 不对，检查一下？');
      console.error('DeepSeek API error:', err);
      return;
    }

    const data = await resp.json();
    const reply = data.choices?.[0]?.message?.content || '嗯…让我想想 🤔';
    addChatMsg('ee', reply);
  } catch (e) {
    ti.style.display = 'none';
    document.getElementById('btnSend').disabled = false;
    addChatMsg('ee', '😅 网络好像不太稳定，等会再试试？');
    console.error('Chat error:', e);
  }
}

function getChatContext() {
  // Only send last 20 messages for context
  return (appData.chatHistory || []).slice(-20);
}

function addChatMsg(role, content) {
  const msg = { role, content, time: new Date().toISOString() };
  appData.chatHistory.push(msg);
  if (appData.chatHistory.length > 200) appData.chatHistory = appData.chatHistory.slice(-200);
  saveData(appData);

  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-msg ' + (role === 'ee' ? 'ee' : 'user');
  div.innerHTML = `
    <span class="msg-avatar">${role === 'ee' ? '🐣' : '😊'}</span>
    <div class="msg-bubble">${escapeHtml(content)}</div>
  `;
  container.appendChild(div);
  scrollChat();
}

function renderChat() {
  const container = document.getElementById('chatMessages');
  container.innerHTML = '';

  // Show API key notice if not set
  const notice = document.getElementById('apiKeyNotice');
  if (!getApiKey()) {
    notice.style.display = 'block';
    document.getElementById('apiKeyInput').value = '';
  } else {
    notice.style.display = 'none';
  }

  // Render last 50 messages
  const msgs = (appData.chatHistory || []).slice(-50);
  for (const m of msgs) {
    const div = document.createElement('div');
    div.className = 'chat-msg ' + (m.role === 'ee' ? 'ee' : 'user');
    div.innerHTML = `
      <span class="msg-avatar">${m.role === 'ee' ? '🐣' : '😊'}</span>
      <div class="msg-bubble">${escapeHtml(m.content)}</div>
    `;
    container.appendChild(div);
  }

  // Welcome message
  if (msgs.length === 0 && getApiKey()) {
    addChatMsg('ee', '嘿！我是小E，你的英语学习搭子 🐣\n有什么想聊的吗？');
  }

  scrollChat();
}

function scrollChat() {
  const container = document.getElementById('chatMessages');
  setTimeout(() => { container.scrollTop = container.scrollHeight; }, 100);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}

/* ===================================================================
   Milestone Celebration
   =================================================================== */
function checkMilestone() {
  if (appData.studyDays[TODAY]) return; // Only show before studying
  const streak = appData.streak;
  const milestones = { 7: '🎉', 21: '🏆', 30: '👑' };
  for (const [day, emoji] of Object.entries(milestones)) {
    const d = parseInt(day);
    if (streak >= d && !appData.milestones[day]) {
      showMilestone(d, emoji);
      appData.milestones[day] = true;
      saveData(appData);
      return;
    }
  }
}

function showMilestone(day, emoji) {
  const overlay = document.getElementById('milestoneOverlay');
  document.getElementById('milestoneEmoji').textContent = emoji;
  const titles = {
    7: '连续 7 天！',
    21: '连续 21 天！',
    30: '连续 30 天！'
  };
  const msgs = {
    7: '一周了！你知道吗，能坚持一周的人不到一半 📊\n你已经超过大多数人了，继续保持！',
    21: '21天！据说21天能养成一个习惯 🎉\n你已经把学英语变成了生活的一部分！',
    30: '30天！整整一个月的坚持 🏆\n你已经完全不同了，小E为你骄傲！'
  };
  document.getElementById('milestoneTitle').textContent = titles[day];
  document.getElementById('milestoneMsg').textContent = msgs[day];
  overlay.style.display = 'flex';
  spawnConfetti();
}

function dismissMilestone() {
  document.getElementById('milestoneOverlay').style.display = 'none';
}

/* ===================================================================
   Confetti
   =================================================================== */
function spawnConfetti() {
  const colors = ['#6366F1','#818CF8','#F59E0B','#10B981','#EF4444','#EC4899','#8B5CF6'];
  for (let i = 0; i < 50; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = Math.random()*100+'%';
      p.style.top = (50+Math.random()*40)+'%';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDuration = (0.8+Math.random()*1.6)+'s';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 2500);
    }, i*15);
  }
}

/* ===================================================================
   Init
   =================================================================== */
function init() {
  document.getElementById('headerTime').textContent =
    `${new Date().getMonth()+1}月${new Date().getDate()}日 · ${['日','一','二','三','四','五','六'][new Date().getDay()]}`;
  document.getElementById('timeGreeting').textContent = getTimeGreeting();

  prepareDailyWords();
  renderHome();

  // Check milestone
  if (appData.streak > 0 && !appData.studyDays[TODAY]) {
    setTimeout(checkMilestone, 800);
  }
}

init();
