<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>每日英语 - 养成学习习惯</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #007AFF;
  --green: #34C759;
  --orange: #FF9500;
  --red: #FF3B30;
  --pink: #FF2D55;
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --text: #1C1C1E;
  --text2: #3C3C43;
  --text3: #8E8E93;
  --sep: #E5E5EA;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ===== App Shell ===== */
.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--bg);
}

/* ===== Header ===== */
.header {
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(242,242,247,0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-logo {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text);
}

.header-logo span { color: var(--blue); }

.header-date {
  font-size: 13px;
  color: var(--text3);
  font-weight: 500;
}

/* ===== Pages ===== */
.page {
  flex: 1;
  display: none;
  flex-direction: column;
  padding: 8px 20px 20px;
}

.page.active { display: flex; }

/* ===== Home Page ===== */
.streak-ring-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 0 20px;
}

.streak-ring {
  position: relative;
  width: 180px;
  height: 180px;
}

.streak-ring svg {
  transform: rotate(-90deg);
  width: 180px;
  height: 180px;
}

.streak-ring .bg-circle {
  fill: none;
  stroke: #E8E8ED;
  stroke-width: 10;
}

.streak-ring .fg-circle {
  fill: none;
  stroke: var(--blue);
  stroke-width: 10;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

.streak-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.streak-num {
  font-size: 48px;
  font-weight: 700;
  letter-spacing: -2px;
  line-height: 1;
  color: var(--text);
}

.streak-label {
  font-size: 13px;
  color: var(--text3);
  margin-top: 4px;
  font-weight: 500;
}

/* Today's Words Preview */
.section-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.2px;
  margin-bottom: 12px;
  color: var(--text);
}

.words-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.word-chip {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  box-shadow: var(--shadow);
  transition: transform 0.15s;
}

.word-chip:active { transform: scale(0.96); }

.info-row {
  display: flex;
  gap: 12px;
  margin-bottom: 28px;
}

.info-card {
  flex: 1;
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 10px;
}

.info-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.info-icon.time { background: #E8F2FF; }
.info-icon.count { background: #E8F8ED; }

.info-val {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.info-sub {
  font-size: 11px;
  color: var(--text3);
  font-weight: 500;
}

/* ===== Buttons ===== */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  padding: 16px 24px;
  transition: all 0.15s;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--blue);
  color: #fff;
  width: 100%;
  box-shadow: 0 4px 14px rgba(0,122,255,0.3);
}

.btn-secondary {
  background: var(--card);
  color: var(--blue);
  width: 100%;
  box-shadow: var(--shadow);
}

.btn-large {
  height: 56px;
  font-size: 18px;
  letter-spacing: -0.2px;
}

/* ===== Learning Page ===== */
.progress-bar-wrap {
  margin-bottom: 24px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--text3);
  font-weight: 500;
}

.progress-bar {
  height: 6px;
  background: #E8E8ED;
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 3px;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.word-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 40px 24px;
  margin-bottom: 24px;
  text-align: center;
  min-height: 260px;
  transition: transform 0.3s, opacity 0.3s;
}

.word-card.swipe-out {
  transform: translateX(-30px);
  opacity: 0;
}

.word-en {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 12px;
  color: var(--text);
}

.word-phonetic {
  font-size: 15px;
  color: var(--text3);
  margin-bottom: 16px;
}

.word-cn {
  font-size: 20px;
  color: var(--text2);
  font-weight: 500;
  line-height: 1.5;
}

.word-example {
  margin-top: 20px;
  font-size: 14px;
  color: var(--text3);
  font-style: italic;
  line-height: 1.6;
}

.learn-actions {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

.btn-learn {
  flex: 1;
  height: 52px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
}

.btn-know {
  background: var(--green);
  color: #fff;
  box-shadow: 0 4px 12px rgba(52,199,89,0.3);
}

.btn-unknown {
  background: var(--card);
  color: var(--orange);
  border: 2px solid #FFE5CC;
}

/* ===== Complete Page ===== */
.complete-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px 0;
}

.complete-icon {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--green), #30D158);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  margin-bottom: 24px;
  box-shadow: 0 8px 24px rgba(52,199,89,0.35);
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  80% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}

.complete-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 8px;
}

.complete-streak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #FFF3E0;
  color: var(--orange);
  font-size: 15px;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 20px;
  margin-bottom: 8px;
}

.complete-msg {
  font-size: 15px;
  color: var(--text2);
  margin-bottom: 32px;
  line-height: 1.6;
}

/* ===== Profile Page ===== */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 18px;
  box-shadow: var(--shadow);
  text-align: center;
}

.stat-card.full { grid-column: 1 / -1; }

.stat-num {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -1px;
  color: var(--text);
}

.stat-label {
  font-size: 13px;
  color: var(--text3);
  margin-top: 4px;
  font-weight: 500;
}

/* Calendar Heatmap */
.cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.cal-title {
  font-size: 17px;
  font-weight: 600;
}

.cal-nav {
  display: flex;
  gap: 4px;
}

.cal-nav-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: none;
  background: var(--card);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow);
}

.cal-nav-btn:active { background: #E8E8ED; }

.heatmap {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}

.heatmap-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 4px;
  text-align: center;
  font-size: 11px;
  color: var(--text3);
}

.heatmap-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.heatmap-cell {
  aspect-ratio: 1;
  border-radius: 4px;
  background: #F2F2F7;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  transition: transform 0.15s;
}

.heatmap-cell.done {
  background: var(--green);
  color: #fff;
  font-weight: 600;
}

.heatmap-cell.today {
  box-shadow: 0 0 0 2px var(--blue);
}

.heatmap-cell.empty { background: transparent; }

/* ===== Bottom Nav ===== */
.nav {
  display: flex;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--sep);
  padding: 6px 20px;
  padding-bottom: max(6px, env(safe-area-inset-bottom));
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 0;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--text3);
  font-family: inherit;
  font-size: 10px;
  font-weight: 500;
  transition: color 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.nav-item.active { color: var(--blue); }

.nav-icon {
  font-size: 22px;
  line-height: 1;
}

/* ===== Animations ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-up {
  animation: fadeUp 0.4s ease-out;
}

@keyframes confetti {
  0% { transform: translateY(0) rotate(0); opacity: 1; }
  100% { transform: translateY(-200px) rotate(720deg); opacity: 0; }
}

.confetti-piece {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  animation: confetti 1.2s ease-out forwards;
  pointer-events: none;
  z-index: 999;
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: #fff;
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.toast.show { opacity: 1; }

/* ===== Responsive ===== */
@media (min-width: 480px) {
  .app { border-left: 1px solid var(--sep); border-right: 1px solid var(--sep); }
}

@media (max-width: 360px) {
  .streak-ring { width: 150px; height: 150px; }
  .streak-ring svg { width: 150px; height: 150px; }
  .streak-num { font-size: 40px; }
  .word-en { font-size: 28px; }
  .word-cn { font-size: 17px; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-logo">每日<span>英语</span></div>
    <div class="header-date" id="headerDate"></div>
  </header>

  <!-- ===== Home Page ===== -->
  <main class="page active" id="page-home">
    <div class="streak-ring-wrap">
      <div class="streak-ring">
        <svg viewBox="0 0 180 180">
          <circle class="bg-circle" cx="90" cy="90" r="80"/>
          <circle class="fg-circle" id="streakCircle" cx="90" cy="90" r="80"
                  stroke-dasharray="502.65" stroke-dashoffset="502.65"/>
        </svg>
        <div class="streak-center">
          <div class="streak-num" id="streakNum">0</div>
          <div class="streak-label">连续天数</div>
        </div>
      </div>
    </div>

    <div class="section-title">📖 今日任务</div>
    <div class="words-preview" id="wordsPreview"></div>

    <div class="info-row">
      <div class="info-card">
        <div class="info-icon time">⏱</div>
        <div>
          <div class="info-val">~3 min</div>
          <div class="info-sub">预计学习时间</div>
        </div>
      </div>
      <div class="info-card">
        <div class="info-icon count">📚</div>
        <div>
          <div class="info-val" id="totalWordsCount">0</div>
          <div class="info-sub">累计单词数</div>
        </div>
      </div>
    </div>

    <button class="btn btn-primary btn-large" onclick="startLearning()">
      开始学习 →
    </button>

    <div style="margin-top:12px">
      <button class="btn btn-secondary" onclick="switchPage('profile')">
        📊 查看学习记录
      </button>
    </div>
  </main>

  <!-- ===== Learning Page ===== -->
  <main class="page" id="page-learn">
    <div class="progress-bar-wrap">
      <div class="progress-info">
        <span>学习进度</span>
        <span id="progressText">1 / 5</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="word-card fade-up" id="wordCard">
      <div class="word-en" id="wordEn"></div>
      <div class="word-phonetic" id="wordPhonetic"></div>
      <div class="word-cn" id="wordCn"></div>
      <div class="word-example" id="wordExample"></div>
    </div>

    <div class="learn-actions">
      <button class="btn btn-learn btn-unknown" onclick="markWord('unknown')">
        🤔 不认识
      </button>
      <button class="btn btn-learn btn-know" onclick="markWord('know')">
        ✅ 认识
      </button>
    </div>
  </main>

  <!-- ===== Complete Page ===== -->
  <main class="page" id="page-complete">
    <div class="complete-content">
      <div class="complete-icon">🎉</div>
      <div class="complete-title">今日学习完成！</div>
      <div class="complete-streak" id="completeStreak">
        🔥 连续 <span id="completeStreakNum">0</span> 天
      </div>
      <div class="complete-msg" id="completeMsg"></div>

      <button class="btn btn-primary btn-large" onclick="goHome()" style="width:100%">
        🏠 返回首页
      </button>
      <button class="btn btn-secondary" onclick="switchPage('profile')" style="margin-top:12px;width:100%">
        📊 查看学习记录
      </button>
    </div>
  </main>

  <!-- ===== Profile Page ===== -->
  <main class="page" id="page-profile">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="profileTotalDays">0</div>
        <div class="stat-label">累计学习天数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="profileTotalWords">0</div>
        <div class="stat-label">累计学习单词</div>
      </div>
      <div class="stat-card full">
        <div class="stat-num">🔥 <span id="profileStreak">0</span></div>
        <div class="stat-label">连续学习天数</div>
      </div>
    </div>

    <div class="cal-header">
      <span class="cal-title">📅 学习日历</span>
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">◀</button>
        <button class="cal-nav-btn" onclick="changeMonth(1)">▶</button>
      </div>
    </div>
    <div class="heatmap">
      <div style="font-size:14px;font-weight:600;margin-bottom:8px;text-align:center" id="calMonthLabel"></div>
      <div class="heatmap-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="heatmap-grid" id="heatmapGrid"></div>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="nav">
    <button class="nav-item active" data-page="home" onclick="switchPage('home')">
      <span class="nav-icon">🏠</span>
      <span>首页</span>
    </button>
    <button class="nav-item" data-page="profile" onclick="switchPage('profile')">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </button>
  </nav>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ===== 数据层 ===== */

// 单词库（四级高频词）
const WORD_POOL = [
  { en: 'abandon', phonetic: '/əˈbændən/', cn: 'v. 放弃；抛弃', example: 'He decided to abandon his plan.' },
  { en: 'challenge', phonetic: '/ˈtʃælɪndʒ/', cn: 'n./v. 挑战', example: 'This is a real challenge for me.' },
  { en: 'determine', phonetic: '/dɪˈtɜːrmɪn/', cn: 'v. 决定；确定', example: 'We need to determine the cause.' },
  { en: 'essential', phonetic: '/ɪˈsenʃl/', cn: 'adj. 必要的；本质的', example: 'Water is essential for life.' },
  { en: 'frequent', phonetic: '/ˈfriːkwənt/', cn: 'adj. 频繁的', example: 'She makes frequent trips abroad.' },
  { en: 'genuine', phonetic: '/ˈdʒenjuɪn/', cn: 'adj. 真正的；真诚的', example: 'He showed genuine interest.' },
  { en: 'hesitate', phonetic: '/ˈhezɪteɪt/', cn: 'v. 犹豫；迟疑', example: 'Don\'t hesitate to ask for help.' },
  { en: 'illustrate', phonetic: '/ˈɪləstreɪt/', cn: 'v. 说明；举例', example: 'Let me illustrate my point.' },
  { en: 'journey', phonetic: '/ˈdʒɜːrni/', cn: 'n. 旅程；行程', example: 'The journey took three hours.' },
  { en: 'knowledge', phonetic: '/ˈnɒlɪdʒ/', cn: 'n. 知识；学问', example: 'Knowledge is power.' },
  { en: 'landscape', phonetic: '/ˈlændskeɪp/', cn: 'n. 风景；景观', example: 'The landscape is beautiful.' },
  { en: 'maintain', phonetic: '/meɪnˈteɪn/', cn: 'v. 维持；保持', example: 'Maintain a healthy lifestyle.' },
  { en: 'negotiate', phonetic: '/nɪˈɡoʊʃieɪt/', cn: 'v. 谈判；协商', example: 'They need to negotiate a deal.' },
  { en: 'obvious', phonetic: '/ˈɒbviəs/', cn: 'adj. 明显的', example: 'The answer is obvious.' },
  { en: 'perspective', phonetic: '/pərˈspektɪv/', cn: 'n. 观点；视角', example: 'Try to see it from my perspective.' },
  { en: 'quality', phonetic: '/ˈkwɒləti/', cn: 'n. 质量；品质', example: 'We value quality over quantity.' },
  { en: 'recognize', phonetic: '/ˈrekəɡnaɪz/', cn: 'v. 认出；识别', example: 'I didn\'t recognize her at first.' },
  { en: 'schedule', phonetic: '/ˈʃedjuːl/', cn: 'n./v. 日程；安排', example: 'Check your schedule for tomorrow.' },
  { en: 'tradition', phonetic: '/trəˈdɪʃn/', cn: 'n. 传统', example: 'It\'s a family tradition.' },
  { en: 'ultimate', phonetic: '/ˈʌltɪmət/', cn: 'adj. 最终的；根本的', example: 'The ultimate goal is happiness.' },
  { en: 'valuable', phonetic: '/ˈvæljuəbl/', cn: 'adj. 有价值的；宝贵的', example: 'Time is a valuable resource.' },
  { en: 'witness', phonetic: '/ˈwɪtnəs/', cn: 'n./v. 证人；目击', example: 'No one witnessed the accident.' },
  { en: 'academic', phonetic: '/ˌækəˈdemɪk/', cn: 'adj. 学术的', example: 'She has strong academic records.' },
  { en: 'benefit', phonetic: '/ˈbenɪfɪt/', cn: 'n./v. 益处；受益', example: 'Exercise has many benefits.' },
  { en: 'concentrate', phonetic: '/ˈkɒnsntreɪt/', cn: 'v. 集中；专注', example: 'I can\'t concentrate with noise.' },
  { en: 'demonstrate', phonetic: '/ˈdemənstreɪt/', cn: 'v. 展示；证明', example: 'He demonstrated how it works.' },
  { en: 'environment', phonetic: '/ɪnˈvaɪrənmənt/', cn: 'n. 环境', example: 'Protect the environment.' },
  { en: 'flexible', phonetic: '/ˈfleksəbl/', cn: 'adj. 灵活的', example: 'We offer flexible working hours.' },
  { en: 'guarantee', phonetic: '/ˌɡærənˈtiː/', cn: 'v./n. 保证；担保', example: 'I can guarantee its quality.' },
  { en: 'independent', phonetic: '/ˌɪndɪˈpendənt/', cn: 'adj. 独立的', example: 'She is very independent.' },
];

// 鼓励文案
const ENCOURAGE_MSGS = [
  '每一天的坚持，都在让你变得更好 ✨',
  '不积跬步，无以至千里 📚',
  '今天比昨天又多学了一点点 💪',
  '坚持就是胜利，你做到了！🌟',
  '学习英语，贵在坚持！继续加油 🔥',
  '恭喜你又完成了一天的学习！🎯',
  '每天进步一点点，四级不在话下 📈',
  '好习惯是成功的开始 🌱',
];

/* ===== 状态管理 ===== */
const TODAY = new Date().toISOString().split('T')[0];
const STORAGE_KEY = 'english_habit_data';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }
  return {
    studyDays: {},     // { '2026-06-10': { wordsCount: 5, known: 3, unknown: 2 } }
    totalWords: 0,
    streak: 0,
    lastStudyDate: null,
  };
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let appData = loadData();

// 计算连续天数
function calcStreak(data) {
  if (!data.lastStudyDate) return 0;
  const last = new Date(data.lastStudyDate);
  const today = new Date(TODAY);
  const diff = Math.floor((today - last) / (1000 * 60 * 60 * 24));
  if (diff <= 1) return data.streak;
  return 0; // 中断了
}

// 刷新 streak（在加载后调用）
appData.streak = calcStreak(appData);

/* ===== 每日单词选取 ===== */
// 基于日期种子选取5个单词，确保每天固定但不同
function getDailyWords() {
  const seed = hashCode(TODAY);
  const indices = [];
  const poolLen = WORD_POOL.length;
  // 用种子生成5个不重复的索引
  let s = seed;
  const used = new Set();
  while (indices.length < 5 && indices.length < poolLen) {
    s = ((s * 1103515245 + 12345) >>> 0) % poolLen;
    if (!used.has(s)) {
      used.add(s);
      indices.push(s);
    }
  }
  // 如果不够5个（理论不会），补上
  for (let i = 0; i < poolLen && indices.length < 5; i++) {
    if (!used.has(i)) {
      indices.push(i);
      used.add(i);
    }
  }
  return indices.map(i => WORD_POOL[i]);
}

function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
  }
  return Math.abs(hash);
}

const dailyWords = getDailyWords();

/* ===== 当前学习状态 ===== */
let currentWordIndex = 0;
let knownCount = 0;
let unknownCount = 0;
let selectedMonth = new Date().getMonth();
let selectedYear = new Date().getFullYear();

/* ===== 页面切换 ===== */
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + name);
  if (target) target.classList.add('active');

  // 更新导航状态
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.page === name);
  });

  if (name === 'home') renderHome();
  if (name === 'profile') renderProfile();
}

function goHome() {
  switchPage('home');
}

/* ===== 首页渲染 ===== */
function renderHome() {
  // 日期
  const now = new Date();
  const weekDays = ['日','一','二','三','四','五','六'];
  document.getElementById('headerDate').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weekDays[now.getDay()]}`;

  // 连续天数圆环
  const streak = appData.streak;
  document.getElementById('streakNum').textContent = streak;
  const circle = document.getElementById('streakCircle');
  const circumference = 502.65; // 2*π*80
  // 以7天为目标，7天满环
  const progress = Math.min(streak / 7, 1);
  const offset = circumference * (1 - progress);
  circle.style.strokeDashoffset = offset;

  // 单词预览
  const preview = document.getElementById('wordsPreview');
  preview.innerHTML = dailyWords.map(w =>
    `<div class="word-chip">${w.en}</div>`
  ).join('');

  // 累计单词
  document.getElementById('totalWordsCount').textContent = appData.totalWords;
}

/* ===== 学习页面 ===== */
function startLearning() {
  currentWordIndex = 0;
  knownCount = 0;
  unknownCount = 0;
  switchPage('learn');
  showWord(0);
}

function showWord(index) {
  if (index >= dailyWords.length) {
    finishLearning();
    return;
  }
  const w = dailyWords[index];
  const card = document.getElementById('wordCard');
  card.classList.remove('swipe-out');
  // 强制回流后重新添加动画
  void card.offsetWidth;
  card.classList.add('fade-up');

  document.getElementById('wordEn').textContent = w.en;
  document.getElementById('wordPhonetic').textContent = w.phonetic;
  document.getElementById('wordCn').textContent = w.cn;
  document.getElementById('wordExample').textContent = `"${w.example}"`;

  document.getElementById('progressText').textContent = `${index + 1} / ${dailyWords.length}`;
  document.getElementById('progressFill').style.width = `${((index) / dailyWords.length) * 100}%`;
}

function markWord(type) {
  if (type === 'know') knownCount++;
  else unknownCount++;

  const card = document.getElementById('wordCard');
  card.classList.add('swipe-out');

  currentWordIndex++;
  document.getElementById('progressFill').style.width = `${(currentWordIndex / dailyWords.length) * 100}%`;
  document.getElementById('progressText').textContent = `${currentWordIndex} / ${dailyWords.length}`;

  setTimeout(() => showWord(currentWordIndex), 250);
}

/* ===== 完成页面 ===== */
function finishLearning() {
  // 更新数据
  if (!appData.studyDays[TODAY]) {
    appData.studyDays[TODAY] = { wordsCount: dailyWords.length, known: knownCount, unknown: unknownCount };
    appData.totalWords += dailyWords.length;
  } else {
    // 今天已经学过了，不重复计算
    appData.studyDays[TODAY] = { wordsCount: dailyWords.length, known: knownCount, unknown: unknownCount };
  }

  // 更新连续天数
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = yesterday.toISOString().split('T')[0];

  if (appData.lastStudyDate === yesterdayStr || appData.lastStudyDate === TODAY) {
    // 连续
    if (appData.lastStudyDate !== TODAY) {
      appData.streak++;
    }
  } else if (appData.lastStudyDate !== TODAY) {
    appData.streak = 1;
  }

  appData.lastStudyDate = TODAY;
  saveData(appData);

  // 渲染完成页
  document.getElementById('completeStreakNum').textContent = appData.streak;
  document.getElementById('completeMsg').textContent =
    ENCOURAGE_MSGS[Math.floor(Math.random() * ENCOURAGE_MSGS.length)];

  switchPage('complete');
  spawnConfetti();
}

/* ===== 个人中心 ===== */
function renderProfile() {
  document.getElementById('headerDate').textContent = '学习记录';
  document.getElementById('profileTotalDays').textContent = Object.keys(appData.studyDays).length;
  document.getElementById('profileTotalWords').textContent = appData.totalWords;
  document.getElementById('profileStreak').textContent = appData.streak;
  renderCalendar();
}

function renderCalendar() {
  const year = selectedYear;
  const month = selectedMonth;
  document.getElementById('calMonthLabel').textContent = `${year}年${month + 1}月`;

  const grid = document.getElementById('heatmapGrid');
  grid.innerHTML = '';

  // 该月第一天
  const firstDay = new Date(year, month, 1);
  // 周一是0，周日是6
  let startDow = firstDay.getDay(); // 0=Sun
  startDow = startDow === 0 ? 6 : startDow - 1; // 转为 0=Mon

  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // 填充前面的空白
  for (let i = 0; i < startDow; i++) {
    const cell = document.createElement('div');
    cell.className = 'heatmap-cell empty';
    grid.appendChild(cell);
  }

  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell = document.createElement('div');
    cell.className = 'heatmap-cell';
    cell.textContent = d;

    if (appData.studyDays[dateStr]) {
      cell.classList.add('done');
    }
    if (dateStr === todayStr) {
      cell.classList.add('today');
    }
    grid.appendChild(cell);
  }
}

function changeMonth(delta) {
  selectedMonth += delta;
  if (selectedMonth < 0) { selectedMonth = 11; selectedYear--; }
  if (selectedMonth > 11) { selectedMonth = 0; selectedYear++; }
  renderCalendar();
}

/* ===== 彩带动画 ===== */
function spawnConfetti() {
  const colors = ['#FF3B30','#FF9500','#FFCC00','#34C759','#007AFF','#5856D6','#AF52DE'];
  for (let i = 0; i < 50; i++) {
    setTimeout(() => {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.top = (60 + Math.random() * 30) + '%';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (0.8 + Math.random() * 1.6) + 's';
      piece.style.animationDelay = '0s';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2000);
    }, i * 25);
  }
}

/* ===== Toast ===== */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ===== 初始化 ===== */
function init() {
  renderHome();

  // 检查今天是否已完成
  if (appData.studyDays[TODAY]) {
    // 今天已经学过了，更新完成页信息
    document.getElementById('completeStreakNum').textContent = appData.streak;
    document.getElementById('completeMsg').textContent =
      '今天已经完成学习啦！明天再来吧 🌟';
  }
}

init();
</script>
