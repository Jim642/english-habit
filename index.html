<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小E — AI英语学习搭子</title>
<style>
/* ===================================================================
   Design Tokens
   =================================================================== */
:root {
  --primary: #6366F1;
  --primary-light: #818CF8;
  --primary-bg: #EEF2FF;
  --bg: #F5F3FA;
  --card: #FFFFFF;
  --text: #1E1B4B;
  --text2: #4B5563;
  --text3: #9CA3AF;
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --sep: #E8E5F0;
  --radius: 20px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --shadow: 0 2px 16px rgba(99,102,241,0.08);
  --shadow-lg: 0 8px 32px rgba(99,102,241,0.12);
}

/* ===================================================================
   Reset & Base
   =================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(180deg, #EDE9FE 0%, var(--bg) 30%, #FFF 100%);
  color: var(--text);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ===================================================================
   Header
   =================================================================== */
.header {
  padding: 16px 20px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(237,233,254,0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.header-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-title .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--primary);
}

.header-time {
  font-size: 12px;
  color: var(--text3);
  font-weight: 500;
}

/* ===================================================================
   Pages
   =================================================================== */
.page {
  flex: 1;
  display: none;
  flex-direction: column;
  padding: 8px 20px 100px;
  overflow-y: auto;
}
.page.active { display: flex; }

/* ===================================================================
   Bottom Navigation
   =================================================================== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--sep);
  display: flex;
  padding: 8px 20px max(8px, env(safe-area-inset-bottom));
  z-index: 200;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 0;
  border: none;
  background: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 10px;
  font-weight: 600;
  color: var(--text3);
  transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.nav-item.active { color: var(--primary); }
.nav-item .nav-icon { font-size: 22px; line-height: 1; }

/* ===================================================================
   Home Page
   =================================================================== */

.time-greeting {
  text-align: center;
  padding: 4px 0 2px;
  font-size: 13px;
  color: var(--text3);
  font-weight: 500;
}

/* Companion card */
.companion-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px 24px 24px;
  text-align: center;
  margin: 10px 0 16px;
  animation: cardIn 0.5s ease-out;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.companion-avatar {
  font-size: 60px;
  line-height: 1;
  margin-bottom: 10px;
  display: block;
  animation: float 2.5s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.companion-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 6px;
}

.companion-greeting {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 14px;
}

/* Stats row */
.stats-row {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 4px;
}

.stat-item { text-align: center; }

.stat-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.3px;
}

.stat-label {
  font-size: 11px;
  color: var(--text3);
  font-weight: 500;
  margin-top: 1px;
}

/* Action buttons */
.home-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 14px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  padding: 15px 24px;
  font-family: inherit;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  width: 100%;
}

.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 16px rgba(99,102,241,0.35);
}

.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1.5px solid var(--sep);
}

.btn-chat {
  background: var(--card);
  color: var(--primary);
  border: 1.5px solid var(--primary-bg);
}

.btn-review-badge {
  display: inline-block;
  background: #FEF3C7;
  color: #D97706;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 8px;
  margin-left: 4px;
}

/* Yesterday review */
.yesterday-section {
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: 14px 18px;
  margin-bottom: 12px;
}

.yesterday-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text3);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.yesterday-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 8px;
}

.chip-known { background: #D1FAE5; color: #065F46; }
.chip-unknown { background: #FEE2E2; color: #991B1B; }

.completed-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #D1FAE5;
  color: #065F46;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
  margin-top: 4px;
}

/* ===================================================================
   Learning Page
   =================================================================== */
.learn-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.btn-back {
  background: none;
  border: 1.5px solid var(--sep);
  border-radius: var(--radius-xs);
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  color: var(--text2);
  -webkit-tap-highlight-color: transparent;
}

.btn-back:active { background: #F3F4F6; }

.progress-wrap { flex: 1; }

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 6px;
}

.progress-bar {
  height: 5px;
  background: #E8E5F0;
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width 0.3s ease;
}

/* 小E intro */
.ee-intro {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
}

.ee-intro-avatar {
  font-size: 26px;
  line-height: 1;
  flex-shrink: 0;
  opacity: 0;
  transform: translateY(6px);
  transition: all 0.3s ease;
}
.ee-intro-avatar.show { opacity: 1; transform: translateY(0); }

.ee-intro-bubble {
  background: #FFF9EB;
  border: 1px solid #FDE68A;
  border-radius: 12px;
  border-top-left-radius: 4px;
  padding: 10px 14px;
  font-size: 13px;
  color: #92400E;
  line-height: 1.5;
  opacity: 0;
  transform: translateY(6px);
  transition: all 0.3s ease;
}
.ee-intro-bubble.show { opacity: 1; transform: translateY(0); }

/* Word card */
.word-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 36px 28px;
  text-align: center;
  margin-bottom: 16px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.word-card.swipe-out {
  transform: translateY(-10px);
  opacity: 0;
}

.word-card.fade-up {
  animation: fadeUp 0.35s ease-out;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.word-card .review-tag {
  font-size: 11px;
  font-weight: 600;
  color: #DC2626;
  background: #FEE2E2;
  padding: 3px 10px;
  border-radius: 8px;
  margin-bottom: 12px;
}

.word-en {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
  margin-bottom: 8px;
}

.word-phonetic {
  font-size: 14px;
  color: var(--text3);
  margin-bottom: 12px;
}

.word-cn {
  font-size: 18px;
  color: var(--text2);
  font-weight: 500;
  line-height: 1.5;
}

/* 小E reaction */
.ee-reaction {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 20px;
  min-height: 44px;
}

.ee-reaction-avatar {
  font-size: 28px;
  line-height: 1;
  flex-shrink: 0;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.25s ease;
}
.ee-reaction-avatar.show { opacity: 1; transform: translateY(0); }

.ee-reaction-bubble {
  background: var(--card);
  border-radius: 14px;
  border-top-left-radius: 4px;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--text2);
  line-height: 1.5;
  box-shadow: var(--shadow);
  max-width: 85%;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.25s ease;
  white-space: pre-line;
}
.ee-reaction-bubble.show { opacity: 1; transform: translateY(0); }

/* Action buttons */
.learn-actions {
  display: flex;
  gap: 12px;
}

.btn-learn {
  flex: 1;
  height: 52px;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 600;
  border: 2px solid transparent;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
  -webkit-tap-highlight-color: transparent;
}

.btn-learn:active { transform: scale(0.95); }
.btn-learn:disabled { opacity: 0.5; pointer-events: none; }

.btn-unknown {
  background: var(--card);
  color: #DC2626;
  border-color: #FEE2E2;
}

.btn-know {
  background: var(--card);
  color: #059669;
  border-color: #D1FAE5;
}

/* ===================================================================
   Complete Page
   =================================================================== */
.complete-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px 0;
}

.complete-avatar {
  font-size: 68px;
  line-height: 1;
  margin-bottom: 16px;
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}

.complete-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 6px;
}

.complete-detail {
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 16px;
  line-height: 1.5;
  transition: all 0.4s ease;
}

.complete-streak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #EDE9FE;
  color: var(--primary);
  font-size: 15px;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: 20px;
  margin-bottom: 14px;
}

/* Harvest */
.harvest-section {
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: 14px 18px;
  margin-bottom: 12px;
  width: 100%;
  text-align: left;
}

.harvest-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text3);
  margin-bottom: 8px;
}

.harvest-chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Preview */
.preview-section {
  background: #FFF9EB;
  border-radius: var(--radius-sm);
  border: 1px solid #FDE68A;
  padding: 14px 18px;
  margin-bottom: 12px;
  width: 100%;
  text-align: left;
}

.preview-title {
  font-size: 12px;
  font-weight: 600;
  color: #92400E;
  margin-bottom: 8px;
}

.preview-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.preview-chip {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 8px;
  background: #FFF;
  color: #92400E;
  border: 1px solid #FDE68A;
}

.complete-farewell {
  font-size: 15px;
  color: var(--text2);
  font-weight: 500;
  margin-bottom: 24px;
  line-height: 1.5;
  transition: all 0.4s ease;
}

.btn-farewell {
  background: var(--primary);
  color: #fff;
  width: 100%;
  height: 54px;
  font-size: 17px;
  letter-spacing: -0.2px;
  box-shadow: 0 4px 16px rgba(99,102,241,0.35);
}

.relearn-link {
  margin-top: 14px;
  font-size: 13px;
  color: var(--text3);
}
.relearn-link span { color: var(--primary); cursor: pointer; font-weight: 600; }

/* API-upgraded complete message */
.complete-api-upgrade {
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.5s ease;
}
.complete-api-upgrade.show {
  opacity: 1;
  transform: translateY(0);
}

/* ===================================================================
   Chat Page
   =================================================================== */
.chat-header-bar {
  text-align: center;
  padding: 8px 0 16px;
  border-bottom: 1px solid var(--sep);
  margin-bottom: 8px;
}

.chat-header-bar .chat-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.chat-header-bar .chat-sub {
  font-size: 12px;
  color: var(--text3);
  margin-top: 2px;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.chat-msg {
  display: flex;
  gap: 8px;
  max-width: 85%;
  animation: msgIn 0.3s ease-out;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.chat-msg.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.chat-msg .msg-avatar {
  font-size: 24px;
  line-height: 1;
  flex-shrink: 0;
}

.chat-msg .msg-bubble {
  background: var(--card);
  border-radius: 14px;
  padding: 10px 16px;
  font-size: 14px;
  line-height: 1.5;
  box-shadow: var(--shadow);
  color: var(--text2);
}

.chat-msg.ee .msg-bubble {
  border-top-left-radius: 4px;
  background: #FFF9EB;
  border: 1px solid #FDE68A;
}

.chat-msg.user .msg-bubble {
  border-top-right-radius: 4px;
  background: var(--primary);
  color: #fff;
}

.chat-input-area {
  display: flex;
  gap: 8px;
  padding: 12px 0 0;
  border-top: 1px solid var(--sep);
}

.chat-input {
  flex: 1;
  border: 1.5px solid var(--sep);
  border-radius: var(--radius-xs);
  padding: 10px 14px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  background: var(--card);
}

.chat-input:focus { border-color: var(--primary-light); }

.btn-send {
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-xs);
  padding: 10px 18px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.btn-send:active { opacity: 0.8; }
.btn-send:disabled { opacity: 0.5; }

/* API key notice */
.api-key-notice {
  background: #FEF3C7;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  text-align: center;
  margin-bottom: 12px;
}

.api-key-notice p {
  font-size: 13px;
  color: #92400E;
  line-height: 1.5;
  margin-bottom: 8px;
}

.api-key-notice input {
  width: 100%;
  border: 1px solid #FDE68A;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  font-family: monospace;
  outline: none;
  background: #FFF;
  text-align: center;
}

.api-key-notice .btn-save-key {
  margin-top: 8px;
  background: #D97706;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

/* Chat context bar */
.chat-context {
  background: #EEF2FF;
  border-radius: var(--radius-xs);
  padding: 8px 14px;
  font-size: 12px;
  color: var(--primary);
  margin-bottom: 8px;
  text-align: center;
  font-weight: 500;
}

.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 12px 16px;
}

.typing-indicator span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #D1D5DB;
  animation: typing 1.4s ease-in-out infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-8px); opacity: 1; }
}

/* ===================================================================
   Milestone Celebration Overlay
   =================================================================== */
.milestone-overlay {
  position: fixed;
  inset: 0;
  background: rgba(30,27,75,0.7);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.milestone-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 36px 28px;
  text-align: center;
  max-width: 340px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.milestone-emoji { font-size: 72px; line-height: 1; margin-bottom: 12px; }

.milestone-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 8px;
}

.milestone-msg {
  font-size: 15px;
  color: var(--text2);
  line-height: 1.6;
  margin-bottom: 20px;
  white-space: pre-line;
}

.btn-milestone {
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 14px 32px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.btn-milestone:active { transform: scale(0.96); }

/* ===================================================================
   Confetti
   =================================================================== */
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0); opacity: 1; }
  100% { transform: translateY(-200px) rotate(720deg); opacity: 0; }
}

.confetti-piece {
  position: fixed;
  width: 10px; height: 10px;
  border-radius: 2px;
  animation: confettiFall 1.2s ease-out forwards;
  pointer-events: none;
  z-index: 400;
}

/* ===================================================================
   Responsive
   =================================================================== */
@media (min-width: 480px) {
  .app {
    border-left: 1px solid var(--sep);
    border-right: 1px solid var(--sep);
  }
}

@media (max-width: 360px) {
  .companion-avatar { font-size: 48px; }
  .companion-greeting { font-size: 14px; }
  .word-en { font-size: 28px; }
  .word-cn { font-size: 16px; }
  .complete-avatar { font-size: 52px; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-title">小E英语<span class="dot"></span></div>
    <div class="header-time" id="headerTime"></div>
  </header>

  <!-- ===== Home Page ===== -->

const Data = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return Data.defaults();
  },

  defaults() {
    return {
      studyDays: {},
      lastStudyDate: null,
      streak: 0,
      totalDays: 0,
      totalWordsLearned: 0,
      unknownWords: {},
      reviewedToday: [],
      dailyHistory: {},
      chatHistory: [],
      milestones: {},
      apiKey: '',
    };
  },

  save(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  },

  // Ensure all keys exist (migration)
  normalize(appData) {
    const defaults = Data.defaults();
    for (const k of Object.keys(defaults)) {
      if (!(k in appData)) {
        appData[k] = Array.isArray(defaults[k]) ? [] : (typeof defaults[k] === 'object' ? {} : defaults[k]);
      }
    }
    if (!appData.totalDays) appData.totalDays = Object.keys(appData.studyDays).length;
    if (!appData.totalWordsLearned) appData.totalWordsLearned = 0;
    if (!appData.apiKey) appData.apiKey = '';
    return appData;
  }
};

let appData = Data.normalize(Data.load());

/* ===================================================================
   Helpers
   =================================================================== */
function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++)
    hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
  return Math.abs(hash);
}

function yesterdayStr() {
  const d = new Date(TODAY + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().split('T')[0];
}

function absDays() {
  if (!appData.lastStudyDate) return 999;
  if (appData.lastStudyDate === TODAY) return 0;
  const a = new Date(appData.lastStudyDate + 'T00:00:00');
  const b = new Date(TODAY + 'T00:00:00');
  return Math.floor((b - a) / 86400000);
}

function calcStreak() {
  if (!appData.lastStudyDate) return 0;
  const d = absDays();
  return d <= 1 ? appData.streak : 0;
}

    { en: 'recommend', phonetic: '/ˌrekəˈmend/', cn: 'v. 推荐；建议', mnemonic: 're+commend(委托)→推荐 👍' },

  /* ---- Word State Machine ----
     States: 'unseen' → 'seen_once' → 'seen_twice' → 'familiar' → 'mastered'
     mastered = marked "认识" 3+ times consecutively
  ---- */
  function getWordState(en) {
    const history = appData.dailyHistory;
    let seenCount = 0, knownStreak = 0;
    const sortedDates = Object.keys(history).sort().reverse();
    for (const date of sortedDates) {
      const rec = history[date];
      if ((rec.known || []).includes(en)) {
        seenCount++;
        knownStreak++;
        if (knownStreak >= 3) return 'mastered';
      } else if ((rec.unknown || []).includes(en)) {
        seenCount++;
        knownStreak = 0;
        if (seenCount >= 3) return 'struggling'; // seen 3+ times, still unknown
      }
    }
    if (seenCount === 0) return 'unseen';
    if (seenCount === 1) return 'seen_once';
    if (knownStreak >= 2) return 'familiar';
    return 'seen_twice';
  }

  function timesSeen(en) {
    let count = 0;
    for (const date of Object.keys(appData.dailyHistory)) {
      const rec = appData.dailyHistory[date];
      if ((rec.known || []).includes(en) || (rec.unknown || []).includes(en)) count++;
    }
    return count;
  }

  /* ---- Daily Word Selection ---- */
  function selectWords() {
    const reviewWords = getReviewQueue().slice(0, 5);
    const rSet = new Set(reviewWords);
    const result = reviewWords.map(en => WORD_POOL.find(w => w.en === en) || { en, phonetic: '', cn: '' });

    if (result.length < 5) {
      const seed = hashCode(TODAY);
      const used = new Set(result.map(w => w.en));
      let s = seed;
      while (result.length < 5 && used.size < WORD_POOL.length) {
        s = ((s * 1103515245 + 12345) >>> 0) % WORD_POOL.length;
        const word = WORD_POOL[s];
        if (!used.has(word.en) && getWordState(word.en) !== 'mastered') {
          used.add(word.en);
          result.push(word);
        }
      }
      // Fallback: if we still don't have 5, add any non-mastered words
      if (result.length < 5) {
        for (const w of WORD_POOL) {
          if (result.length >= 5) break;
          if (!used.has(w.en) && getWordState(w.en) !== 'mastered') {
            used.add(w.en);
            result.push(w);
          }
        }
      }
    }
    return result;
  }

  /* ---- Review Queue ---- */
  function getReviewQueue() {
    const reviewed = new Set(appData.reviewedToday || []);
    const mastered = new Set();
    for (const date of Object.keys(appData.dailyHistory)) {
      const rec = appData.dailyHistory[date];
      for (const w of (rec.known || [])) {
        if (getWordState(w) === 'mastered') mastered.add(w);
      }
    }
    return Object.keys(appData.unknownWords || {})
      .filter(w => !reviewed.has(w) && !mastered.has(w))
      .sort((a, b) => (appData.unknownWords[a] || '').localeCompare(appData.unknownWords[b] || ''));
  }

  function isReviewWord(en) {
    return en in (appData.unknownWords || {}) &&
           !(appData.reviewedToday || []).includes(en);
  }

  /* ---- Yesterday ---- */
  function getYesterdayRecord() {
    return appData.dailyHistory[yesterdayStr()] || null;
  }

  function getYesterdayUnknowns() {
    const yRec = getYesterdayRecord();
    if (!yRec) return [];
    const reviewed = new Set(appData.reviewedToday || []);
    return (yRec.unknown || []).filter(w => !reviewed.has(w));
  }

  /* ---- Record Result ---- */
  function recordResult(en, type) {
    // Update unknownWords
    if (type === 'unknown') {
      if (!appData.unknownWords[en]) appData.unknownWords[en] = TODAY;
    } else {
      delete appData.unknownWords[en];
    }

    if (!appData.reviewedToday.includes(en)) appData.reviewedToday.push(en);

    // Update dailyHistory
    if (!appData.dailyHistory[TODAY]) appData.dailyHistory[TODAY] = { known: [], unknown: [] };
    const dh = appData.dailyHistory[TODAY];
    if (type === 'know') {
      if (!dh.known.includes(en)) dh.known.push(en);
      const i = dh.unknown.indexOf(en);
      if (i >= 0) dh.unknown.splice(i, 1);
    } else {
      if (!dh.unknown.includes(en)) dh.unknown.push(en);
      const i = dh.known.indexOf(en);
      if (i >= 0) dh.known.splice(i, 1);
    }
  }

  /* ---- Complete Session ---- */
  function completeSession(knownCount, isReviewMode) {
    if (!isReviewMode) {
      if (!appData.studyDays[TODAY]) {
        appData.studyDays[TODAY] = true;
        appData.totalDays = Object.keys(appData.studyDays).length;
      }
      appData.totalWordsLearned += knownCount;

      const ys = yesterdayStr();
      if (appData.lastStudyDate === ys || appData.lastStudyDate === TODAY) {
        if (appData.lastStudyDate !== TODAY) appData.streak++;
      } else if (appData.lastStudyDate !== TODAY) {
        appData.streak = 1;
      }
      appData.lastStudyDate = TODAY;
    }
    Data.save(appData);
  }

  /* ---- Stats ---- */
  function getStats() {
    return {
      streak: calcStreak(),
      totalDays: appData.totalDays,
      totalWordsLearned: appData.totalWordsLearned,
      studyDays: appData.studyDays,
    };
  }

  return {
    WORD_POOL,
    selectWords,
    getReviewQueue,
    isReviewWord,
    getYesterdayRecord,
    getYesterdayUnknowns,
    recordResult,
    completeSession,
    getStats,
    getWordState,
    timesSeen,
  };
})();

/* ===================================================================
   LAYER 2: AI ENGINE — Companion intelligence
   Pure functions that transform events + context → reactions.
   No DOM manipulation here.
   =================================================================== */
const AIEngine = (() => {

  /* ---- Session Memory (in-memory only, flushed each visit) ---- */
  let sessionLog = [];       // [{ time, event, payload }]
  let sessionConsecutive = { known: 0, unknown: 0 };
  let sessionMood = 'normal'; // 'confident' | 'struggling' | 'normal'

  function resetSession() {
    sessionLog = [];
    sessionConsecutive = { known: 0, unknown: 0 };
    sessionMood = 'normal';
  }

  function logEvent(event, payload) {
    sessionLog.push({ time: Date.now(), event, payload });
    if (sessionLog.length > 200) sessionLog.shift();
  }

  /* ---- Context Builder ---- */
  function buildContext(event, payload) {
    const stats = EnglishEngine.getStats();
    const yRec = EnglishEngine.getYesterdayRecord();

    return {
      // Time
      timeOfDay: (() => {
        const h = new Date().getHours();
        if (h >= 5 && h < 12) return 'morning';
        if (h >= 12 && h < 18) return 'afternoon';
        if (h >= 18 && h < 23) return 'evening';
        return 'night';
      })(),

      // Streak
      streak: stats.streak,
      streakMilestone: [7, 21, 30].includes(stats.streak) ? stats.streak : null,

      // Session
      sessionMood,
      sessionConsecutive: { ...sessionConsecutive },

      // Current word (if applicable)
      currentWord: payload.word ? {
        en: payload.word.en,
        cn: payload.word.cn,
        mnemonic: payload.word.mnemonic || '',
        timesSeen: EnglishEngine.timesSeen(payload.word.en),
        wordState: EnglishEngine.getWordState(payload.word.en),
        isReview: EnglishEngine.isReviewWord(payload.word.en),
      } : null,

      // Last action
      lastAction: payload.lastResult || null,
      lastWord: payload.lastWord || null,

      // Progress
      progress: payload.progress || null, // { current, total }

      // Yesterday
      yesterday: yRec ? {
        known: yRec.known || [],
        unknown: yRec.unknown || [],
        hasRecord: true,
      } : { known: [], unknown: [], hasRecord: false },

      // Global stats
      totalWordsLearned: stats.totalWordsLearned,
      totalDays: stats.totalDays,
      reviewQueueSize: EnglishEngine.getReviewQueue().length,

      // Random seed for variety (deterministic per day+event)
      seed: hashCode(TODAY + event + (payload.word ? payload.word.en : '')),
    };
  }

  /* ---- Decision Engine: Should the AI respond to this event? ---- */
  function decide(event, context) {
    // Events that ALWAYS get a response
    const alwaysRespond = [
      'APP_OPENED', 'LEARNING_STARTED', 'WORD_SHOWN',
      'WORD_KNOWN', 'WORD_UNKNOWN', 'LEARNING_COMPLETED',
      'CHAT_OPENED', 'CHAT_MESSAGE_SENT', 'MILESTONE_REACHED',
      'LEARNING_QUIT',
    ];
    if (alwaysRespond.includes(event)) {
      return { shouldRespond: true, level: decideLevel(event, context) };
    }

    // PATTERN_DETECTED only responds at meaningful thresholds
    if (event === 'PATTERN_DETECTED') {
      const { known, unknown } = context.sessionConsecutive;
      if (known >= 3 || unknown >= 3) {
        return { shouldRespond: true, level: 'L1' };
      }
      return { shouldRespond: false };
    }

    return { shouldRespond: false };
  }

  function decideLevel(event, context) {
    // L2 (API): high-value, low-frequency moments
    if (event === 'LEARNING_COMPLETED') return 'L2';
    if (event === 'CHAT_MESSAGE_SENT') return 'L2';
    if (event === 'MILESTONE_REACHED') return 'L2';

    // L1: context-rich reactions
    if (event === 'WORD_KNOWN' || event === 'WORD_UNKNOWN') return 'L1';
    if (event === 'APP_OPENED') return 'L1';
    if (event === 'CHAT_OPENED') return 'L1';
    if (event === 'LEARNING_QUIT') return 'L1';

    // L0: simple transitions
    return 'L0';
  }

  /* ---- L0/L1 Template System ---- */
  function generateLocal(event, context) {
    switch (event) {

      // ===== APP_OPENED =====
      case 'APP_OPENED': {
        const { streak, yesterday, timeOfDay } = context;
        const timeMap = { morning: '早安！', afternoon: '下午好～', evening: '晚上好，', night: '夜深了，' };
        const timePrefix = timeMap[timeOfDay] || '你好！';

        // Build yesterday reference
        let yRef = '';
        if (yesterday && yesterday.hasRecord) {
          const yk = yesterday.known, yu = yesterday.unknown;
          if (yk.length > 0) {
            yRef = ` 昨天你认识了 ${yk.slice(0,2).join('、')}${yk.length>2?'等':''}✨`;
            if (yu.length > 0) yRef += `，还有 ${yu.length} 个待复习`;
          } else if (yu.length > 0) {
            yRef = ` 昨天${yu.length}个词有点难，今天再试试～`;
          }
        }

        if (streak === 0) {
          return `${timePrefix}从今天起我们就是搭子了 🐣` + yRef;
        }
        if (streak === 1) {
          return `又见面了！连续来两天的人都挺厉害的 😤` + yRef;
        }
        if (streak >= 2 && streak <= 3) {
          const p = ['你来啦！今天我准备了几个好词～', '嘿嘿，我就知道你会来 🐣'];
          return p[context.seed % p.length] + yRef;
        }
        if (streak >= 4 && streak <= 6) {
          const p = [`第${streak}天了！我就知道你不是三分钟热度 😤`, `第${streak}天～你已经习惯每天见我了吧？`];
          return p[context.seed % p.length] + yRef;
        }
        if (streak === 7) return `第7天了！！🎉 一周！你知道能坚持一周的人不到一半吗？` + yRef;
        const p = [`第${streak}天了！能坚持一周的人不到一半 📊`, `连续${streak}天！你已经打败大部分同学了 📈`, `${streak}天！你也太稳了吧 🔥`];
        return p[context.seed % p.length] + yRef;
      }

      // ===== LEARNING_STARTED =====
      case 'LEARNING_STARTED': {
        const { reviewQueueSize, yesterday } = context;
        const isReview = context.currentWord && context.currentWord.isReview;
        if (isReview && reviewQueueSize > 0) {
          return `来复习昨天${reviewQueueSize}个词，看看还记得几个～`;
        }
        const p = ['准备好了吗？开始吧！🐣', '来看看今天的单词～', '开始了哦！今天状态不错的样子 ✨'];
        return p[context.seed % p.length];
      }

      // ===== WORD_SHOWN =====
      case 'WORD_SHOWN': {
        const w = context.currentWord;
        if (!w) return '来看看这个词～';

        const { progress } = context;
        const idx = progress ? progress.current - 1 : 0;
        const total = progress ? progress.total : 5;

        // Review word with history
        if (w.isReview && w.timesSeen >= 3) {
          return `"${w.en}" 第三次见了，这次一定要记住！😤`;
        }
        if (w.isReview && w.timesSeen >= 2) {
          return `"${w.en}" 上次没记住，这次再试试～`;
        }
        if (w.isReview) {
          return `这个词昨天你不认识，今天再试一次～`;
        }

        // First word
        if (idx === 0) {
          const p = ['准备好了吗？开始吧！🐣', '来看看今天第一个词～', '开始了哦！'];
          return p[context.seed % p.length];
        }

        // Last word
        if (idx === total - 1) {
          const p = ['最后一个，冲！💪', '今天的收官词～', '最后一个，坚持！'];
          return p[context.seed % p.length];
        }

        // Middle words - context-sensitive
        if (context.lastAction === 'unknown') {
          const p = ['没关系，这个词肯定更简单～', '这个词你应该认识～', '换个简单的缓一缓～'];
          return p[context.seed % p.length];
        }
        if (context.lastAction === 'know') {
          const p = [w.en + '… 状态不错！继续～', '保持这个节奏 ✨', '下一个，趁热打铁～'];
          return p[context.seed % p.length];
        }
        return '来看看下一个词～';
      }

      // ===== WORD_KNOWN =====
      case 'WORD_KNOWN': {
        const w = context.currentWord;
        if (!w) return '好的～';
        const { sessionConsecutive: sc } = context;

        // Review word now mastered
        if (w.isReview && w.timesSeen >= 2) {
          let msg = '昨天不认识今天就记住了！你怎么做到的 🎉';
          if (sc.known >= 3) msg += '\n连续' + sc.known + '个了！今天状态很好 🔥';
          return msg;
        }

        // Word that was previously struggled
        if (w.wordState === 'struggling') {
          let msg = `"${w.en}" 终于拿下了！我就知道你可以的 🎉`;
          if (sc.known >= 3) msg += '\n今天势如破竹啊 🔥';
          return msg;
        }

        // Normal
        const p = [
          '这个词你本来就会，基础不错！',
          '拿捏了 ✨',
          '稳！这个词你已经掌握了 ✅',
          '认识这个词，四六级多一分 😼',
          `"${w.en}" 没问题！👍`,
        ];
        let msg = p[context.seed % p.length];
        if (sc.known >= 3) msg += '\n连续' + sc.known + '个了！今天状态很好 🔥';
        if (sc.known === 5) msg = '全对！！你也太强了吧 🎉';
        return msg;
      }

      // ===== WORD_UNKNOWN =====
      case 'WORD_UNKNOWN': {
        const w = context.currentWord;
        if (!w) return '好的～';
        const { sessionConsecutive: sc } = context;

        // Review word still unknown
        if (w.isReview && w.timesSeen >= 3) {
          let msg = w.mnemonic
            ? `这个词确实难。试试这样记：${w.mnemonic}`
            : `"${w.en}" 第三次见了…没关系，下次一定行 🐣`;
          if (sc.unknown >= 2) msg += '\n这几个确实有点偏，不是你的问题 🐣';
          return msg;
        }

        // Normal
        let msg = w.mnemonic
          ? `好的，我记下了！💡 ${w.mnemonic}`
          : '没事，见过一次就有印象了～';
        if (sc.unknown >= 2) msg += '\n这几个确实有点偏，不是你的问题 🐣';
        return msg;
      }

      // ===== LEARNING_COMPLETED (L1 fallback) =====
      case 'LEARNING_COMPLETED': {
        const { progress, sessionConsecutive: sc, reviewQueueSize, streak } = context;
        const total = progress ? progress.total : 5;
        const known = sc.known; // This gets reset, use from payload

        // Will be filled by the caller with actual numbers
        return ''; // Handled specially in UI layer
      }

      // ===== LEARNING_QUIT =====
      case 'LEARNING_QUIT': {
        const p = [
          '好的，明天再来哦～我等你 🐣',
          '先休息吧，学习不急这一会儿 💛',
          '嗯嗯，随时回来，我一直都在～',
        ];
        return p[context.seed % p.length];
      }

      // ===== CHAT_OPENED =====
      case 'CHAT_OPENED': {
        // Build context-aware opening line
        const { streak, totalWordsLearned } = context;
        const todayDone = !!appData.studyDays[TODAY];
        const stats = EnglishEngine.getStats();
        if (todayDone) {
          const dh = appData.dailyHistory[TODAY];
          const k = (dh ? dh.known || [] : []);
          const u = (dh ? dh.unknown || [] : []);
          return `今天学了${k.length+u.length}个词，认识了${k.length}个～有什么想聊的吗？🐣`;
        }
        if (streak === 0) {
          return '嘿！我是小E，你的英语学习搭子 🐣\n准备好开始今天的单词了吗？';
        }
        return `今天是第${streak}天啦！有什么想和我聊的吗？🐣`;
      }

      // ===== MILESTONE_REACHED =====
      case 'MILESTONE_REACHED': {
        const { streak } = context;
        if (streak === 7) return { emoji: '🎉', title: '连续 7 天！', msg: '一周了！你知道吗，能坚持一周的人不到一半 📊\n你已经超过大多数人了，继续保持！' };
        if (streak === 21) return { emoji: '🏆', title: '连续 21 天！', msg: '21天！据说21天能养成一个习惯 🎉\n你已经把学英语变成了生活的一部分！' };
        if (streak === 30) return { emoji: '👑', title: '连续 30 天！', msg: '30天！整整一个月的坚持 🏆\n你已经完全不同了，小E为你骄傲！' };
        return null;
      }

      default:
        return '好的～';
    }
  }

  /* ---- Completion Message (L1) ---- */
  function generateCompletionL1(known, total, context) {
    const unknown = total - known;
    const { streak } = context;

    const titles = {
      allCorrect: ['今天的词你全会！🎉', '全对！你也太强了吧', '全会！你是不是偷偷卷了 😼'],
      mostlyGood: [`认识了 ${known} 个，新认识 ${unknown} 个 ✨`, `${known}/${total}，不错！`, '大部分都认识，状态挺好～'],
      struggling: ['今天这几个确实有点难！见过就是进步～', '没关系，这些词确实比较偏，明天会更好～'],
    };

    let title;
    if (known === total) title = titles.allCorrect[context.seed % titles.allCorrect.length];
    else if (known >= total / 2) title = titles.mostlyGood[context.seed % titles.mostlyGood.length];
    else title = titles.struggling[context.seed % titles.struggling.length];

    const streakMsg = `🔥 我们已经一起 ${streak} 天啦`;

    return { title, streakMsg };
  }

  /* ---- L2: API Generation ---- */
  const DEEPSEEK_URL = 'https://api.deepseek.com/v1/chat/completions';

  function buildDynamicSystemPrompt() {
    const stats = EnglishEngine.getStats();
    const todayDone = !!appData.studyDays[TODAY];
    const reviewQueue = EnglishEngine.getReviewQueue();
    const yRec = EnglishEngine.getYesterdayRecord();

    let contextBlock = '\n\n【用户当前状态】\n';
    contextBlock += `- 连续学习天数：${stats.streak}\n`;
    contextBlock += `- 累计学习天数：${stats.totalDays}\n`;
    contextBlock += `- 累计认识单词：${stats.totalWordsLearned}\n`;

    if (todayDone) {
      const dh = appData.dailyHistory[TODAY] || { known: [], unknown: [] };
      contextBlock += `- 今天已完成学习：认识${dh.known.length}个，不熟${dh.unknown.length}个\n`;
      contextBlock += `- 今天认识的词：${dh.known.join(', ') || '无'}\n`;
      contextBlock += `- 今天不熟的词：${dh.unknown.join(', ') || '无'}\n`;
    } else {
      contextBlock += '- 今天还没有开始学习\n';
    }

    if (reviewQueue.length > 0) {
      contextBlock += `- 待复习的词：${reviewQueue.slice(0,5).join(', ')}\n`;
    }

    if (yRec) {
      contextBlock += `- 昨天：认识${(yRec.known||[]).length}个，不熟${(yRec.unknown||[]).length}个\n`;
    }

    contextBlock += `\n请根据以上状态自然地与用户交流。如果用户还没学习，可以鼓励他开始。如果已经完成，可以聊聊今天学的词。`;

    return `你是小E，用户的英语学习搭子。

你的职责：
- 鼓励用户坚持学习英语
- 用温暖、友善的语气交流
- 回复控制在100字以内
- 像朋友一样，不要像老师
- 可以适当使用emoji
- 如果用户说不想学了，要理解和鼓励，不要批评
- 偶尔可以分享英语学习的小技巧

你的性格：
- 温暖、贴心、有点可爱
- 像一只刚破壳的小鸡 🐣
- 真心希望用户学好英语
- 你记得用户的学习状态，聊天时会自然地提到` + contextBlock;
  }

  async function generateAPI(event, payload) {
    const apiKey = appData.apiKey || '';
    if (!apiKey) return null;

    const systemPrompt = buildDynamicSystemPrompt();

    let userMessage = '';
    switch (event) {
      case 'LEARNING_COMPLETED':
        const dh = appData.dailyHistory[TODAY] || { known: [], unknown: [] };
        userMessage = `我刚学完了今天的单词。认识了${dh.known.length}个：${dh.known.join('、')}。${dh.unknown.length > 0 ? '还不熟的有：' + dh.unknown.join('、') + '。' : ''}请用小E的语气给我一个简短温暖的总结和鼓励（50字左右）。`;
        break;
      case 'CHAT_MESSAGE_SENT':
        userMessage = payload.message;
        break;
      case 'MILESTONE_REACHED':
        userMessage = `我今天连续学习达到${payload.days}天了！请用小E的语气给我一个温暖的庆祝（50字左右）。`;
        break;
      default:
        return null;
    }

    try {
      const resp = await fetch(DEEPSEEK_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: 'deepseek-chat',
          messages: [
            { role: 'system', content: systemPrompt },
            ...getChatContextForAPI().map(c => ({
              role: c.role === 'ee' ? 'assistant' : 'user',
              content: c.content
            })),
            { role: 'user', content: userMessage }
          ],
          max_tokens: 300,
          temperature: 0.8
        })
      });

      if (!resp.ok) return null;
      const data = await resp.json();
      return data.choices?.[0]?.message?.content || null;
    } catch (e) {
      console.error('AI Engine API error:', e);
      return null;
    }
  }

  function getChatContextForAPI() {
    return (appData.chatHistory || []).slice(-10);
  }

  /* ---- Update session state ---- */
  function updateSession(result) {
    if (result === 'know') {
      sessionConsecutive.known++;
      sessionConsecutive.unknown = 0;
    } else if (result === 'unknown') {
      sessionConsecutive.unknown++;
      sessionConsecutive.known = 0;
    }

    if (sessionConsecutive.known >= 4) sessionMood = 'confident';
    else if (sessionConsecutive.unknown >= 3) sessionMood = 'struggling';
    else sessionMood = 'normal';
  }

  return {
    resetSession,
    logEvent,
    buildContext,
    decide,
    generateLocal,
    generateCompletionL1,
    generateAPI,
    buildDynamicSystemPrompt,
    updateSession,
    getSessionLog: () => sessionLog,
    getSessionConsecutive: () => sessionConsecutive,
    getSessionMood: () => sessionMood,
  };
})();

/* ===================================================================
   LAYER 3: EVENT BUS — Connect user actions → AI → UI update
   =================================================================== */
const Bus = {
  async dispatch(event, payload = {}) {
    // Log to AI session
    AIEngine.logEvent(event, payload);

    // Build context
    const context = AIEngine.buildContext(event, payload);

    // Decide
    const decision = AIEngine.decide(event, context);

    if (!decision.shouldRespond) return null;

    let reaction;

    if (decision.level === 'L2') {
      // L2: Try API first, fall back to L1
      const apiResult = await AIEngine.generateAPI(event, payload);
      if (apiResult) {
        reaction = { text: apiResult, level: 'L2', fromAPI: true };
      } else {
        // Fallback to L1
        const localResult = AIEngine.generateLocal(event, context);
        reaction = { text: localResult, level: 'L1', fromAPI: false };
      }
    } else {
      // L0 or L1: local generation
      const localResult = AIEngine.generateLocal(event, context);
      reaction = { text: localResult, level: decision.level, fromAPI: false };
    }

    return reaction;
  },

  // Sync dispatch for L0/L1 (no API, immediate return)
  dispatchSync(event, payload = {}) {
    AIEngine.logEvent(event, payload);
    const context = AIEngine.buildContext(event, payload);
    const decision = AIEngine.decide(event, context);

    if (!decision.shouldRespond) return null;

    const text = AIEngine.generateLocal(event, context);
    return { text, level: decision.level, fromAPI: false };
  },
};

/* ===================================================================
   LAYER 4: UI LAYER — Thin rendering layer
   All user actions → dispatch events → render reactions
   =================================================================== */
const UI = (() => {

  async function renderHome() {

      `${new Date().getMonth()+1}月${new Date().getDate()}日 · ${['日','一','二','三','四','五','六'][new Date().getDay()]}`;

    const timeMap = { morning: '☀️ 早安', afternoon: '🌤️ 下午好', evening: '🌙 晚上好', night: '🌙 夜深了' };
    const h = new Date().getHours();
    let tod = 'morning';
    if (h >= 12 && h < 18) tod = 'afternoon';
    else if (h >= 18 && h < 23) tod = 'evening';
    else if (h >= 23 || h < 5) tod = 'night';
    document.getElementById('timeGreeting').textContent = timeMap[tod];

    // Stats
    const stats = EnglishEngine.getStats();
    document.getElementById('statStreak').textContent = stats.streak;
    document.getElementById('statTotalWords').textContent = stats.totalWordsLearned;
    document.getElementById('statTotalDays').textContent = stats.totalDays;

    // AI greeting via event bus
    const reaction = Bus.dispatchSync('APP_OPENED', {});
    document.getElementById('companionGreeting').textContent = reaction ? reaction.text : '嘿！今天来学英语吗？🐣';

    // Completed tag
    const ct = document.getElementById('completedTag');
    if (appData.studyDays[TODAY]) {
      ct.innerHTML = '<span class="completed-tag">✅ 今日已完成</span>';
    } else {
      ct.innerHTML = '';
    }

    // Start button
    const btn = document.getElementById('btnStart');
    if (appData.studyDays[TODAY]) {
      btn.textContent = '✅ 今日已完成，明天见！';
      btn.style.opacity = '0.6';
      btn.onclick = () => switchPage('complete');
    } else {
      btn.textContent = '📖 开始学习';
      btn.style.opacity = '1';
      btn.onclick = startLearning;
    }

    // Review button
    const yu = EnglishEngine.getYesterdayUnknowns();
    const btnReview = document.getElementById('btnReview');
    if (yu.length > 0 && !appData.studyDays[TODAY]) {
      btnReview.style.display = 'flex';
      document.getElementById('reviewBadgeCount').textContent = yu.length;
    } else {
      btnReview.style.display = 'none';
    }

    // Yesterday section
    const yRec = EnglishEngine.getYesterdayRecord();
    const ys = document.getElementById('yesterdaySection');
    if (yRec) {
      ys.style.display = 'block';
      let c = '';
      for (const w of (yRec.known || [])) c += `<span class="chip chip-known">✅ ${w}</span>`;
      for (const w of (yRec.unknown || [])) c += `<span class="chip chip-unknown">⚠️ ${w}</span>`;
      document.getElementById('yesterdayChips').innerHTML = c || '<span style="font-size:12px;color:var(--text3)">暂无记录</span>';
    } else {
      ys.style.display = yRec ? 'block' : 'none';
    }

    // Refresh card animation
    const card = document.getElementById('companionCard');
    card.style.animation = 'none';
    void card.offsetWidth;
    card.style.animation = 'cardIn 0.5s ease-out';
  }

  /* ---- Learning Flow ---- */
  function startLearning() {
    if (appData.studyDays[TODAY]) return;
    isReviewMode = false;
    AIEngine.resetSession();
    dailyWords = EnglishEngine.selectWords();
    currentIndex = 0;
    knownCount = 0;
    lastResult = null;

    Bus.dispatchSync('LEARNING_STARTED', { mode: 'normal' });
    switchPage('learn');
    showWord(0);
  }

  function startReview() {
    if (appData.studyDays[TODAY]) return;
    const yu = EnglishEngine.getYesterdayUnknowns();
    if (yu.length === 0) return;
    isReviewMode = true;
    AIEngine.resetSession();
    reviewWordsList = yu.map(en =>
      EnglishEngine.WORD_POOL.find(w => w.en === en) || { en, phonetic: '', cn: '' }
    );
    currentIndex = 0;
    knownCount = 0;
    lastResult = null;

    Bus.dispatchSync('LEARNING_STARTED', { mode: 'review', count: yu.length });
    switchPage('learn');
    showWord(0);
  }

  function showWord(idx) {
    const words = isReviewMode ? reviewWordsList : dailyWords;
    if (idx >= words.length) { finishLearning(); return; }

    const w = words[idx];
    const card = document.getElementById('wordCard');
    card.classList.remove('swipe-out');
    document.getElementById('wordEn').textContent = w.en;
    document.getElementById('wordPhonetic').textContent = w.phonetic || '';
    document.getElementById('wordCn').textContent = w.cn || '';

    const rt = document.getElementById('reviewTag');
    rt.style.display = EnglishEngine.isReviewWord(w.en) ? 'inline-block' : 'none';

    document.getElementById('progressText').textContent = `${idx+1} / ${words.length}`;
    document.getElementById('progressFill').style.width = `${(idx/words.length)*100}%`;
    document.getElementById('progressLabel').textContent =
      isReviewMode ? `复习 ${idx+1}/${words.length}` :
      EnglishEngine.isReviewWord(w.en) ? `复习第 ${idx+1} 个` : `第 ${idx+1} 个词`;

    // AI intro via event bus
    const reaction = Bus.dispatchSync('WORD_SHOWN', {
      word: w,
      progress: { current: idx+1, total: words.length },
      lastResult,
      lastWord: idx > 0 ? words[idx-1].en : null,
    });
    showIntro(reaction ? reaction.text : '来看看这个词～');

    // Card reveal
    card.style.opacity = '0';
    void card.offsetWidth;
    setTimeout(() => {
      card.style.opacity = '';
      card.classList.add('fade-up');
    }, 350);

    document.getElementById('btnKnow').disabled = false;
    document.getElementById('btnUnknown').disabled = false;
    hideReaction();
  }

  function markWord(type) {
    const words = isReviewMode ? reviewWordsList : dailyWords;
    const w = words[currentIndex];

    // Record in English Engine
    EnglishEngine.recordResult(w.en, type);
    AIEngine.updateSession(type);
    Data.save(appData);

    if (type === 'know') knownCount++;

    // Dispatch event for AI reaction
    const event = type === 'know' ? 'WORD_KNOWN' : 'WORD_UNKNOWN';
    const reaction = Bus.dispatchSync(event, {
      word: w,
      progress: { current: currentIndex+1, total: words.length },
      lastResult,
      lastWord: currentIndex > 0 ? words[currentIndex-1].en : null,
    });

    if (reaction) showReaction(reaction.text);

    document.getElementById('btnKnow').disabled = true;
    document.getElementById('btnUnknown').disabled = true;

    const card = document.getElementById('wordCard');
    card.classList.add('swipe-out');

    lastResult = type;
    currentIndex++;
    document.getElementById('progressFill').style.width = `${(currentIndex/words.length)*100}%`;
    document.getElementById('progressText').textContent = `${Math.min(currentIndex+1, words.length)} / ${words.length}`;

    setTimeout(() => showWord(currentIndex), 750);
  }

  function showIntro(msg) {
    const a = document.getElementById('eeIntroAvatar');
    const b = document.getElementById('eeIntroBubble');
    b.textContent = msg;
    a.classList.add('show'); b.classList.add('show');
  }

  function showReaction(msg) {
    const a = document.getElementById('eeReactionAvatar');
    const b = document.getElementById('eeReactionBubble');
    b.textContent = msg;
    a.classList.add('show'); b.classList.add('show');
  }

  function hideReaction() {
    document.getElementById('eeReactionAvatar').classList.remove('show');
    document.getElementById('eeReactionBubble').classList.remove('show');
  }

  function confirmQuit() {
    const words = isReviewMode ? reviewWordsList : dailyWords;
    if (currentIndex > 0 && currentIndex < words.length) {
      const reaction = Bus.dispatchSync('LEARNING_QUIT', {
        progress: { current: currentIndex, total: words.length },
      });
      const msg = reaction ? reaction.text : '确定要退出吗？';
      if (confirm(msg + '\n\n当前进度不会保存。')) goHome();
    } else {
      goHome();
    }
  }

  /* ---- Complete Flow ---- */
  async function finishLearning() {
    const words = isReviewMode ? reviewWordsList : dailyWords;
    const total = words.length;
    const unknownCount = total - knownCount;

    // Complete in English Engine
    EnglishEngine.completeSession(knownCount, isReviewMode);
    appData = Data.normalize(Data.load()); // Reload to get updated streak

    const context = AIEngine.buildContext('LEARNING_COMPLETED', {
      progress: { current: total, total },
      knownCount,
    });

    // Render L1 completion immediately
    const l1 = AIEngine.generateCompletionL1(knownCount, total, context);
    document.getElementById('completeTitle').textContent = l1.title;
    document.getElementById('completeDetail').textContent =
      unknownCount > 0 ? `明天这 ${unknownCount} 个词会优先复习～` : '休息一下，明天继续～';
    document.getElementById('completeStreakBadge').innerHTML = l1.streakMsg;

    // Harvest
    const dh = appData.dailyHistory[TODAY] || { known: [], unknown: [] };
    let hHTML = '';
    for (const w of (dh.known || [])) hHTML += `<span class="chip chip-known">✅ ${w}</span>`;
    for (const w of (dh.unknown || [])) hHTML += `<span class="chip chip-unknown">⚠️ ${w}</span>`;
    if (!hHTML) for (const w of words) hHTML += `<span class="chip chip-known">✅ ${w.en}</span>`;
    document.getElementById('harvestChips').innerHTML = hHTML;
    document.getElementById('harvestSection').style.display = 'block';

    // Preview
    const pending = EnglishEngine.getReviewQueue();
    const ps = document.getElementById('previewSection');
    if (pending.length > 0) {
      ps.style.display = 'block';
      document.getElementById('previewChips').innerHTML =
        pending.slice(0, 8).map(w => `<span class="preview-chip">🔮 ${w}</span>`).join('');
    } else { ps.style.display = 'none'; }

    // Farewell (L1)
    const farewellP = [
      '明天见！小E每天都会在这里～',
      '明天这个时间我准备了新词等你 🐣',
      '说好了，明天见 👋',
      '明天也要来找我哦，拉钩 🤙',
    ];
    if (unknownCount > 0) {
      document.getElementById('completeFarewell').textContent =
        `明天我们先复习这 ${unknownCount} 个词，不见不散！🤙`;
    } else {
      document.getElementById('completeFarewell').textContent =
        farewellP[Math.floor(Math.random() * farewellP.length)];
    }

    switchPage('complete');
    spawnConfetti();

    // L2: Try API upgrade for completion message
    const apiReaction = await Bus.dispatch('LEARNING_COMPLETED', {
      knownCount,
      progress: { current: total, total },
    });

    if (apiReaction && apiReaction.fromAPI && apiReaction.text) {
      // Smoothly upgrade the detail message
      const detail = document.getElementById('completeDetail');
      detail.style.opacity = '0';
      detail.style.transform = 'translateY(8px)';
      setTimeout(() => {
        detail.textContent = apiReaction.text;
        detail.style.opacity = '1';
        detail.style.transform = 'translateY(0)';
      }, 300);
    }

    // Check milestone
    checkMilestone();
  }

  function relearn() {
    currentIndex = 0; knownCount = 0;
    lastResult = null;
    AIEngine.resetSession();
    Bus.dispatchSync('LEARNING_STARTED', { mode: 'relearn' });
    switchPage('learn');
    showWord(0);
  }

  /* ---- Chat ---- */
  function openChat() {
    const apiKey = appData.apiKey || '';
    const notice = document.getElementById('apiKeyNotice');
    if (!apiKey) {
      notice.style.display = 'block';
      document.getElementById('apiKeyInput').value = '';
    } else {
      notice.style.display = 'none';
    }

    // Context bar
    const ctxBar = document.getElementById('chatContextBar');
    if (appData.studyDays[TODAY]) {
      const dh = appData.dailyHistory[TODAY] || { known: [], unknown: [] };
      ctxBar.style.display = 'block';
      ctxBar.textContent = `📚 今天已学 ${dh.known.length+dh.unknown.length} 个词 · 🔥 连续 ${calcStreak()} 天`;
    } else {
      ctxBar.style.display = 'none';
    }

    renderChat();

    // AI opens chat
    const reaction = Bus.dispatchSync('CHAT_OPENED', {});
    if (reaction && reaction.text && (!appData.chatHistory || appData.chatHistory.length === 0)) {
      addChatMsg('ee', reaction.text);
    }
  }

  function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) { alert('请输入 API Key'); return; }
    appData.apiKey = key;
    Data.save(appData);
    document.getElementById('apiKeyNotice').style.display = 'none';
    renderChat();
    addChatMsg('ee', 'API Key 已保存！现在可以和我聊天啦 🐣\n有什么想聊的吗？');
  }

  async function sendChat() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;

    const apiKey = appData.apiKey || '';
    if (!apiKey) {
      alert('请先设置 DeepSeek API Key');
      return;
    }

    input.value = '';
    addChatMsg('user', msg);

    // Typing indicator
    const ti = document.getElementById('typingIndicator');
    ti.style.display = 'flex';
    document.getElementById('btnSend').disabled = true;
    scrollChat();

    // L2 API response
    const reaction = await Bus.dispatch('CHAT_MESSAGE_SENT', { message: msg });

    ti.style.display = 'none';
    document.getElementById('btnSend').disabled = false;

    if (reaction && reaction.text) {
      addChatMsg('ee', reaction.text);
    } else {
      addChatMsg('ee', '😅 好像出了点问题……检查一下 API Key 或者网络？');
    }
  }

  function addChatMsg(role, content) {
    const msg = { role, content, time: new Date().toISOString() };
    if (!appData.chatHistory) appData.chatHistory = [];
    appData.chatHistory.push(msg);
    if (appData.chatHistory.length > 200) appData.chatHistory = appData.chatHistory.slice(-200);
    Data.save(appData);

    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'chat-msg ' + (role === 'ee' ? 'ee' : 'user');
    div.innerHTML = `
      <span class="msg-avatar">${role === 'ee' ? '🐣' : '😊'}</span>
      <div class="msg-bubble">${escapeHtml(content)}</div>
    `;
    container.appendChild(div);
    scrollChat();
  }

  function renderChat() {
    const container = document.getElementById('chatMessages');
    container.innerHTML = '';

    const msgs = (appData.chatHistory || []).slice(-50);
    for (const m of msgs) {
      const div = document.createElement('div');
      div.className = 'chat-msg ' + (m.role === 'ee' ? 'ee' : 'user');
      div.innerHTML = `
        <span class="msg-avatar">${m.role === 'ee' ? '🐣' : '😊'}</span>
        <div class="msg-bubble">${escapeHtml(m.content)}</div>
      `;
      container.appendChild(div);
    }

    if (msgs.length === 0 && (appData.apiKey || '')) {
      // Welcome will be handled by openChat
    }

    scrollChat();
  }

  function scrollChat() {
    const container = document.getElementById('chatMessages');
    setTimeout(() => { if (container) container.scrollTop = container.scrollHeight; }, 100);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, '<br>');
  }

  /* ---- Milestone ---- */
  function checkMilestone() {
    if (appData.studyDays[TODAY] && appData.streak < 7) return;
    const streak = calcStreak();
    const milestones = { 7: '🎉', 21: '🏆', 30: '👑' };
    for (const [day, emoji] of Object.entries(milestones)) {
      const d = parseInt(day);
      if (streak >= d && !appData.milestones[day]) {
        showMilestone(d, emoji);
        appData.milestones[day] = true;
        Data.save(appData);
        return;
      }
    }
  }

  async function showMilestone(day, emoji) {
    const reaction = Bus.dispatchSync('MILESTONE_REACHED', { days: day });
    const overlay = document.getElementById('milestoneOverlay');
    document.getElementById('milestoneEmoji').textContent = emoji;

    if (reaction && reaction.text && typeof reaction.text === 'object') {
      document.getElementById('milestoneTitle').textContent = reaction.text.title;
      document.getElementById('milestoneMsg').textContent = reaction.text.msg;
    } else {
      const defaults = {
        7: { title: '连续 7 天！', msg: '一周了！能坚持一周的人不到一半 📊' },
        21: { title: '连续 21 天！', msg: '21天养成一个习惯 🎉' },
        30: { title: '连续 30 天！', msg: '整整一个月的坚持 🏆' },
      };
      document.getElementById('milestoneTitle').textContent = defaults[day].title;
      document.getElementById('milestoneMsg').textContent = defaults[day].msg;
    }

    overlay.style.display = 'flex';
    spawnConfetti();

    // Try L2 API for personalized celebration
    const apiReaction = await Bus.dispatch('MILESTONE_REACHED', { days: day });
    if (apiReaction && apiReaction.fromAPI && apiReaction.text) {
      document.getElementById('milestoneMsg').textContent = apiReaction.text;
    }
  }

  function dismissMilestone() {
    document.getElementById('milestoneOverlay').style.display = 'none';
  }

  /* ---- Confetti ---- */
  function spawnConfetti() {
    const colors = ['#6366F1','#818CF8','#F59E0B','#10B981','#EF4444','#EC4899','#8B5CF6'];
    for (let i = 0; i < 50; i++) {
      setTimeout(() => {
        const p = document.createElement('div');
        p.className = 'confetti-piece';
        p.style.left = Math.random()*100+'%';
        p.style.top = (50+Math.random()*40)+'%';
        p.style.background = colors[Math.floor(Math.random()*colors.length)];
        p.style.animationDuration = (0.8+Math.random()*1.6)+'s';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 2500);
      }, i*15);
    }
  }

  /* ---- Init ---- */
  function init() {
    document.getElementById('headerTime').textContent =
      `${new Date().getMonth()+1}月${new Date().getDate()}日 · ${['日','一','二','三','四','五','六'][new Date().getDay()]}`;

    const timeMap = { morning: '☀️ 早安', afternoon: '🌤️ 下午好', evening: '🌙 晚上好', night: '🌙 夜深了' };
    const h = new Date().getHours();
    let tod = 'morning';
    if (h >= 12 && h < 18) tod = 'afternoon';
    else if (h >= 18 && h < 23) tod = 'evening';
    else if (h >= 23 || h < 5) tod = 'night';
    document.getElementById('timeGreeting').textContent = timeMap[tod];

    appData.streak = calcStreak();
    renderHome();

    // Check milestone on load
    if (appData.streak > 0 && !appData.studyDays[TODAY]) {
      setTimeout(checkMilestone, 800);
    }
  }

  return {
    switchPage,
    goHome,
    startLearning,
    startReview,
    markWord,
    confirmQuit,
    relearn,
    saveApiKey,
    sendChat,
    dismissMilestone,
    init,
  };
})();

// Boot
UI.init();
</script>
</body>
</html>
