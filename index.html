<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>English Habit — 每日英语习惯</title>
<style>
/* ================================================================
   Design Tokens
   ================================================================ */
:root {
  --amber: #f59e0b;
  --amber-light: #fbbf24;
  --amber-bg: #fffbeb;
  --amber-border: #fde68a;
  --green: #10b981;
  --green-bg: #ecfdf5;
  --green-border: #a7f3d0;
  --red: #ef4444;
  --red-bg: #fef2f2;
  --red-border: #fecaca;
  --slate-50: #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-300: #cbd5e1;
  --slate-400: #94a3b8;
  --slate-500: #64748b;
  --slate-600: #475569;
  --slate-700: #334155;
  --slate-800: #1e293b;
  --slate-900: #0f172a;
  --white: #ffffff;
  --radius: 20px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 4px 16px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
}

/* ================================================================
   Reset & Base
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #fffbeb;
  color: var(--slate-800);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ================================================================
   Header
   ================================================================ */
.header {
  padding: 16px 20px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,251,235,0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.header-brand {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--slate-800);
}

.header-brand .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--amber);
}

.header-btn {
  background: none;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-xs);
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  color: var(--slate-500);
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.header-btn:active { background: var(--slate-100); }

/* ================================================================
   Pages
   ================================================================ */
.page { flex:1; display:none; flex-direction:column; padding:8px 20px 100px; overflow-y:auto; }
.page.active { display: flex; }

/* ================================================================
   Home Page
   ================================================================ */
.time-greeting {
  text-align: center;
  padding: 4px 0 2px;
  font-size: 13px;
  color: var(--slate-400);
  font-weight: 500;
}

/* Hero card */
.hero-card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 32px 24px 24px;
  text-align: center;
  margin: 12px 0 16px;
  animation: cardIn 0.5s ease-out;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-emoji {
  font-size: 56px;
  line-height: 1;
  margin-bottom: 8px;
  display: block;
}

.hero-greeting {
  font-size: 17px;
  font-weight: 700;
  color: var(--slate-800);
  margin-bottom: 4px;
}

.hero-sub {
  font-size: 13px;
  color: var(--slate-400);
  margin-bottom: 16px;
}

/* Progress ring */
.progress-ring-wrap {
  position: relative;
  width: 100px;
  height: 100px;
  margin: 0 auto 8px;
}

.progress-ring {
  transform: rotate(-90deg);
  width: 100px;
  height: 100px;
}

.progress-ring .bg {
  fill: none;
  stroke: var(--slate-100);
  stroke-width: 8;
}

.progress-ring .fill {
  fill: none;
  stroke: var(--amber);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.6s ease;
}

.progress-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.progress-num {
  font-size: 24px;
  font-weight: 700;
  color: var(--amber);
  letter-spacing: -0.5px;
}

.progress-label {
  font-size: 10px;
  color: var(--slate-400);
  font-weight: 500;
}

/* Stats chips */
.stats-chips {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.stat-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--amber-bg);
  border: 1px solid var(--amber-border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #92400e;
}

.stat-chip.fire { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
.stat-chip.star { background: #fefce8; border-color: #fef08a; color: #a16207; }

/* Action buttons */
.home-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 14px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  padding: 15px 24px;
  font-family: inherit;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  width: 100%;
}

.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--amber);
  color: #fff;
  box-shadow: 0 4px 16px rgba(245,158,11,0.3);
}

.btn-secondary {
  background: var(--white);
  color: var(--slate-700);
  border: 1.5px solid var(--slate-200);
}

.btn-review-badge {
  display: inline-block;
  background: #fef3c7;
  color: #d97706;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 8px;
  margin-left: 4px;
}

/* Today complete tag */
.today-done {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--green-bg);
  color: #065f46;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
  margin-top: 4px;
}

/* Yesterday section */
.yesterday-section {
  background: var(--white);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 14px 18px;
  margin-bottom: 12px;
}

.yesterday-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--slate-400);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.yesterday-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 8px;
}

.chip-known { background: var(--green-bg); color: #065f46; }
.chip-unknown { background: var(--red-bg); color: #991b1b; }

/* ================================================================
   Learn Page
   ================================================================ */
.learn-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.btn-back {
  background: none;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-xs);
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  color: var(--slate-500);
  -webkit-tap-highlight-color: transparent;
}

.btn-back:active { background: var(--slate-100); }

.progress-wrap { flex: 1; }

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--slate-400);
  margin-bottom: 6px;
}

.progress-bar {
  height: 5px;
  background: var(--slate-200);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--amber);
  border-radius: 3px;
  transition: width 0.3s ease;
}

/* Companion mini bubble */
.ee-bubble {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
  min-height: 36px;
}

.ee-bubble-avatar {
  font-size: 26px;
  line-height: 1;
  flex-shrink: 0;
}

.ee-bubble-text {
  background: var(--white);
  border-radius: 12px;
  border-top-left-radius: 4px;
  padding: 9px 14px;
  font-size: 13px;
  color: var(--slate-600);
  line-height: 1.5;
  box-shadow: var(--shadow-sm);
  max-width: 85%;
  opacity: 0;
  transform: translateY(6px);
  transition: all 0.25s ease;
}
.ee-bubble-text.show { opacity: 1; transform: translateY(0); }

/* Word card */
.word-card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 32px 24px;
  text-align: center;
  margin-bottom: 14px;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform 0.25s ease, opacity 0.25s ease;
  position: relative;
}

.word-card.swipe-out {
  transform: translateY(-12px);
  opacity: 0;
}

.word-card.fade-up {
  animation: fadeUp 0.35s ease-out;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.word-card .review-tag {
  font-size: 11px;
  font-weight: 600;
  color: #dc2626;
  background: var(--red-bg);
  padding: 3px 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.word-card .new-tag {
  font-size: 11px;
  font-weight: 600;
  color: #059669;
  background: var(--green-bg);
  padding: 3px 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.word-en {
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--slate-900);
  margin-bottom: 4px;
}

.word-phonetic {
  font-size: 15px;
  color: var(--slate-400);
  margin-bottom: 8px;
}

.btn-speak {
  background: var(--amber-bg);
  border: 1.5px solid var(--amber-border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  color: #92400e;
  font-weight: 500;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  margin-bottom: 6px;
}
.btn-speak:active { background: #fef3c7; transform: scale(0.95); }
.btn-speak.speaking { background: #fef3c7; border-color: var(--amber); }

/* Revealed details (after assessment) */
.word-details {
  display: none;
  width: 100%;
  text-align: center;
  margin-top: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--slate-100);
}

.word-details.show { display: block; }

.word-cn {
  font-size: 19px;
  color: var(--slate-700);
  font-weight: 600;
  margin-bottom: 10px;
  line-height: 1.5;
}

.word-examples {
  text-align: left;
  font-size: 13px;
  color: var(--slate-500);
  line-height: 1.6;
}

.word-examples .ex-en {
  color: var(--slate-600);
  margin-bottom: 2px;
}

.word-examples .ex-zh {
  color: var(--slate-400);
  font-size: 12px;
  margin-bottom: 8px;
}

/* Assessment buttons */
.learn-actions {
  display: flex;
  gap: 12px;
}

.btn-learn {
  flex: 1;
  height: 52px;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 600;
  border: 2px solid transparent;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
  -webkit-tap-highlight-color: transparent;
}

.btn-learn:active { transform: scale(0.95); }
.btn-learn:disabled { opacity: 0.5; pointer-events: none; }

.btn-unknown {
  background: var(--white);
  color: #dc2626;
  border-color: var(--red-border);
}

.btn-unsure {
  background: var(--white);
  color: #d97706;
  border-color: var(--amber-border);
}

.btn-know {
  background: var(--white);
  color: #059669;
  border-color: var(--green-border);
}

/* ================================================================
   Complete Page
   ================================================================ */
.complete-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px 0;
}

.complete-emoji {
  font-size: 68px;
  line-height: 1;
  margin-bottom: 16px;
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}

.complete-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 6px;
}

.complete-detail {
  font-size: 14px;
  color: var(--slate-500);
  margin-bottom: 12px;
  line-height: 1.5;
}

.complete-streak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff7ed;
  color: #c2410c;
  font-size: 15px;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: 20px;
  margin-bottom: 14px;
}

/* Harvest */
.harvest-section {
  background: var(--white);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 14px 18px;
  margin-bottom: 12px;
  width: 100%;
  text-align: left;
}

.harvest-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--slate-400);
  margin-bottom: 8px;
}

.harvest-chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Preview (tomorrow's reviews) */
.preview-section {
  background: var(--amber-bg);
  border-radius: var(--radius-sm);
  border: 1px solid var(--amber-border);
  padding: 14px 18px;
  margin-bottom: 12px;
  width: 100%;
  text-align: left;
}

.preview-title {
  font-size: 12px;
  font-weight: 600;
  color: #92400e;
  margin-bottom: 8px;
}

.preview-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.preview-chip {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 8px;
  background: #fff;
  color: #92400e;
  border: 1px solid var(--amber-border);
}

/* ================================================================
   Stats Page
   ================================================================ */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--white);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 18px 16px;
  text-align: center;
}

.stat-card .val {
  font-size: 28px;
  font-weight: 700;
  color: var(--amber);
  letter-spacing: -0.5px;
}

.stat-card .lbl {
  font-size: 12px;
  color: var(--slate-400);
  font-weight: 500;
  margin-top: 2px;
}

/* Calendar heatmap */
.calendar-section {
  background: var(--white);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 18px;
  margin-bottom: 20px;
}

.calendar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--slate-400);
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.calendar-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}

.calendar-day {
  width: 12px;
  height: 12px;
  border-radius: 2px;
  background: var(--slate-100);
  cursor: default;
  position: relative;
}

.calendar-day.studied { background: #fcd34d; }
.calendar-day.missed { background: var(--slate-200); }

.calendar-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  font-size: 11px;
  color: var(--slate-400);
}

.calendar-legend .dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
}

/* Word distribution */
.dist-section {
  background: var(--white);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 18px;
  margin-bottom: 20px;
}

.dist-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--slate-400);
  margin-bottom: 12px;
}

.dist-bar-wrap {
  margin-bottom: 8px;
}

.dist-bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 4px;
}

.dist-bar {
  height: 6px;
  background: var(--slate-100);
  border-radius: 3px;
  overflow: hidden;
}

.dist-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s ease;
}

.dist-bar-fill.mastered { background: #10b981; }
.dist-bar-fill.review { background: #6366f1; }
.dist-bar-fill.learning { background: #f59e0b; }
.dist-bar-fill.new { background: #cbd5e1; }

/* ================================================================
   Responsive
   ================================================================ */
@media (min-width: 480px) {
  .app {
    border-left: 1px solid var(--slate-200);
    border-right: 1px solid var(--slate-200);
  }
}

@media (max-width: 360px) {
  .hero-emoji { font-size: 44px; }
  .hero-greeting { font-size: 15px; }
  .word-en { font-size: 30px; }
  .word-cn { font-size: 17px; }
  .complete-emoji { font-size: 52px; }
  .progress-ring-wrap { width: 80px; height: 80px; }
  .progress-ring { width: 80px; height: 80px; }
  .progress-num { font-size: 20px; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-brand">📖 English Habit<span class="dot"></span></div>
    <button class="header-btn" id="headerStatsBtn" onclick="UI.showStats()">📊 统计</button>
  </header>

  <!-- ===== Home Page ===== -->
  <main class="page active" id="page-home">
    <div class="time-greeting" id="timeGreeting"></div>

    <div class="hero-card" id="heroCard">
      <span class="hero-emoji" id="heroEmoji">📚</span>
      <div class="hero-greeting" id="heroGreeting">准备开始今天的英语学习吧！</div>
      <div class="hero-sub" id="heroSub"></div>

      <div class="progress-ring-wrap" id="progressRingWrap">
        <svg class="progress-ring" viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="42"/>
          <circle class="fill" id="progressCircle" cx="50" cy="50" r="42"
                  stroke-dasharray="263.89" stroke-dashoffset="263.89"/>
        </svg>
        <div class="progress-text">
          <span class="progress-num" id="progressNum">0</span>
          <span class="progress-label" id="progressLabel">今日单词</span>
        </div>
      </div>

      <div class="stats-chips">
        <span class="stat-chip fire">🔥 <span id="statStreak">0</span> 天连续</span>
        <span class="stat-chip star">⭐ <span id="statTotalWords">0</span> 词掌握</span>
      </div>

      <div id="todayDoneTag" style="margin-top:8px"></div>
    </div>

    <div class="home-actions">
      <button class="btn btn-primary" id="btnStart" onclick="UI.startLearning()">
        📖 <span id="btnStartLabel">开始学习</span>
      </button>
      <button class="btn btn-secondary" id="btnReview" onclick="UI.startReview()" style="display:none">
        🔄 复习待巩固单词 <span class="btn-review-badge" id="reviewBadgeCount"></span>
      </button>
    </div>

    <div class="yesterday-section" id="yesterdaySection" style="display:none">
      <div class="yesterday-title">📋 昨日回顾</div>
      <div class="yesterday-chips" id="yesterdayChips"></div>
    </div>
  </main>

  <!-- ===== Learn Page ===== -->
  <main class="page" id="page-learn">
    <div class="learn-header">
      <button class="btn-back" onclick="UI.confirmQuit()">← 返回</button>
      <div class="progress-wrap">
        <div class="progress-info">
          <span id="learnProgressLabel">第 1 个词</span>
          <span id="learnProgressText">1 / 20</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="learnProgressFill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div class="ee-bubble">
      <span class="ee-bubble-avatar">🐣</span>
      <div class="ee-bubble-text" id="eeBubbleText"></div>
    </div>

    <div class="word-card" id="wordCard">

/* ================================================================
   DATA LAYER — localStorage persistence
   Key: english_habit_v5
   ================================================================ */
const TODAY = new Date().toISOString().split('T')[0];
const STORAGE_KEY = 'english_habit_v5';
const DAILY_NEW = 10;       // new words per day
const DAILY_MAX = 20;       // max total words per session

const Data = {
  defaults() {
    return {
      studyDays: {},          // { "2026-06-11": true }
      lastStudyDate: null,
      streak: 0,
      totalDays: 0,
      totalWordsLearned: 0,
      wordStates: {},         // SM-2 state per word
      dailyHistory: {},       // { "2026-06-11": { words: { "abandon": "know" }, completed: true } }
      settings: { dailyNew: DAILY_NEW, dailyMax: DAILY_MAX }
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        // Merge with defaults for migration
        const def = Data.defaults();
        for (const k of Object.keys(def)) {
          if (!(k in d)) d[k] = def[k];
        }
        return d;
      }
    } catch(e) { /* corrupted data, start fresh */ }
    return Data.defaults();
  },

  save(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  }
};

let appData = Data.load();

/* ================================================================
   HELPERS
   ================================================================ */
function ymd(date) { return date.toISOString().split('T')[0]; }

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return ymd(d);
}

function daysBetween(a, b) {
  const da = new Date(a + 'T00:00:00');
  const db = new Date(b + 'T00:00:00');
  return Math.floor((db - da) / 86400000);
}

function calcStreak() {
  if (!appData.lastStudyDate) return 0;
  const d = daysBetween(appData.lastStudyDate, TODAY);
  return d <= 1 ? appData.streak : 0;
}

/* ================================================================
   SRS ENGINE — SM-2 spaced repetition algorithm
   ================================================================ */
const SRS = {
  // Quality mapping from user response
  Q: { know: 4, unsure: 2, unknown: 0 },

  // Get or init state for a word
  getState(en) {
    if (!appData.wordStates[en]) {
      appData.wordStates[en] = {
        ef: 2.5,
        interval: 0,
        reps: 0,
        nextReview: null,  // null = never seen
        firstSeen: null,
        lastSeen: null,
        totalSeen: 0,
        totalCorrect: 0
      };
    }
    return appData.wordStates[en];
  },

  // Apply SM-2 after user response
  update(en, quality) {
    const st = SRS.getState(en);
    const q = typeof quality === 'number' ? quality : (SRS.Q[quality] || 0);

    st.totalSeen++;
    st.lastSeen = TODAY;
    if (!st.firstSeen) st.firstSeen = TODAY;
    if (q >= 3) st.totalCorrect++;

    // SM-2 algorithm
    let ef = st.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
    if (ef < 1.3) ef = 1.3;
    st.ef = ef;

    if (q < 3) {
      // Failed: reset
      st.interval = 1;
      st.reps = 0;
    } else {
      if (st.reps === 0) st.interval = 1;
      else if (st.reps === 1) st.interval = 3;
      else st.interval = Math.round(st.interval * st.ef);
      st.reps++;
    }

    st.nextReview = addDays(TODAY, st.interval);
    return st;
  },

  // Get words due for review today
  getDueWords() {
    const due = [];
    for (const en of Object.keys(appData.wordStates)) {
      const st = appData.wordStates[en];
      if (st.nextReview && st.nextReview <= TODAY) {
        due.push(en);
      }
    }
    // Sort: overdue first (longest overdue), then by reps (fewest first)
    due.sort((a, b) => {
      const sa = appData.wordStates[a], sb = appData.wordStates[b];
      const overdueA = daysBetween(sa.nextReview, TODAY);
      const overdueB = daysBetween(sb.nextReview, TODAY);
      if (overdueA !== overdueB) return overdueB - overdueA;
      return sa.reps - sb.reps;
    });
    return due;
  },

  // Get unseen words (never introduced)
  getNewWords() {
    const seen = new Set(Object.keys(appData.wordStates).filter(
      en => appData.wordStates[en].firstSeen !== null
    ));
    return WORD_BANK.filter(w => !seen.has(w.en));
  },

  // Word categorization for stats
  categorize() {
    let mastered = 0, review = 0, learning = 0;
    for (const en of Object.keys(appData.wordStates)) {
      const st = appData.wordStates[en];
      if (st.reps >= 5) mastered++;
      else if (st.reps >= 1 && st.nextReview && st.nextReview > TODAY) review++;
      else if (st.firstSeen) learning++;
    }
    const total = WORD_BANK.length;
    const unseen = total - mastered - review - learning;
    return { mastered, review, learning, unseen, total };
  },

  // Is a word "mastered" (5+ consecutive correct)
  isMastered(en) {
    const st = appData.wordStates[en];
    return st && st.reps >= 5;
  }
};

/* ================================================================
   SESSION MANAGER — handles one learning session
   ================================================================ */
const Session = {
  words: [],        // ordered list of {word, isReview}
  currentIdx: 0,
  isReviewMode: false,
  results: [],      // [{en, quality}]

  prepare(isReviewOnly) {
    Session.currentIdx = 0;
    Session.results = [];
    Session.isReviewMode = isReviewOnly;

    // Get review words first
    const dueWords = SRS.getDueWords();
    const reviewSet = new Set(dueWords);

    let selected = [];
    const used = new Set();

    // Add review words (up to DAILY_MAX)
    for (const en of dueWords) {
      if (selected.length >= DAILY_MAX) break;
      const w = WORD_BANK.find(w => w.en === en);
      if (w && !used.has(w.en)) {
        used.add(w.en);
        selected.push({ word: w, isReview: true });
      }
    }

    // Add new words if not review-only mode (up to DAILY_NEW new, DAILY_MAX total)
    if (!isReviewOnly) {
      const newWords = SRS.getNewWords();
      for (const w of newWords) {
        if (selected.length >= DAILY_MAX) break;
        if (!used.has(w.en)) {
          used.add(w.en);
          selected.push({ word: w, isReview: false });
        }
      }
    }

    // If still empty (all words mastered/seen), add some review words anyway
    if (selected.length === 0) {
      for (const en of dueWords.slice(0, DAILY_MAX)) {
        const w = WORD_BANK.find(w => w.en === en);
        if (w && !used.has(w.en)) {
          used.add(w.en);
          selected.push({ word: w, isReview: true });
        }
      }
    }

    // Last resort: pick random non-mastered words
    if (selected.length === 0) {
      const nonMastered = WORD_BANK.filter(w => !SRS.isMastered(w.en));
      for (let i = nonMastered.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [nonMastered[i], nonMastered[j]] = [nonMastered[j], nonMastered[i]];
      }
      for (const w of nonMastered) {
        if (selected.length >= DAILY_MAX) break;
        selected.push({ word: w, isReview: false });
      }
    }

    Session.words = selected;
    return selected.length;
  },

  current() {
    if (Session.currentIdx >= Session.words.length) return null;
    return Session.words[Session.currentIdx];
  },

  recordResponse(en, quality) {
    SRS.update(en, quality);

    // Track in daily history
    if (!appData.dailyHistory[TODAY]) {
      appData.dailyHistory[TODAY] = { words: {}, completed: false };
    }
    appData.dailyHistory[TODAY].words[en] = quality;

    Session.results.push({ en, quality });
  },

  advance() {
    Session.currentIdx++;
    return Session.currentIdx < Session.words.length;
  },

  complete() {
    if (!Session.isReviewMode) {
      if (!appData.studyDays[TODAY]) {
        appData.studyDays[TODAY] = true;
        appData.totalDays = Object.keys(appData.studyDays).length;
      }

      const knownCount = Session.results.filter(r => SRS.Q[r.quality] >= 3).length;
      appData.totalWordsLearned += knownCount;

      const yesterday = addDays(TODAY, -1);
      if (appData.lastStudyDate === yesterday || appData.lastStudyDate === TODAY) {
        if (appData.lastStudyDate !== TODAY) appData.streak++;
      } else if (appData.lastStudyDate !== TODAY) {
        appData.streak = 1;
      }
      appData.lastStudyDate = TODAY;

      if (appData.dailyHistory[TODAY]) {
        appData.dailyHistory[TODAY].completed = true;
      }
    }
    Data.save(appData);
  },

  getStats() {
    const know = Session.results.filter(r => SRS.Q[r.quality] >= 3).length;
    const unsure = Session.results.filter(r => SRS.Q[r.quality] === 2).length;
    const unknown = Session.results.filter(r => SRS.Q[r.quality] === 0).length;
    const total = Session.results.length;
    return { know, unsure, unknown, total };
  }
};

/* ================================================================
   COMPANION REACTIONS — simple template-based encouraging messages
   ================================================================ */
const Companion = {
  // Time-based greetings
  homeGreeting() {
    const h = new Date().getHours();
    const streak = calcStreak();
    const cat = SRS.categorize();

    if (h < 6) return { emoji: '🌙', msg: '夜深了，注意休息哦。明天再来吧！', sub: `还有 ${cat.unseen + cat.learning + cat.review} 个词等你探索` };
    if (h < 12) return { emoji: '☀️', msg: '早上好！一日之计在于晨，开始学习吧！', sub: `${cat.review} 个词等待复习，${cat.unseen} 个新词待解锁` };
    if (h < 18) return { emoji: '📚', msg: '下午好！来巩固一下今天的单词吧。', sub: `${cat.review} 个词等待复习，${cat.unseen} 个新词待解锁` };
    return { emoji: '🌆', msg: '晚上好！睡前学习效率更高哦。', sub: `${cat.review} 个词等待复习，${cat.unseen} 个新词待解锁` };
  },

  // Word intro
  wordIntro(item) {
    if (item.isReview) {
      const st = appData.wordStates[item.word.en];
      const attempts = st ? st.totalSeen : 1;
      if (attempts >= 3) return '这个词见过几次了，这次能记住吗？🧐';
      return '这个词之前遇到过，再来巩固一下吧！🔄';
    }
    const newToday = Session.results.filter(r => SRS.Q[r.quality] === undefined || !appData.wordStates[r.en]?.firstSeen).length;
    if (newToday === 0) return '来看看今天第一个新词！✨';
    if (newToday <= 3) return '新词来啦，认真看哦！👀';
    return '继续加油，又解锁一个新词！💪';
  },

  // Reaction to assessment
  reaction(quality) {
    const templates = {
      know: [
        '太棒了！这个词已经掌握了！🎉',
        '厉害！看来这个词已经牢牢记住了 💪',
        '轻轻松松，这个词不在话下！✅',
        '看来你真的很熟悉这个词呢！👍',
      ],
      unsure: [
        '有点印象但不太确定？没关系，再看看 👀',
        '再巩固一下就好了，明天会更好的！💪',
        '模模糊糊的印象说明还需要多见面呢 🧐',
      ],
      unknown: [
        '没关系，今天就是来学习的！📖',
        '现在认识也不晚，多看几遍就记住了 🌱',
        '不认识很正常，这才是学习的意义呀！💡',
        '别灰心，每个词都是从陌生到熟悉的 ✨',
      ]
    };
    const pool = templates[quality] || templates.unknown;
    return pool[Math.floor(Math.random() * pool.length)];
  },

  // Completion message
  completion(stats) {
    const { know, unsure, unknown, total } = stats;
    const accuracy = Math.round((know / total) * 100);

    let emoji, title, detail;
    if (accuracy >= 90) {
      emoji = '🏆'; title = '太厉害了！'; detail = `正确率 ${accuracy}%，几乎全对！`;
    } else if (accuracy >= 70) {
      emoji = '🎉'; title = '完成得很不错！'; detail = `正确率 ${accuracy}%，继续保持！`;
    } else if (accuracy >= 50) {
      emoji = '💪'; title = '不错的学习！'; detail = `正确率 ${accuracy}%，还有进步空间哦`;
    } else {
      emoji = '🌱'; title = '每一步都是进步！'; detail = `认识了 ${know} 个词，新词需要多见面几次`;
    }
    return { emoji, title, detail };
  }
};

const UI = {
  /* ---- Page Navigation ---- */
  switchPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const page = document.getElementById('page-' + name);
    if (page) page.classList.add('active');
    if (name === 'home') UI.renderHome();
    if (name === 'stats') UI.renderStats();
  },

  goHome() {
    UI.switchPage('home');
  },

  /* ---- Home ---- */
  renderHome() {
    const { emoji, msg, sub } = Companion.homeGreeting();
    const streak = calcStreak();
    const cat = SRS.categorize();
    const dueCount = SRS.getDueWords().length;

    document.getElementById('timeGreeting').textContent = new Date().toLocaleDateString('zh-CN', { weekday: 'long', month: 'long', day: 'numeric' });
    document.getElementById('heroEmoji').textContent = emoji;
    document.getElementById('heroGreeting').textContent = msg;
    document.getElementById('heroSub').textContent = sub || '';
    document.getElementById('statStreak').textContent = streak;
    document.getElementById('statTotalWords').textContent = cat.mastered;

    // Progress ring
    const todayRec = appData.dailyHistory[TODAY];
    const todayWords = todayRec ? Object.keys(todayRec.words).length : 0;
    const dailyMax = appData.settings.dailyMax || DAILY_MAX;
    const pct = Math.min(100, Math.round((todayWords / dailyMax) * 100));

    const circle = document.getElementById('progressCircle');
    const circumference = 2 * Math.PI * 42; // ~263.89
    const offset = circumference - (pct / 100) * circumference;
    circle.setAttribute('stroke-dasharray', circumference);
    circle.setAttribute('stroke-dashoffset', offset);
    document.getElementById('progressNum').textContent = todayWords;
    document.getElementById('progressLabel').textContent = '今日单词';

    // Today done tag
    const doneTag = document.getElementById('todayDoneTag');
    if (todayRec && todayRec.completed) {
      doneTag.innerHTML = '<span class="today-done">✅ 今日已完成</span>';
    } else if (todayWords > 0) {
      doneTag.innerHTML = `<span style="font-size:13px;color:var(--slate-400)">已学 ${todayWords}/${dailyMax} 个词</span>`;
    } else {
      doneTag.innerHTML = '';
    }

    // Start button
    const btnStart = document.getElementById('btnStart');
    const btnLabel = document.getElementById('btnStartLabel');
    if (todayRec && todayRec.completed) {
      btnLabel.textContent = '再学一轮';
      btnStart.style.opacity = '0.7';
    } else if (todayWords > 0) {
      btnLabel.textContent = '继续学习';
      btnStart.style.opacity = '1';
    } else {
      btnLabel.textContent = '开始学习';
      btnStart.style.opacity = '1';
    }

    // Review button
    const btnReview = document.getElementById('btnReview');
    if (dueCount > 0) {
      btnReview.style.display = 'flex';
      document.getElementById('reviewBadgeCount').textContent = dueCount;
    } else {
      btnReview.style.display = 'none';
    }

    // Yesterday section
    const yesterday = addDays(TODAY, -1);
    const yRec = appData.dailyHistory[yesterday];
    const ySection = document.getElementById('yesterdaySection');
    if (yRec && Object.keys(yRec.words).length > 0) {
      ySection.style.display = 'block';
      const chips = document.getElementById('yesterdayChips');
      chips.innerHTML = '';
      for (const [en, quality] of Object.entries(yRec.words)) {
        const w = WORD_BANK.find(w => w.en === en);
        const label = w ? `${w.en} (${w.zh.split(';')[0].replace(/^[a-z]+\.\s*/, '')})` : en;
        const cls = SRS.Q[quality] >= 3 ? 'chip chip-known' : 'chip chip-unknown';
        const symbol = SRS.Q[quality] >= 3 ? '✅' : '❌';
        chips.innerHTML += `<span class="${cls}">${symbol} ${label}</span>`;
      }

      ySection.style.display = 'none';

    }
    UI.switchPage('learn');
    UI.showCurrentWord();
  },

  startReview() {
    const count = Session.prepare(true);
    if (count === 0) {
      alert('✨ 当前没有需要复习的单词！');
      return;
    }
    UI.switchPage('learn');
    UI.showCurrentWord();
  },

  /* ---- Learning Flow ---- */
  showCurrentWord() {
    const item = Session.current();
    if (!item) {
      UI.finishLearning();
      return;
    }

    const { word, isReview } = item;
    const idx = Session.currentIdx;
    const total = Session.words.length;

    // Progress
    document.getElementById('learnProgressLabel').textContent = `第 ${idx + 1} 个词`;
    document.getElementById('learnProgressText').textContent = `${idx + 1} / ${total}`;
    document.getElementById('learnProgressFill').style.width = `${((idx + 1) / total) * 100}%`;

    // Companion bubble
    const bubble = document.getElementById('eeBubbleText');
    bubble.textContent = Companion.wordIntro(item);
    bubble.classList.remove('show');
    requestAnimationFrame(() => bubble.classList.add('show'));

    // Word card
    const card = document.getElementById('wordCard');
    card.classList.remove('swipe-out', 'fade-up');
    void card.offsetWidth;
    card.classList.add('fade-up');

    // Tags
    document.getElementById('reviewTag').style.display = isReview ? 'inline-block' : 'none';
    document.getElementById('newTag').style.display = isReview ? 'none' : 'inline-block';

    // Word content
    document.getElementById('wordEn').textContent = word.en;
    document.getElementById('wordPhonetic').textContent = word.ph || '';
    document.getElementById('wordCn').textContent = word.zh;

    // Examples
    const exDiv = document.getElementById('wordExamples');
    if (word.ex && word.ex.length > 0) {
      exDiv.innerHTML = word.ex.map(e =>
        `<div class="ex-en">📖 ${e.en}</div><div class="ex-zh">${e.zh}</div>`
      ).join('');
    } else {
      exDiv.innerHTML = '';
    }

    // Hide details
    document.getElementById('wordDetails').classList.remove('show');

    // Enable buttons
    document.querySelectorAll('.btn-learn').forEach(b => b.disabled = false);
  },

  speakWord() {
    const item = Session.current();
    if (!item) return;

    const btn = document.getElementById('btnSpeak');
    btn.classList.add('speaking');

    // Cancel any ongoing speech
    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(item.word.en);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    utterance.onend = () => btn.classList.remove('speaking');
    utterance.onerror = () => btn.classList.remove('speaking');
    speechSynthesis.speak(utterance);
  },

  assessWord(quality) {
    const item = Session.current();
    if (!item) return;

    // Auto-speak on first assessment
    // (already spoken on word reveal)

    // Show details
    document.getElementById('wordDetails').classList.add('show');

    // Disable buttons briefly
    document.querySelectorAll('.btn-learn').forEach(b => b.disabled = true);

    // Companion reaction
    const bubble = document.getElementById('eeBubbleText');
    bubble.textContent = Companion.reaction(quality);
    bubble.classList.remove('show');
    requestAnimationFrame(() => bubble.classList.add('show'));

    // Record
    Session.recordResponse(item.word.en, quality);

    // Auto advance after delay
    setTimeout(() => {
      if (Session.advance()) {
        UI.showCurrentWord();
      } else {
        UI.finishLearning();
      }
    }, 1200);
  },

  confirmQuit() {
    const stats = Session.getStats();
    if (stats.total === 0) {
      UI.goHome();
      return;
    }
    const msg = `你已完成 ${stats.total} 个词中的 ${stats.total} 个。\n\n确定要退出吗？退出后本次进度不会保存。`;
    if (confirm(msg)) {
      UI.goHome();
    }
  },

  /* ---- Complete ---- */
  finishLearning() {
    const stats = Session.getStats();
    Session.complete();

    const { emoji, title, detail } = Companion.completion(stats);
    document.getElementById('completeEmoji').textContent = emoji;
    document.getElementById('completeTitle').textContent = title;
    document.getElementById('completeDetail').textContent = detail;

    // Streak badge
    document.getElementById('completeStreak').innerHTML = `🔥 连续学习 ${calcStreak()} 天`;

    // Harvest chips
    const harvestDiv = document.getElementById('harvestChips');
    harvestDiv.innerHTML = '';
    for (const r of Session.results) {
      const w = WORD_BANK.find(w => w.en === r.en);
      const label = w ? `${w.en}` : r.en;
      const cls = SRS.Q[r.quality] >= 3 ? 'chip chip-known' : 'chip chip-unknown';
      const symbol = SRS.Q[r.quality] >= 3 ? '✅' : (SRS.Q[r.quality] === 2 ? '🧐' : '❌');
      harvestDiv.innerHTML += `<span class="${cls}">${symbol} ${label}</span>`;
    }

    // Tomorrow preview
    const previewSection = document.getElementById('previewSection');
    const dueTomorrow = SRS.getDueWords().filter(en => {
      const st = appData.wordStates[en];
      return st && st.nextReview && st.nextReview <= addDays(TODAY, 1);
    });
    if (dueTomorrow.length > 0) {
      previewSection.style.display = 'block';
      const previewChips = document.getElementById('previewChips');
      previewChips.innerHTML = dueTomorrow.slice(0, 10).map(en => {
        const w = WORD_BANK.find(w => w.en === en);
        return `<span class="preview-chip">${w ? w.en : en}</span>`;
      }).join('');
      if (dueTomorrow.length > 10) {
        previewChips.innerHTML += `<span class="preview-chip">+${dueTomorrow.length - 10} 更多</span>`;
      }
    } else {
      previewSection.style.display = 'none';
    }

    UI.switchPage('complete');
  },

  relearn() {
    const count = Session.prepare(false);
    if (count === 0) {
      alert('所有单词都在掌握中！');
      return;
    }
    UI.switchPage('learn');
    UI.showCurrentWord();
  },

  /* ---- Stats ---- */
  showStats() {
    const streak = calcStreak();
    const cat = SRS.categorize();

    document.getElementById('statsStreak').textContent = streak;
    document.getElementById('statsTotalDays').textContent = appData.totalDays;
    document.getElementById('statsMastered').textContent = cat.mastered;
    document.getElementById('statsInRotation').textContent = cat.review + cat.learning;

    // Calendar heatmap (last 90 days)
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    for (let i = 89; i >= 0; i--) {
      const date = addDays(TODAY, -i);
      const day = document.createElement('div');
      day.className = 'calendar-day';
      if (appData.studyDays[date]) day.classList.add('studied');
      day.title = date;
      grid.appendChild(day);
    }

    // Distribution
    const total = cat.total || 1;
    document.getElementById('distMastered').textContent = cat.mastered;
    document.getElementById('distMasteredBar').style.width = (cat.mastered / total * 100) + '%';
    document.getElementById('distReview').textContent = cat.review;
    document.getElementById('distReviewBar').style.width = (cat.review / total * 100) + '%';
    document.getElementById('distLearning').textContent = cat.learning;
    document.getElementById('distLearningBar').style.width = (cat.learning / total * 100) + '%';
    document.getElementById('distNew').textContent = cat.unseen;
    document.getElementById('distNewBar').style.width = (cat.unseen / total * 100) + '%';

    // Header button
    document.getElementById('headerStatsBtn').textContent = '🏠 首页';
    document.getElementById('headerStatsBtn').onclick = () => UI.goHome();

    UI.switchPage('stats');
  }
};

/* ================================================================
   INIT
   ================================================================ */
document.addEventListener('DOMContentLoaded', () => {
  UI.renderHome();

  // Auto-speak on first word reveal (not on page load, on actual word show)
  // Handled in showCurrentWord via the speak button
});
</script>
